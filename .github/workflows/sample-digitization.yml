name: Sample Digitization checks
on:
  pull_request:
    paths:
      - 'js/*digitization*.js'
      - 'css/sample-digitization.css'
      - 'services/sample-digitization/**'
      - 'supabase/functions/sample-digitization-worker/**'
      - 'supabase/migrations/**'
      - 'tests/digitization/**'
      - '.github/workflows/sample-digitization.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix tests/samples
      - run: node tests/digitization/database.cjs && node tests/digitization/core.cjs && node tests/digitization/gateway.cjs
      - run: python tests/digitization/extraction_test.py
      - run: node --check js/sample-digitization.js && node --check js/digitization-core.js
      - run: npm ci --prefix tests/policy-pdf
      - run: cd tests/policy-pdf && npx playwright install --with-deps chromium
      - run: pip install Pillow==11.3.0 && python tests/digitization/generate-fixtures.py
      - run: node tests/digitization/browser.cjs
