<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Señalización · revisión visual local</title>
  <style>
    @font-face{font-family:Aeonik;src:url(../../Aeonik-Regular.ttf)}
    @font-face{font-family:Replica;src:url("../../Replica Regular.otf")}
    :root{--brand-teal-dark:#007d73;--text-primary:#0b0b0b;--text-secondary:#444;--text-muted:#6b6b73;--surface:#fff;--surface2:#f5f5f5;--surface-hover:#f0f0f0;--bg:#fff;--border:#e5e5e5;--border-strong:#b8b8bd;--info-bg:rgba(0,159,255,.1);--info-border:rgba(0,159,255,.35);--warning-bg:rgba(255,197,41,.13);--warning-border:rgba(255,197,41,.35);--warning-text:#8b7000;--danger:#b40b0b;--r-sm:7px;--r-md:10px;--r-lg:12px;--panel-border:1px solid var(--border);--panel-radius:10px;--panel-padding:1.25rem 1.4rem;--section-gap:24px;--panel-gap:16px;--shadow-hover:0 8px 24px rgba(0,0,0,.08)}
    [data-theme=dark]{--text-primary:#f2f2f4;--text-secondary:#c4c4ca;--text-muted:#9a9aa2;--surface:#242426;--surface2:#2c2c2e;--surface-hover:#303033;--bg:#1c1c1e;--border:#3a3a3c;--border-strong:#55555a;--info-bg:rgba(0,159,255,.16);--warning-bg:#2a1f00;--warning-text:#f0b429;--shadow-hover:0 8px 24px rgba(0,0,0,.35)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text-primary);font-family:Aeonik,sans-serif}.shell{max-width:1440px;margin:auto;padding:28px}.header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}.header h1{font:400 32px Replica,sans-serif;margin:0}.header p{margin:5px 0 0;color:var(--text-muted)}.btn{min-height:36px;border-radius:7px;border:1px solid transparent;padding:0 14px;font:600 14px Aeonik;display:inline-flex;align-items:center;gap:6px}.btn-secondary{background:var(--surface);border-color:var(--border-strong);color:var(--text-primary)}.btn-ghost{background:transparent;color:var(--text-secondary)}.btn-sm{min-height:32px;font-size:13px;padding:0 10px}.panel{border:var(--panel-border);border-radius:var(--panel-radius);background:var(--surface)}.page-metrics{display:grid}.erp-table-wrap{border:1px solid var(--border);border-radius:10px;overflow:auto}.erp-table{border-collapse:collapse;width:100%;min-width:960px}.erp-table th{background:var(--surface2);font-size:11px;text-transform:uppercase;letter-spacing:.07em;text-align:left;color:var(--text-muted);padding:9px 11px}.erp-table td{border-top:1px solid var(--border);padding:10px 11px;font-size:13px}.erp-table th:last-child,.erp-table td:last-child{text-align:right}.empty-compact{border:1px dashed var(--border-strong);border-radius:10px;padding:18px;color:var(--text-muted)}
    .control-input{width:100%;min-height:36px;border:1px solid var(--border-strong);border-radius:7px;background:var(--surface);color:var(--text-primary);font:400 14px Aeonik;padding:0 10px}#sd-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;justify-content:flex-end}#sd-overlay.open{display:flex}.test-drawer{width:min(420px,100%);height:100%;background:var(--surface);padding:24px;overflow:auto;box-shadow:-10px 0 30px rgba(0,0,0,.2)}#sd-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted)}#sd-title{font:400 24px Replica;margin:4px 0 22px}
  </style>
  <link rel="stylesheet" href="../../css/signage-phase1.css">
</head>
<body>
  <main class="shell" id="content">
    <header class="header"><div><div id="tb-section" hidden></div><h1 id="sec-title"></h1><p id="sec-sub"></p></div><div id="product-controls"></div></header>
    <div id="pg"></div>
  </main>
  <div id="toast" aria-live="polite"></div>
  <div id="sd-overlay"><div class="test-drawer"><div id="sd-eyebrow"></div><div id="sd-title"></div><div id="sd-tabs"></div><div id="sd-body"></div></div></div>
  <div id="view-dashboard"></div><div id="view-styleguide"></div><div id="view-detail"></div><div id="view-samples"></div><div id="view-sample-detail"></div><div id="view-products"></div>
  <script>
    window.profile={full_name:'Persona sintética'};window.me={email:'synthetic@example.invalid'}
    if(new URLSearchParams(location.search).get('backend')==='1'){window.SIERRA_SIGNAGE_BACKEND_URL='/api/signage';window.SIERRA_SIGNAGE_LOCAL_ADMIN_TOKEN='local-admin-test-token'}
    function isAdmin(){return true}function syncModule(){}function renderSidebarTree(){}function leaveView(){}function setSecCrumbs(){}
    function siIcon(){return '<span aria-hidden="true">＋</span>'}function esc(v){const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML}function escAttr(v){return esc(v).replace(/"/g,'&quot;')}
    function emptyStateHtml(o){return `<div class="empty-compact"><b>${esc(o.title)}</b><p>${esc(o.desc||'')}</p></div>`}
    function toast(message){document.getElementById('toast').textContent=message}function openSideDrawer(options){document.getElementById('sd-eyebrow').textContent=options.eyebrow||'';document.getElementById('sd-title').textContent=options.title||'';document.getElementById('sd-overlay').classList.add('open');options.onTab?.(options.activeTab)}function closeSideDrawer(){document.getElementById('sd-overlay').classList.remove('open')}
  </script>
  <script src="../../js/signage-backend-client.js"></script>
  <script src="../../js/signage-live-share.js"></script>
  <script src="../../js/signage-pdf-presentations.js"></script>
  <script src="../../js/signage-phase1.js"></script>
  <script>const visualParams=new URLSearchParams(location.search);if(visualParams.get('theme')==='dark')document.documentElement.dataset.theme='dark';if(visualParams.get('reset')==='1')localStorage.removeItem(SignagePhase1.STORAGE_KEY);showSignage()</script>
</body>
</html>
