<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Certificados · visual QA</title>
  <link rel="stylesheet" href="../css/academy.css">
  <style>
    :root{--text:#2b2b2b;--text-3:#666;--border:#e5e5e5;--surface:#fff;--bg:#f5f5f5;--module-academy-light:#efefaf;--module-academy-dark:#827e00}
    body{margin:0;padding:32px;background:#e8ebe9;font-family:Aeonik,system-ui,sans-serif}
    main{display:grid;gap:32px;justify-content:center}.academy-sheet{box-shadow:0 18px 52px rgba(23,23,23,.18)}
  </style>
</head>
<body>
  <main id="qa"></main>
  <script>
    window.esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    window.escAttr=window.esc;window.policyDurableAssetUrl=value=>String(value||'');window.companyColor=value=>value;window.can=()=>true;
    window.siIcon=(name,size=24)=>`<svg class="si-icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="5"></circle><path d="M9 14l-1 7 4-2 4 2-1-7"></path></svg>`;
  </script>
  <script src="../js/academy.js"></script>
  <script>
    const diploma=academyDefault(),logoSvg=`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="120" viewBox="0 0 600 120"><rect width="120" height="120" fill="#003b32"/><text x="150" y="78" font-family="sans-serif" font-size="54" font-weight="700">PRIDE DENIM</text></svg>`,decorSvg=`<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#ffded3"/><circle cx="300" cy="400" r="230" fill="#ff6b35"/><circle cx="900" cy="400" r="230" fill="#ac4a27"/></svg>`;
    Object.assign(diploma,{companyId:'visual-qa',companyName:'Pride Denim Mills',companyLegalName:'Pride Denim Mills, S.A.',companyLogo:`data:image/svg+xml;charset=utf-8,${encodeURIComponent(logoSvg)}`,companyColor:'#FF6B35',location:'Pride Denim Mills',certificateTitle:'Certificado de participación',recipientName:'Luisa Alburez',recipients:[{uid:'luisa',name:'Luisa Alburez'}],courseTitle:'Liderazgo para operaciones textiles',courseDescription:'Por haber completado satisfactoriamente el programa de formación y demostrado los conocimientos requeridos.',certificateNo:'PDM-ACA-2026-014',laborRegistration:'90028481',decorMode:'image',decorImage:`data:image/svg+xml;charset=utf-8,${encodeURIComponent(decorSvg)}`});
    diploma.signers=[{uid:'one',name:'Pablo Hernández',title:'Vicepresidente',signature:''},{uid:'two',name:'María Fernanda López',title:'Directora de Talento',signature:''}];
    academyPrepareExportDocument(diploma).then(prepared=>{document.getElementById('qa').innerHTML=academyFrontHtml(prepared)+academyBackHtml(prepared);document.body.dataset.ready='true'}).catch(error=>{document.getElementById('qa').textContent=error.message;document.body.dataset.ready='error'});
  </script>
</body>
</html>
