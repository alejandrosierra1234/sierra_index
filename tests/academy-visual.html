<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Certificados · visual QA</title>
  <link rel="stylesheet" href="../css/academy.css">
  <style>
    :root{--text:#2b2b2b;--text-3:#666;--border:#e5e5e5;--surface:#fff;--bg:#f5f5f5;--module-academy-light:#efefaf;--module-academy-dark:#827e00}
    body{margin:0;padding:32px;background:#e8ebe9;font-family:Aeonik,system-ui,sans-serif}
    main{display:grid;gap:32px;justify-content:center}.academy-sheet{box-shadow:0 18px 52px rgba(23,23,23,.18)}
  </style>
</head>
<body>
  <main id="qa"></main>
  <script>
    window.esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    window.escAttr=window.esc;window.policyDurableAssetUrl=value=>String(value||'');window.companyColor=value=>value;window.can=()=>true;
    window.siIcon=(name,size=24)=>{const paths={calendar:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',building:'<path d="M5 21V4h14v17M3 21h18M9 8h1M14 8h1M9 12h1M14 12h1M9 16h1M14 16h1"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',book:'<path d="M4 5a3 3 0 0 1 3-2h5v17H7a3 3 0 0 0-3 2zM20 5a3 3 0 0 0-3-2h-5v17h5a3 3 0 0 1 3 2z"/>',certificate:'<rect x="4" y="4" width="16" height="13" rx="2"/><circle cx="15" cy="15" r="3"/><path d="M13 17v5l2-1 2 1v-5M8 8h8M8 12h3"/>'};return`<svg class="si-icon" data-icon="${name}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.certificate}</svg>`};
  </script>
  <script src="../js/academy.js"></script>
  <script>
    const diploma=academyDefault(),logoSvg=`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="120" viewBox="0 0 600 120"><rect width="120" height="120" fill="#003b32"/><text x="150" y="78" font-family="sans-serif" font-size="54" font-weight="700">PRIDE DENIM</text></svg>`,decorSvgs=['#FFDED3','#FF6B35','#AC4A27'].map((color,index)=>`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900"><rect width="900" height="900" fill="${color}"/><circle cx="${index%2?620:280}" cy="${index===2?620:280}" r="210" fill="${index===1?'#FFDED3':'#FFFFFF'}" fill-opacity=".72"/></svg>`),decorImages=decorSvgs.map(svg=>`data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`);
    Object.assign(diploma,{companyId:'visual-qa',companyName:'Pride Denim Mills',companyLegalName:'Pride Denim Mills, S.A.',companyLogo:`data:image/svg+xml;charset=utf-8,${encodeURIComponent(logoSvg)}`,companyColor:'#FF6B35',location:'Pride Denim Mills',certificateTitle:'Certificado de participación',recipientName:'Luisa Alburez',recipients:[{uid:'luisa',name:'Luisa Alburez'}],courseTitle:'Liderazgo para operaciones textiles',courseDescription:'Por haber completado satisfactoriamente el programa de formación y demostrado los conocimientos requeridos.',certificateNo:'PDM-ACA-2026-014',laborRegistration:'90028481',decorMode:'image',decorImage:decorImages[0],decorImages,decorPatternColumns:2});
    diploma.signers=[{uid:'one',name:'Pablo Hernández',title:'Vicepresidente',signature:''},{uid:'two',name:'María Fernanda López',title:'Directora de Talento',signature:''}];
    academyPrepareExportDocument(diploma).then(prepared=>{document.getElementById('qa').innerHTML=academyFrontHtml(prepared)+academyBackHtml(prepared);document.body.dataset.ready='true'}).catch(error=>{document.getElementById('qa').textContent=error.message;document.body.dataset.ready='error'});
  </script>
</body>
</html>
