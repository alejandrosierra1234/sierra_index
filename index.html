    .u-role { font-size:0.68rem; color:var(--text-3); }
    .logout-btn { font-size:0.75rem; color:var(--text-3); background:none; border:none; cursor:pointer; padding:0.3rem 0.45rem; border-radius:6px; font-family:inherit; transition:color 0.15s; }
    .logout-btn:hover { color:var(--text); }

    /* â”€â”€ LAYOUT â”€â”€ */
    .main { display:flex; flex:1; overflow:hidden; background:var(--sidebar-bg); }

    /* â”€â”€ SIDEBAR â”€â”€ */
    .sidebar {
      width:var(--sidebar-width); background:var(--sidebar-bg);
      padding:0.9rem 0.65rem 0.65rem; display:flex; flex-direction:column; gap:1px;
      flex-shrink:0; overflow-y:auto; overflow-x:hidden; position:relative;
      transition:width 0.32s cubic-bezier(0.22,1,0.36,1), padding 0.32s cubic-bezier(0.22,1,0.36,1);
      will-change:width;
    }
    .sidebar.collapsed {
      width:var(--sidebar-width-collapsed); overflow:visible;
      padding-left:0; padding-right:0;
      align-items:center;
    }

    /* Sidebar header: logo + optional close btn */
    .sidebar-hdr { display:flex; align-items:center; justify-content:flex-start; padding:0 0.15rem 0.75rem; flex-shrink:0; min-height:34px; width:100%; position:relative; transition:padding 0.32s cubic-bezier(0.22,1,0.36,1); }
    .sidebar-brand-btn { display:flex; align-items:center; flex:1; min-width:0; height:34px; border:1px solid transparent; border-radius:9px; background:none; color:var(--text); cursor:pointer; padding:0; font-family:inherit; position:relative; transition:background 0.12s, border-color 0.12s, width 0.32s cubic-bezier(0.22,1,0.36,1); }
    .sidebar-brand-btn:hover { background:var(--surface2); border-color:var(--border); }
    .sidebar.collapsed .sidebar-brand-btn { flex:0 0 36px; width:36px; justify-content:center; overflow:visible; }
    .sidebar-close-btn { display:none; margin-left:auto; width:32px; height:32px; border-radius:8px; background:none; border:none; cursor:pointer; color:var(--text-3); align-items:center; justify-content:center; transition:background 0.12s; flex-shrink:0; }
    .sidebar-close-btn:hover { background:var(--surface2); color:var(--text); }
    .sidebar-close-btn svg { width:16px; height:16px; }
    .sidebar-logo-full { opacity:1; transform:scale(1); transform-origin:left center; transition:opacity 0.18s ease, transform 0.32s cubic-bezier(0.22,1,0.36,1); }
    .sidebar-logo-full svg { height:18px; width:auto; display:block; }
    .sidebar-logo-icon { position:absolute; left:50%; top:0; bottom:0; display:flex; align-items:center; opacity:0; transform:translateX(-50%) scale(0.92); pointer-events:none; transition:opacity 0.18s ease 0.08s, transform 0.32s cubic-bezier(0.22,1,0.36,1); }
    .sidebar-logo-icon svg { height:18px; width:auto; display:block; }
    .sidebar-expand-icon { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--text-2); opacity:0; transform:scale(0.9); pointer-events:none; transition:opacity 0.14s ease, transform 0.2s cubic-bezier(0.22,1,0.36,1), color 0.12s; }
    .sidebar-expand-icon svg { width:18px; height:18px; display:block; }
    .sidebar.collapsed .sidebar-logo-full { opacity:0; transform:scale(0.94); pointer-events:none; }
    .sidebar.collapsed .sidebar-logo-icon { opacity:1; transform:translateX(-50%) scale(1); }
    .sidebar.collapsed .sidebar-brand-btn:hover .sidebar-logo-icon { opacity:0; transform:translateX(-50%) scale(0.86); transition-delay:0s; }
    .sidebar.collapsed .sidebar-brand-btn:hover .sidebar-expand-icon { opacity:1; transform:scale(1); }
    .sidebar.collapsed .sidebar-hdr { justify-content:center; padding:0 0 0.75rem; }
    [data-theme="dark"] .sidebar-logo-full .cls-2 { fill:#e8e8e8; }
    [data-theme="dark"] .sidebar-logo-icon .cls-1 { fill:#16cdbe; }

    /* Anchored to the top nav cluster (Search row), not vertically centered
       on the sidebar's full height â€” the sidebar's remaining height is
       whatever the active module's tree leaves over (often much less than
       the viewport), so a 50%-centered toggle used to drift into that dead
       space and read as an orphaned control unrelated to anything around
       it. Pinned near the top, it reads as a fixed part of the shell. */
    .sidebar-edge-toggle {
      position:absolute; right:-13px; top:17px; width:26px; height:34px;
      display:flex; align-items:center; justify-content:center;
      border:1px solid var(--border); border-radius:9px;
      background:var(--surface); color:var(--text-3); box-shadow:var(--shadow);
      cursor:pointer; opacity:0; pointer-events:auto; z-index:850;
      transform:scale(0.92);
      transition:opacity 0.14s ease, transform 0.18s cubic-bezier(0.22,1,0.36,1), background 0.12s, color 0.12s, border-color 0.12s;
    }
    .sidebar:hover .sidebar-edge-toggle,
    .sidebar-edge-toggle:hover,
    .sidebar-edge-toggle:focus-visible { opacity:1; transform:scale(1); }
    .sidebar-edge-toggle:hover { background:var(--surface2); color:var(--text); border-color:var(--border-strong); }
    /* Keyboard focus must stay visible even though this control fades to
       opacity:0 at rest (only the hover reveal above shows it to a mouse
       user) â€” without this, tabbing to the control leaves its outline
       rendered at opacity:0, i.e. invisible (WCAG 2.4.7). */
    .sidebar-edge-toggle:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .sidebar-edge-toggle svg { width:16px; height:16px; display:block; }
    .sidebar-edge-toggle .edge-expand { display:none; }
    .sidebar.collapsed .sidebar-edge-toggle .edge-collapse { display:none; }
    .sidebar.collapsed .sidebar-edge-toggle .edge-expand { display:block; }

    /* Toggle button â€” always visible in sidebar-bottom */
    .sidebar-collapse-btn { display:none; }

    /* Nav labels â€” fade and contract when collapsed */
    /* SIERRA_DESIGN_SYSTEM.md Â§7b: navigation labels are on the "never
       truncate" list â€” ellipsis/clipping is explicitly disallowed here,
       and the sanctioned overflow strategy is the existing icon-only
       collapsed state (Â§64.9), not a half-readable label. A long or
       localized label that doesn't fit on one line therefore wraps
       instead of clipping; min-width:0 lets it actually shrink inside
       the flex row instead of overflowing, and the row's own min-height
       (not a fixed height) absorbs the extra line per Â§7b's closing
       principle ("row may become slightly taller... less important than
       readable content"). max-width stays as a large, generous ceiling
       purely so the collapse-mode transition below still has a numeric
       value to animate from. */
    .nav-label { white-space:normal; overflow-wrap:break-word; overflow:hidden; min-width:0; max-width:500px; opacity:1; transform:translateX(0); transition:opacity 0.18s ease, transform 0.28s cubic-bezier(0.22,1,0.36,1), max-width 0.28s cubic-bezier(0.22,1,0.36,1); }
    .sidebar.collapsed .nav-label { max-width:0; opacity:0; transform:translateX(-4px); pointer-events:none; }
    .sidebar.collapsed #sidebar-search-btn .nav-label:last-child { margin-left:0 !important; padding-left:0 !important; padding-right:0 !important; border-width:0 !important; }
    .s-label {
      display:block; max-height:28px; opacity:1; transform:translateX(0); overflow:hidden;
      font-size:0.66rem; font-weight:650; text-transform:uppercase; letter-spacing:0.08em;
      color:var(--text-3); padding:0.4rem 0.55rem 0.2rem;
      transition:opacity 0.18s ease, transform 0.28s cubic-bezier(0.22,1,0.36,1), max-height 0.28s cubic-bezier(0.22,1,0.36,1), padding 0.28s cubic-bezier(0.22,1,0.36,1), margin 0.28s cubic-bezier(0.22,1,0.36,1);
    }
    .sidebar.collapsed .s-label {
      max-height:0; max-width:0; opacity:0; transform:translateX(-4px);
      padding:0 !important; margin-top:0 !important; pointer-events:none;
      white-space:nowrap;
    }
    .sidebar-user-info { max-width:120px; opacity:1; transform:translateX(0); transition:opacity 0.18s ease, transform 0.28s cubic-bezier(0.22,1,0.36,1), max-width 0.28s cubic-bezier(0.22,1,0.36,1); }
    .sidebar.collapsed .sidebar-user-info { max-width:0; opacity:0; transform:translateX(-4px); pointer-events:none; }
    /* Square nav buttons when collapsed â€” 40px is the canonical collapsed
       navigation-row geometry (SIERRA_DESIGN_SYSTEM.md Â§64.7), the same
       fixed size as the expanded rail's global/division rows, so the
       collapsed rail isn't a smaller, cramped version of the expanded one
       (Â§12, Â§17). This is the navigation-row system, not the Â§24
       operational control tiers â€” do not tokenize with --control-h. */
    .sidebar.collapsed .nav-item {
      width:40px; height:40px; padding:0;
      justify-content:center; align-items:center;
      gap:0; border-radius:var(--control-radius); overflow:visible;
    }
    .sidebar.collapsed .sidebar-bottom { align-items:center; width:100%; }
    .sidebar.collapsed .sidebar-bottom .nav-item { width:40px; height:40px; }
    .sidebar.collapsed .sidebar-spacer { width:100%; }

    /* Icon color â€” neutral at rest AND on hover; brand teal only on the
       truly active leaf. Hover reveals interactivity, it does not preview
       the active accent color (SIERRA_DESIGN_SYSTEM.md Â§42.6/Â§54/Â§64.8) â€”
       --item-color (still set per-button for any future resting-state
       use) must never drive hover/active either; that would repaint
       navigation in a secondary color. */
    .nav-item .n-icon { color:var(--text-3); transition:color 0.15s; }
    .nav-item.active .n-icon { color:var(--accent); }

    /* â”€â”€ COLLAPSED TOOLTIPS â€” theme-native label pill â”€â”€ */
    .sidebar.collapsed .nav-item,
    .sidebar.collapsed .sidebar-user,
    .sidebar.collapsed .sidebar-brand-btn { position:relative; }
    .sidebar.collapsed .nav-item[data-tip]:hover::after,
    .sidebar.collapsed .sidebar-user[data-tip]:hover::after,
    .sidebar.collapsed .sidebar-brand-btn[data-tip]:hover::after {
      content: attr(data-tip);
      position:absolute; left:calc(100% + 10px); top:50%; transform:translateY(-50%);
      background:var(--surface); color:var(--text);
      border:1px solid var(--border);
      font-size:0.78rem; font-weight:500; white-space:nowrap;
      padding:0 0.72rem; height:34px; line-height:34px;
      border-radius:9px; box-shadow:var(--shadow);
      pointer-events:none; z-index:900;
    }
    .sidebar.collapsed .nav-item[data-tip]:hover::before,
    .sidebar.collapsed .sidebar-user[data-tip]:hover::before,
    .sidebar.collapsed .sidebar-brand-btn[data-tip]:hover::before {
      content:''; position:absolute; left:calc(100% + 5px); top:50%;
      width:8px; height:8px; transform:translateY(-50%) rotate(45deg);
      background:var(--surface); border-left:1px solid var(--border); border-bottom:1px solid var(--border);
      z-index:901; pointer-events:none;
    }

    /* Sidebar toggle is the brand mark; keep the bottom rail for user actions. */
    .sidebar-toggle-btn { display:none !important; }

    /* â”€â”€ POPOVER / DROPDOWN MENU PRIMITIVE â”€â”€
       Canonical shell + menu-row styling for every anchored popover in the
       app: module switcher, business-unit switcher, account menu, and the
       workspace "more"/price/invite flyouts (.ws-pop, see Â§ws-pop below).
       Two open mechanics both compose this shell rather than redefining
       it: ancestor-driven (".xxx.open .xxx-pop", used by switcher-style
       triggers that live inside a labeled wrapper â€” mod/bu/account menus)
       and self-toggled (".ws-pop.open", used by icon-button flyouts). Do
       not add a new popover implementation â€” extend the shared shell rule
       (below) and .pop-menu-item. Documented in SIERRA_DESIGN_SYSTEM.md
       Â§Popover / Dropdown Menu. */
    .pop-menu-item, .ws-menu-item, .card-more-item {
      display:flex; align-items:center; gap:10px; width:100%; text-align:left; min-height:32px;
      background:none; border:none; font-family:inherit; padding:5px 10px; border-radius:var(--r-sm);
      cursor:pointer; font-size:var(--body-size); font-weight:500; color:var(--text-primary);
      transition:background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
    }
    .pop-menu-item:hover, .ws-menu-item:hover, .card-more-item:hover { background:var(--surface-hover); color:var(--text-primary); }
    .pop-menu-item.current { color:var(--text); font-weight:600; }
    .pop-menu-item.danger, .ws-menu-danger, .card-more-item.danger { color:var(--danger); }
    [data-theme="dark"] .pop-menu-item.danger,
    [data-theme="dark"] .ws-menu-danger,
    [data-theme="dark"] .card-more-item.danger { color:var(--danger); }
    .pop-menu-item .pop-menu-dot { width:16px; height:16px; border-radius:6px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
    .pop-menu-item .pop-menu-dot svg { width:10px; height:10px; }
    .pop-menu-sep { height:1px; background:var(--border); margin:0.3rem 0.2rem; }
    .pop-menu-hint { font-size:0.74rem; color:var(--text-3); margin:0.1rem 0.3rem 0.5rem; }

    /* â”€â”€ ACTIVE MODULE TREE (Â§4/Â§5/Â§29) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
       Four sidebar zones: Global (Dashboard) â†’ Favorites â†’ Module Switcher
       â†’ Active module tree (Divisions, accordion â€” one open at a time â€”
       then Tools) â†’ Utility (Website). Only the *active* module's
       divisions/tools ever render here; every other module lives behind
       the Module Switcher, never as a permanent peer block. Built from
       .nav-item (inherits collapsed-rail, tooltip, hover, active-state)
       plus a chevron + one fixed indentation step per depth. See
       renderSidebarTree()/moduleSwitcher* in index.html and
       SIERRA_DESIGN_SYSTEM.md Â§61. */
    .nav-fav-empty { padding:0.3rem 0.55rem 0.6rem; font-size:0.72rem; color:var(--text-3); }
    /* Favorite toggle â€” a small utility star, trailing in a favoritable
       leaf row. Hidden until hover/focus/favorited so it never competes
       with the icon+label identity of the row (Â§20/Â§22: favorites are
       navigation shortcuts, not a second entity system). Filled+teal
       when favorited, matching the existing "you are here" accent
       convention used by .nav-item.active's icon color. */
    .nav-fav-btn { margin-left:auto; flex-shrink:0; width:22px; height:22px; display:flex; align-items:center; justify-content:center; border-radius:6px; color:var(--text-3); opacity:0; transition:opacity 0.12s, color 0.12s, background 0.12s; }
    .nav-fav-btn svg { width:13px; height:13px; }
    .nav-item:hover .nav-fav-btn, .nav-fav-btn.is-fav { opacity:1; }
    .nav-fav-btn:hover { background:var(--surface2); color:var(--text); }
    .nav-fav-btn.is-fav { color:var(--accent); }
    .nav-fav-btn.is-fav svg path { fill:var(--accent); }
    .sidebar.collapsed .nav-fav-btn { display:none; }
    .nav-fav-list { display:flex; flex-direction:column; gap:1px; }
    .nav-fav-list .nav-item.nav-tree-leaf.lvl2 { padding-left:0.55rem; }
    /* Chevrons (Â§25) â€” only ever on a row that actually expands/collapses
       (a division). Small, neutral, never on a leaf. */
    .nav-tree-chevron { display:inline-flex; flex-shrink:0; color:var(--text-3); transition:transform var(--dur-fast) var(--ease-out); }
    .nav-tree-chevron.expanded { transform:rotate(90deg); }
    .nav-tree-children { display:flex; flex-direction:column; gap:1px; }
    .nav-tree-children.collapsed { display:none; }
    /* Indentation system (Â§11) â€” one fixed step per depth, never manual
       positioning. Level 1 = division row / module-level tool (26px
       content inset); Level 2 = a division's own screens (52px). */
    .nav-item.nav-tree-div,
    .nav-item.nav-tree-leaf.lvl2 { padding-left:26px; }
    .nav-item.nav-tree-leaf.lvl3 { padding-left:52px; }
    /* Child rows (Â§10/Â§22): 36-38px, regular weight â€” one step lighter
       than the 40px/medium-weight division and global rows above them. */
    .nav-item.nav-tree-leaf { min-height:37px; font-weight:400; }
    .nav-item.nav-tree-leaf.active { font-weight:600; }
    .sidebar.collapsed .nav-tree-children { display:none !important; }
    /* Collapsed rail (Â§15): only the current/expanded division's IconTile
       shows â€” every other division row is hidden outright, not just its
       children â€” so the rail never turns into a second, cramped copy of
       the expanded tree. No chevron clutter since there's nothing to
       expand in place (a click re-opens the full sidebar). */
    .sidebar.collapsed .nav-tree-chevron { display:none; }
    .sidebar.collapsed .nav-tree-div:not(.nav-current-div) { display:none; }
    /* .nav-item.nav-tree-div/.nav-tree-leaf.lvl2/.lvl3 (Â§ Indentation
       system) set padding-left for the EXPANDED tree's indent steps.
       That rule has the same specificity as .sidebar.collapsed .nav-item
       {padding:0} and sits later in the stylesheet, so it was winning
       the cascade and leaving the icon tile pushed 26-52px off-center
       in the 40px collapsed rail â€” every division/tree row read as
       shifted/crooked next to the centered plain nav icons above and
       below it. Force it back to 0 with a more specific selector. */
    .sidebar.collapsed .nav-item.nav-tree-div,
    .sidebar.collapsed .nav-item.nav-tree-leaf.lvl2,
    .sidebar.collapsed .nav-item.nav-tree-leaf.lvl3 { padding-left:0; }

    /* â”€â”€ MODULE SWITCHER (Â§3) â€” the one control for changing between
       top-level INDEX modules (Muestras / Talento Humano / Index / â€¦).
       Anchored, searchable popover; ancestor-driven open mechanic, same
       family as the account menu below. The active module's tree is the
       only one ever rendered in #nav-tree â€” every other module lives
       here, never as a permanent sidebar block (Â§4/Â§30). */
    /* Elevated "current module" card â€” the switcher trigger is the one
       persistent per-visit orientation cue ("which mÃ³dulo am I in"),
       distinct from the repeated rows in the tree below it, so it gets a
       real card surface (existing --surface/--border/--shadow tokens)
       instead of inheriting the plain transparent .nav-item look. Row
       height/typography stay exactly the protected Â§64.7 values â€” only
       the container surface changes, and the divider below it gives the
       Module-switcher zone (Â§64.1) a clear boundary from the active-
       module tree that follows. */
    .mod-switcher { position:relative; padding:0.55rem 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
    /* .nav-item.mod-switcher-trigger (not just .mod-switcher-trigger): the
       base .nav-item rule is declared later in the sheet and, at equal
       single-class specificity, its background:none/border:1px solid
       transparent would otherwise win by source order and silently erase
       this card treatment. */
    .nav-item.mod-switcher-trigger {
      justify-content:flex-start;
      background:var(--surface); border-color:var(--border); box-shadow:var(--shadow);
    }
    .nav-item.mod-switcher-trigger:hover { background:var(--surface2); border-color:var(--border-strong); box-shadow:var(--shadow); }
    .mod-switcher.open .nav-item.mod-switcher-trigger { border-color:var(--border-strong); }
    .mod-switcher-chevron { display:inline-flex; flex-shrink:0; margin-left:auto; color:var(--text-3); }
    .sidebar.collapsed .mod-switcher-chevron { display:none; }
    .mod-switcher-pop {
      position:absolute; left:0; right:0; top:calc(100% + 4px); min-width:240px;
      background:var(--surface); border:1px solid var(--border); border-radius:12px;
      box-shadow:var(--shadow-hover); padding:0.3rem; z-index:150;
      opacity:0; pointer-events:none; transform:translateY(-4px) scale(0.98);
      transition:opacity var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
    }
    .mod-switcher.open .mod-switcher-pop { opacity:1; pointer-events:auto; transform:translateY(0) scale(1); }
    .sidebar.collapsed .mod-switcher-pop { left:calc(100% + 10px); right:auto; top:0; width:260px; }
    .mod-switch-search-wrap { padding:2px 4px 6px; }
    .mod-switch-search-wrap .control-input { width:100%; height:var(--control-h-sm); font-size:0.8rem; }
    .mod-switch-list { display:flex; flex-direction:column; gap:1px; max-height:340px; overflow-y:auto; }
    .mod-switch-hdr { font-size:0.62rem; font-weight:650; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-3); padding:0.5rem 0.6rem 0.25rem; }
    .mod-switch-row-label { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    /* Selected module (Â§"Module Identity"): recognizable without relying on
       bold text alone â€” a very subtle wash of the module's own tint plus a
       thin identity-colored indicator on the leading edge, echoing (not
       copying) the sidebar's teal active-indicator idiom. Kept intentionally
       faint â€” this is the one place a module hue is allowed to touch a row
       background, and only at ~12% strength. */
    .mod-switch-row { position:relative; }
    .mod-switch-row.current { background:color-mix(in srgb, var(--row-tint, var(--surface-hover)) 12%, var(--surface)); }
    .mod-switch-row.current .mod-switch-row-label { color:var(--text); }
    .mod-switch-row.current::before {
      content:''; position:absolute; left:0; top:6px; bottom:6px; width:3px;
      border-radius:0 3px 3px 0; background:var(--row-accent, var(--accent));
    }

    /* â”€â”€ Account menu â”€â”€
       Sidebar identity click opens this instead of jumping straight to the
       profile modal â€” structured entry point for Profile / Notifications /
       Appearance / Administration / Help / Log out. Same ancestor-driven
       open mechanic as the switchers above. */
    .acct-menu { position:relative; }
    .acct-menu-pop {
      position:absolute; left:0.6rem; right:0.6rem; bottom:calc(100% + 6px); top:auto; min-width:200px;
      background:var(--surface); border:1px solid var(--border); border-radius:12px;
      box-shadow:var(--shadow-hover); padding:0.3rem; z-index:150;
      opacity:0; pointer-events:none; transform:translateY(-4px) scale(0.98);
      transition:opacity var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
    }
    .acct-menu.open .acct-menu-pop { opacity:1; pointer-events:auto; transform:translateY(0) scale(1); }
    .sidebar.collapsed .acct-menu-pop { display:none; }

    /* Search / Notifications / Appearance / Account now live in the
       Global System Bar (desktop, >=768px) â€” the sidebar stays focused
       exclusively on ERP navigation there. Below 768px the system bar
       is hidden in favor of .mob-topbar, which has no equivalent for
       these, so the mobile drawer keeps them (see @media(max-width:767px)
       "Restore sidebar-bottom in mobile drawer" below). */
    @media (min-width: 768px) {
      #sidebar-search-btn, #notif-btn, #theme-btn, #acct-menu { display: none !important; }
    }

    /* Standard row height (Â§10): 40px for global/division rows, 36-38px for
       child leaves (see .nav-tree-leaf below) â€” never an arbitrary height. */
    .nav-item {
      display:flex; align-items:center; gap:0.55rem; position:relative;
      min-height:40px; padding:0 0.55rem; border-radius:8px; cursor:pointer;
      font-size:0.875rem; font-weight:500; color:var(--text-2);
      transition:background 0.12s, color 0.12s, border-color 0.12s, width 0.32s cubic-bezier(0.22,1,0.36,1), height 0.32s cubic-bezier(0.22,1,0.36,1), padding 0.32s cubic-bezier(0.22,1,0.36,1), gap 0.32s cubic-bezier(0.22,1,0.36,1), border-radius 0.32s cubic-bezier(0.22,1,0.36,1);
      border:1px solid transparent; background:none; width:100%; text-align:left; font-family:inherit; overflow:hidden;
    }
    .nav-item:hover { background:var(--surface2); color:var(--text); }
    /* Active state (Â§8/Â§26): a restrained ERP treatment â€” subtle surface +
       a 3px teal indicator riding the row's left edge + stronger text.
       Never a bordered box/pill; never combined with a colored icon AND
       colored text AND a border all at once. */
    .nav-item.active { background:var(--surface2); border-color:transparent; color:var(--text); font-weight:600; }
    [data-theme="dark"] .nav-item.active { background:rgba(255,255,255,0.06); }
    .nav-item.active::before {
      content:''; position:absolute; left:0; top:6px; bottom:6px; width:3px;
      border-radius:0 3px 3px 0; background:var(--accent);
    }
    .n-icon { width:18px; height:18px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
    .n-icon svg { width:18px; height:18px; }
    /* Small trailing indicator on rows that leave the app (Website) rather
       than route within it â€” muted, right-aligned, hidden when the sidebar
       is collapsed (its own icon square already stands alone at that
       point, same treatment as .nav-label). */
    .nav-ext-icon { width:13px; height:13px; margin-left:auto; color:var(--text-3); }
    .nav-ext-icon svg { width:13px; height:13px; }
    .sidebar.collapsed .nav-ext-icon { display:none; }
    /* IconTile (Â§6/Â§7/Â§23) â€” the one place a division/module identity
       color is allowed to appear. Text, chevrons and borders stay neutral;
       color is concentrated inside this tile only. */
    .nav-icon-tile {
      width:24px; height:24px; border-radius:6px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      background:var(--tile-bg, var(--surface2)); color:var(--tile-fg, var(--text-3));
    }
    .nav-icon-tile svg { width:14px; height:14px; }

    /* Sidebar user card at bottom */
    .sidebar-user { display:flex; align-items:center; gap:0.55rem; padding:0.5rem 0.4rem; border-radius:8px; cursor:pointer; transition:background 0.12s, width 0.32s cubic-bezier(0.22,1,0.36,1), height 0.32s cubic-bezier(0.22,1,0.36,1), padding 0.32s cubic-bezier(0.22,1,0.36,1), gap 0.32s cubic-bezier(0.22,1,0.36,1), border-radius 0.32s cubic-bezier(0.22,1,0.36,1); flex-shrink:0; overflow:hidden; }
    .sidebar-user:hover { background:var(--surface2); }
    .sidebar-profile-icon { display:none; width:20px; height:20px; align-items:center; justify-content:center; flex-shrink:0; color:var(--text-3); transition:color 0.15s; }
    .sidebar-profile-icon svg { width:20px; height:20px; display:block; }
    .sidebar-user:hover .sidebar-profile-icon { color:var(--text); }
    .sidebar-user-info { min-width:0; flex:1; overflow:hidden; }
    .sidebar-user-name { font-size:0.78rem; font-weight:600; color:var(--text); white-space:normal; overflow-wrap:break-word; }
    .sidebar-user-role { font-size:0.65rem; color:var(--text-3); }
    .sidebar-spacer { flex:1; min-height:0.5rem; }
    /* Sidebar bottom actions (toggle, theme, user) */
    .sidebar-bottom { flex-shrink:0; border-top:1px solid var(--border); padding-top:0.5rem; display:flex; flex-direction:column; gap:1px; transition:align-items 0.32s cubic-bezier(0.22,1,0.36,1); }
    .sidebar-user-row { display:flex; align-items:center; gap:2px; transition:gap 0.32s cubic-bezier(0.22,1,0.36,1); }
    .sidebar-user-row .sidebar-user { flex:1; min-width:0; border-radius:8px; }
    .sidebar.collapsed .sidebar-user-row { align-items:center; width:100%; }
    .sidebar.collapsed .sidebar-user-row .sidebar-user { width:36px; height:36px; flex:0 0 36px; }
    .sidebar.collapsed .sidebar-user { justify-content:center; align-items:center; padding:0; gap:0; border-radius:9px; overflow:visible; }
    .sidebar.collapsed .sidebar-user .u-avatar { display:none !important; }
    .sidebar.collapsed .sidebar-profile-icon { display:flex; }

    /* Drawer backdrop (mobile) */
    .drawer-backdrop { visibility:hidden; pointer-events:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:398; opacity:0; transition:opacity 0.25s, visibility 0.25s; backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px); }
    .drawer-backdrop.open { visibility:visible; pointer-events:auto; opacity:1; }
    /* The export drawer's own content (checkboxes, radios, preview text)
       needs to stay perfectly crisp â€” some browsers visibly bleed a
       backdrop-filter blur into sibling position:fixed layers once a
       transform is involved (the drawer's open/close slide), which reads
       as the panel itself being out of focus. Dim only, no blur, here. */
    #org-export-drawer-backdrop { backdrop-filter:none; -webkit-backdrop-filter:none; }
    .org-export-drawer.drawer { z-index:401; }

    /* Mobile topbar icon buttons (kept for compat) */
    .mob-icon-btn { display:none; width:34px; height:34px; border-radius:8px; background:none; border:none; cursor:pointer; color:var(--text-2); align-items:center; justify-content:center; flex-shrink:0; transition:background 0.12s; }
    .mob-icon-btn:hover { background:var(--surface2); color:var(--text); }
    .mob-icon-btn svg { width:18px; height:18px; }
    /* Mobile floating drawer button â€” hidden, replaced by mob-topbar */
    .mob-fab { display:none; }

    /* Mobile top bar */
    .mob-topbar {
      display:none;
      position:fixed; top:0; left:0; right:0; z-index:350;
      height:calc(env(safe-area-inset-top) + 52px);
      padding-top:env(safe-area-inset-top);
      background:var(--bg); border-bottom:1px solid var(--border);
      align-items:center; justify-content:space-between;
      padding-left:0.85rem; padding-right:0.85rem;
      gap:0.6rem;
    }
    .mob-topbar-menu {
      width:44px; height:44px; border-radius:11px;
      background:none; border:none; cursor:pointer;
      color:var(--text-2); display:flex; align-items:center; justify-content:center;
      flex-shrink:0; transition:background 0.12s; margin-left:-6px;
    }
    .mob-topbar-menu:hover { background:var(--surface2); }
    .mob-topbar-menu svg { width:20px; height:20px; }
    .mob-topbar-logo { flex:1; display:flex; align-items:center; justify-content:center; }
    .mob-topbar-logo svg { height:16px; width:auto; display:block; }
    [data-theme="dark"] .mob-topbar-logo .cls-2 { fill:#e8e8e8; }
    .mob-topbar-search {
      width:44px; height:44px; border-radius:11px;
      background:none; border:none; cursor:pointer;
      color:var(--text-2); display:flex; align-items:center; justify-content:center;
      flex-shrink:0; transition:background 0.12s; margin-right:-6px;
    }
    .mob-topbar-search:hover { background:var(--surface2); }
    .mob-topbar-search svg { width:20px; height:20px; }

    /* â”€â”€ CONTENT â”€â”€ */
    /* â”€â”€ Main panel â”€â”€ sidebar's sibling: a column of [context shell]
       + [white workspace], both spanning the same width so the shell
       region reads as a real horizontal band above the workspace, not an
       overlay on top of it (Â§ navigation architecture, "shell tells me
       WHERE, workspace tells me WHAT"). */
    .main-panel { display:flex; flex-direction:column; flex:1; min-width:0; overflow:hidden; }

    /* â”€â”€ Context shell â”€â”€ the ONE place back navigation + breadcrumbs
       live, for every screen. Lives in the gray application shell,
       between the global system bar and the white workspace â€” physically
       outside #content, never duplicated inside a tool. Deliberately
       plain: no card, no border, no pill background â€” it sits directly on
       the shell's own gray plane. See setSecCrumbs()/clearSecCrumbs()/
       crumbHtml(). */
    .ctx-shell { flex-shrink:0; padding:0.6rem var(--page-padding-x) 0.1rem; }
    .sec-crumb { display:flex; align-items:center; gap:0.3rem; font-size:0.85rem; line-height:1.3; flex-wrap:wrap; }
    .sec-crumb-back { display:inline-flex; align-items:center; gap:0.3rem; background:none; border:none; padding:0.15rem 0.3rem; margin:-0.15rem -0.3rem; color:var(--text-2); font-size:0.85rem; font-weight:500; cursor:pointer; border-radius:6px; }
    .sec-crumb-back:hover { color:var(--text-primary); background:var(--surface-hover); }
    .sec-crumb-back svg { width:14px; height:14px; flex-shrink:0; }
    .sec-crumb-link { background:none; border:none; padding:0.1rem 0.15rem; margin:-0.1rem -0.15rem; color:var(--text-2); font-size:0.85rem; font-weight:500; cursor:pointer; border-radius:6px; }
    .sec-crumb-link:hover { color:var(--text-primary); background:var(--surface-hover); }
    .sec-crumb-current { color:var(--text-primary); font-weight:600; padding:0.1rem 0.15rem; }
    .sec-crumb-sep { color:var(--text-3); }

    .content {
      flex:1; overflow-y:auto; padding:var(--page-padding-y) var(--page-padding-x);
      background:var(--workspace-bg);
      /* Architectural corner where the workspace meets the sidebar/shell
         junction (Â§13) â€” subtle and structural, not a card. Only the
         top-left corner: workspace still reads as one continuous plane
         against the sidebar on its right/bottom edges. */
      border-top-left-radius:var(--shell-radius);
    }
    .content-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.1rem; gap:1rem; flex-wrap:wrap; }
    .content-hdr-l h2 { font-family:"Replica", -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif; font-size:2rem; font-weight:700; letter-spacing:-0.035em; line-height:1.1; }
    .content-hdr-l p { font-size:0.8rem; color:var(--text-2); margin-top:0.2rem; }
    .content-hdr-l p:empty { display:none; }
    .content-hdr-r { display:flex; align-items:center; gap:0.5rem; flex-shrink:0; }
    /* A selected employee is a focused record workspace. Compress the
       generic page heading and hand the reclaimed height to the record;
       the module/sidebar already provide the surrounding context. */
    .content.emp-record-active { padding-top: 0.9rem; padding-bottom: 0; overflow: hidden; }
    .content.emp-record-active .content-hdr { margin-bottom: 0.55rem; }
    .content.emp-record-active .content-hdr-l h2 { font-size: 1.45rem; letter-spacing: -0.025em; }
    .content.emp-record-active .content-hdr-l p { margin-top: 0.1rem; font-size: 0.74rem; }
    .content.badge-issuance-active { padding-top: 1rem; overflow-y: auto; }
    .content.badge-issuance-active .content-hdr { display: none; }

    /* â”€â”€ SEARCH (content header â€” hidden, sidebar handles search) â”€â”€ */
    .search-wrap { display:none; }

    /* â”€â”€ SPOTLIGHT SEARCH â”€â”€ */
    .spotlight-overlay {
      position:fixed; inset:0; z-index:800;
      background:rgba(0,0,0,0.45);
      backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
      display:flex; align-items:flex-start; justify-content:center;
      padding-top:12vh;
      opacity:0; pointer-events:none;
      transition:opacity 0.18s;
    }
    .spotlight-overlay.open { opacity:1; pointer-events:auto; }
    .spotlight-box {
      width:100%; max-width:580px; margin:0 1rem;
      background:var(--surface); border:1px solid var(--border);
      border-radius:16px;
      box-shadow:0 24px 80px rgba(0,0,0,0.22), 0 4px 16px rgba(0,0,0,0.1);
      overflow:hidden;
      transform:scale(0.96) translateY(-8px);
      transition:transform 0.18s cubic-bezier(0.34,1.3,0.64,1);
    }
    .spotlight-overlay.open .spotlight-box { transform:scale(1) translateY(0); }
    .spotlight-input-row {
      display:flex; align-items:center; gap:0.7rem;
      padding:0.9rem 1rem; border-bottom:1px solid var(--border);
    }
    .spotlight-input-row svg { width:18px; height:18px; color:var(--text-3); flex-shrink:0; }
    .spotlight-input-row input {
      flex:1; border:none; background:none; outline:none;
      font-family:"Replica", -apple-system, sans-serif;
      font-size:1rem; color:var(--text);
    }
    .spotlight-input-row input::placeholder { color:var(--text-3); }
    .spotlight-esc {
      font-size:0.65rem; color:var(--text-3); border:1px solid var(--border);
      border-radius:5px; padding:0.15rem 0.4rem; font-family:inherit;
      flex-shrink:0; cursor:pointer; background:none;
      transition:all 0.12s;
    }
    .spotlight-esc:hover { color:var(--text); border-color:var(--text-3); }
    .esc-mobile { display:none; }
    .spotlight-results {
      max-height:420px; overflow-y:auto; padding:0.5rem 0;
    }
    .spotlight-section-label {
      font-size:0.62rem; font-weight:700; text-transform:uppercase;
      letter-spacing:0.1em; color:var(--text-3);
      padding:0.6rem 1rem 0.3rem;
    }
    .spotlight-row {
      display:flex; align-items:center; gap:0.75rem;
      padding:0.5rem 1rem; cursor:pointer;
      transition:background 0.1s;
    }
    .spotlight-row:hover, .spotlight-row.focused { background:var(--surface2); }
    .spotlight-row-icon {
      width:32px; height:32px; border-radius:8px;
      border:1px solid var(--border); background:var(--surface2);
      display:flex; align-items:center; justify-content:center;
      flex-shrink:0; font-size:0.9rem;
    }
    .spotlight-row-icon svg { width:16px; height:16px; }
    .spotlight-row-info { flex:1; min-width:0; }
    /* No truncation â€” holds a product/sample name in the global search
       results, governed by SIERRA_DESIGN_SYSTEM.md Â§7b. */
    .spotlight-row-title { font-size:0.85rem; font-weight:500; color:var(--text); white-space:normal; overflow-wrap:break-word; }
    .spotlight-row-sub { font-size:0.72rem; color:var(--text-3); margin-top:0.05rem; white-space:normal; overflow-wrap:break-word; }
    .spotlight-row-badge {
      font-size:0.62rem; font-weight:700; text-transform:uppercase;
      letter-spacing:0.07em; padding:0.18rem 0.5rem; border-radius:5px;
      flex-shrink:0;
    }
    .spotlight-empty { padding:2.5rem 1rem; text-align:center; color:var(--text-3); font-size:0.85rem; }
    .spotlight-sep { height:1px; background:var(--border); margin:0.4rem 0; }
    mark.sh { background:var(--accent-light); color:var(--accent-dark); border-radius:2px; font-style:normal; }
    [data-theme="dark"] mark.sh { color:var(--accent); }

    /* â”€â”€ SELECT MODE â”€â”€ card selection uses the SAME checkbox as table
       rows (Â§20) â€” not a bespoke circular affordance â€” sitting over the
       media region's top-left corner, the one place every card variant
       (product photo or empty placeholder) can host it consistently. */
    .card.card-selected { border-color:var(--accent); }
    .card-check {
      position:absolute; top:0.6rem; left:0.6rem; width:18px; height:18px;
      accent-color:var(--accent); cursor:pointer; opacity:0; pointer-events:none;
      transition:opacity var(--dur-fast) var(--ease-out);
      filter:drop-shadow(0 1px 2px rgba(0,0,0,0.25));
    }
    body.select-mode .card-check { opacity:1; pointer-events:auto; }
    .card-wrap { position:relative; }

    /* Floating select bar */
    #select-bar { position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%) translateY(80px); background:var(--text); color:var(--bg); border-radius:20px; padding:0.6rem 0.6rem 0.6rem 1.2rem; display:flex; align-items:center; gap:0.65rem; z-index:300; font-size:0.82rem; font-weight:500; box-shadow:0 8px 32px rgba(0,0,0,0.25); opacity:0; transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1); white-space:nowrap; }
    #select-bar.show { transform:translateX(-50%) translateY(0); opacity:1; }
    /* Both bars are fixed to the same bottom-center spot; when the select
       bar is actually showing (items picked), the main toolbar behind it
       has nothing useful to offer and only causes visual collision. */
    body:has(#select-bar.show) .div-toolbar { display:none !important; }

    /* â”€â”€ DIVISION TOOLBAR (floating command bar) â”€â”€ */
    .div-toolbar {
      position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%);
      z-index:150; display:flex; align-items:center; gap:0.15rem;
      background:var(--surface); border:1px solid var(--border);
      border-radius:16px; padding:0.4rem 0.5rem;
      box-shadow:0 14px 44px rgba(0,0,0,0.14), 0 3px 10px rgba(0,0,0,0.08);
      backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
      white-space:nowrap;
      transition:box-shadow 0.2s;
    }
    .div-toolbar:hover {
      box-shadow:0 18px 52px rgba(0,0,0,0.16), 0 4px 12px rgba(0,0,0,0.09);
    }
    [data-theme="dark"] .div-toolbar {
      border-color:rgba(255,255,255,0.08);
      box-shadow:0 14px 44px rgba(0,0,0,0.55), 0 3px 10px rgba(0,0,0,0.3);
    }
    [data-theme="dark"] .div-toolbar:hover {
      box-shadow:0 18px 52px rgba(0,0,0,0.6), 0 4px 12px rgba(0,0,0,0.35);
    }
    .div-toolbar-search {
      display:flex; align-items:center; gap:0.45rem;
      padding:0.32rem 0.65rem 0.32rem 0.55rem;
    }
    .div-toolbar-search svg { width:14px; height:14px; color:var(--text-3); flex-shrink:0; }
    .div-toolbar-search input {
      border:none; background:none; outline:none; font-family:inherit;
      font-size:0.82rem; color:var(--text); width:160px;
    }
    .div-toolbar-search input::placeholder { color:var(--text-3); }
    .div-toolbar-sep { width:1px; height:20px; background:var(--border); margin:0 0.3rem; flex-shrink:0; }
    .div-toolbar-btn {
      display:inline-flex; align-items:center; gap:0.3rem;
      padding:0.38rem 0.65rem; border-radius:10px; border:none;
      font-size:0.78rem; font-weight:500; font-family:inherit;
      cursor:pointer; color:var(--text-2); background:none;
      transition:all 0.12s;
    }
    .div-toolbar-btn:hover { background:var(--surface2); color:var(--text); }
    .div-toolbar-btn.active { background:var(--surface2); color:var(--text); }
    .div-toolbar-btn svg { width:14px; height:14px; flex-shrink:0; }
    .div-toolbar-btn-primary {
      background:var(--interactive-primary-bg); color:var(--interactive-primary-text);
      box-shadow:0 2px 8px color-mix(in srgb, var(--interactive-primary-bg) 45%, transparent);
    }
    .div-toolbar-btn-primary:hover { background:var(--interactive-primary-hover); color:var(--interactive-primary-text); }
    /* Icon-only quick actions (Scan) â€” sits beside Search, before the mode/create actions */
    .div-toolbar-icon-btn {
      display:flex; align-items:center; justify-content:center;
      width:32px; height:32px; border-radius:10px; border:none;
      color:var(--text-2); background:none; cursor:pointer;
      transition:all 0.12s; flex-shrink:0;
    }
    .div-toolbar-icon-btn:hover { background:var(--surface2); color:var(--text); }
    .div-toolbar-icon-btn svg { width:15px; height:15px; }
    @media (max-width:767px) {
      .div-toolbar { bottom:calc(0.75rem + env(safe-area-inset-bottom)); left:1rem; right:1rem; transform:none; }
      .div-toolbar-search input { width:100%; }
      .div-toolbar { width:calc(100% - 2rem); }
    }
    #select-count { font-weight:600; }

    /* CommentsPanel lives with the Record Detail architecture below. */

    /* â”€â”€ PRODUCT GRID â”€â”€ optimizes for product COMPREHENSION, not maximum
       card count: a 280px floor keeps cards to ~4/row on a large desktop,
       ~3 on a laptop, ~2 on tablet, 1 on mobile (Â§9) via plain auto-fill â€”
       no hard-coded per-breakpoint column counts to keep in sync. */
    .pg { display:block; }
    .pg-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:1.1rem; align-items:start; }

    /* â”€â”€ Saved views (fabric construction) â”€â”€ compact ViewTabs strip,
       replacing the old large fab-chip category buttons. Markup now
       renders through .pd-tabs-inline like every other tab strip in the
       app; #fab-filter-bar is kept only as the container id so existing
       show/hide call sites don't need touching. */
    #fab-filter-bar { padding:0; margin-bottom:var(--panel-gap); }

    /* â”€â”€ PageHeader Level 2: ViewTabs â”€â”€ switching Table|Cards changes
       which surface you're looking at, not a taxonomy/action â€” it must
       read lighter than both. Text + underline, no track/pill chrome, so
       it never competes with the CategoryTabs row below it or the toolbar
       buttons below that (Â§1/Â§25 header-level hierarchy). */
    .view-tabs { display:flex; gap:1.4rem; border-bottom:1px solid var(--border); margin:0 0 var(--panel-gap); }
    .view-tab {
      position:relative; background:none; border:none; font-family:inherit;
      font-size:0.86rem; font-weight:600; color:var(--text-3); cursor:pointer;
      padding:0 0.05rem 0.55rem; white-space:nowrap; transition:color var(--dur-fast) var(--ease-out);
    }
    .view-tab:hover { color:var(--text-2); }
    .view-tab.active { color:var(--text); }
    .view-tab.active::after { content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; border-radius:2px; background:var(--accent); }

    /* â”€â”€ PageHeader taxonomy row: CategoryTabs â”€â”€ navigation, not an
       action group â€” quieter than the ViewTabs above it (no underline
       track) and quieter still than the Toolbar below it (no border/
       button shell at rest). The count is always the muted half of the
       pair; the active tab gets a soft tint, never a filled/teal button
       (Â§2). Reused verbatim wherever a catalog needs saved-view chips. */
    .cat-tabs { display:flex; align-items:center; gap:0.2rem; margin:0 0 var(--panel-gap); overflow-x:auto; scrollbar-width:none; }
    .cat-tabs::-webkit-scrollbar { display:none; }
    .cat-tab {
      display:inline-flex; align-items:center; gap:0.3rem; background:none; border:1px solid transparent;
      border-radius:var(--r-sm); padding:0.36rem 0.6rem; font-family:inherit; font-size:0.82rem; font-weight:600;
      color:var(--text-2); cursor:pointer; white-space:nowrap; flex-shrink:0;
      transition:background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
    }
    .cat-tab:hover { background:var(--surface2); color:var(--text); }
    .cat-tab.active { background:var(--surface2); color:var(--text); }
    .cat-tab-count { color:var(--text-3); font-weight:500; }

    .card {
      position:relative; background:var(--surface); border:1px solid var(--border); border-radius:12px;
      cursor:pointer; transition:border-color 0.16s, box-shadow 0.18s, transform 0.18s;
      overflow:hidden; min-width:0;
    }
    .card:hover { border-color:color-mix(in srgb, var(--text-3) 42%, var(--border)); box-shadow:0 8px 26px rgba(0,0,0,0.06); transform:translateY(-1px); }
    [data-theme="dark"] .card:hover { box-shadow:0 10px 28px rgba(0,0,0,0.32); }

    /* Media region (Â§16): shorter when there's nothing to show. A real
       photo earns the taller zone (140-160px); the empty state doesn't
       pretend to â€” 96px is enough for a legible icon without the gray box
       dominating the card. */
    .card-img { width:100%; height:152px; object-fit:cover; background:var(--bg-alt); display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .card-img img { width:100%; height:100%; object-fit:cover; }
    .card-img-placeholder {
      width:100%; height:96px; display:flex; align-items:center; justify-content:center;
      background:linear-gradient(180deg, var(--surface2), var(--bg-alt)); overflow:hidden;
    }
    .card-img-placeholder svg { width:24px; height:24px; opacity:0.6; }

    /* PersonCard (employee directory) â€” every card shares one fixed
       anatomy so photo availability, name length or missing fields never
       change card height (Â§ people-directory grid). Media is a true 1:1
       square (portrait, not a landscape crop) at every breakpoint; the
       no-photo placeholder occupies the identical square so the grid
       never collapses around missing photos. */
    .pg-grid.people-grid { grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); align-items:stretch; }
    .person-card { display:flex; flex-direction:column; height:100%; }
    .person-card .card-img,
    .person-card .card-img-placeholder {
      aspect-ratio:1 / 1; height:auto; flex-shrink:0;
    }
    .person-card .card-img img { object-position:center 22%; }
    .person-card .card-body { display:flex; flex-direction:column; flex:1 1 auto; }
    /* No line-clamp â€” person name, governed by SIERRA_DESIGN_SYSTEM.md Â§7b.
       This selector is more specific than .card-name.wrap-full and was
       still clipping the name at 2 lines even after wrap-full was applied
       to the element; fixed at the source instead of adding a third class. */
    .person-card .card-name {
      white-space:normal; overflow-wrap:break-word; min-height:2.6em;
    }
    .person-card .card-desc { margin-bottom:0.9rem; }
    .person-card .card-actions { margin-top:auto; }
    .card-body { padding:0.95rem 1rem 1rem; }
    /* ProductCard anatomy (Â§11): name first (primary identity), then
       record metadata + lifecycle, then technical data, then actions â€”
       never code-before-name. */
    .card-name {
      font-size:1.05rem; font-weight:650; color:var(--text); margin-bottom:0.55rem;
      letter-spacing:-0.014em; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    /* Unlimited wrap for names Â§7b (SIERRA_DESIGN_SYSTEM.md) never allows
       to truncate â€” product/sample/collection/person names. No line-clamp:
       the full value must render, not just the first N lines of it. Same
       pattern as the existing .orgp-name/.orgc-name/.td-wrap "opt back
       into wrapping" convention, applied to .card-name. */
    .card-name.wrap-full { white-space:normal; overflow-wrap:break-word; }
    .product-name-lang-tag {
      display:inline-flex; align-items:center; min-height:18px; margin-left:0.4rem; transform:translateY(-1px);
      padding:0.12rem 0.38rem; border-radius:6px; border:1px solid var(--border);
      background:var(--surface2); color:var(--text-3);
      font-size:0.55rem; font-weight:700; text-transform:uppercase; letter-spacing:0.07em;
      white-space:nowrap; vertical-align:middle;
    }
    .card-meta { display:flex; align-items:center; justify-content:space-between; gap:0.65rem; margin-bottom:0.7rem; min-width:0; }
    .card-meta-main { display:flex; align-items:center; gap:0.45rem; min-width:0; }
    .card-meta-side { display:flex; flex-direction:column; align-items:flex-end; gap:0.26rem; flex-shrink:0; }
    /* CategoryTag ("all products" view only â€” identifies the DIVISION, not
       the record; see .rec-id for the record identifier). Shares the
       32px/7px info-scale shell with every sibling in .card-meta so the two
       pills in that row read as one baseline, not two component systems. */
    .card-div-pill {
      display:inline-flex; align-items:center; gap:0.38rem; min-width:0; max-width:100%;
      height:var(--status-h); font-size:0.58rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em;
      padding:0 var(--status-px); border-radius:var(--status-radius); border:1px solid transparent;
    }
    .card-div-pill span:last-child { min-width:0; overflow:hidden; text-overflow:ellipsis; line-height:1.05; }
    .card-div-icon { width:14px; height:14px; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; }
    .card-div-icon svg { width:14px; height:14px; display:block; }
    .card-div { font-size:0.6rem; font-weight:700; text-transform:uppercase; letter-spacing:0.11em; }
    .card-lot { font-size:0.6rem; color:var(--text-3); max-width:82px; text-align:right; line-height:1.2; overflow:hidden; text-overflow:ellipsis; }
    /* Generic card description line â€” reused by module tiles, employee
       cards and sample cards. ProductCard's own technical data uses the
       dedicated .card-comp/.card-tech below instead (Â§14/Â§15 need
       different truncation rules than a generic one-liner). */
    .card-desc { font-size:0.74rem; color:var(--text-3); line-height:1.45; margin-bottom:0.8rem; min-height:2.15em; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    /* Technical data block (Â§14/Â§15): composition is never blindly
       truncated. Short compositions (â‰¤2 components) stay one line
       separated by " Â· "; longer ones stack, one component per line, so
       every value stays fully readable â€” comprehension over card count. */
    .card-tech-block { margin-bottom:1.05rem; }
    .card-comp { font-size:0.8rem; color:var(--text-2); line-height:1.5; }
    .card-comp-stack { display:flex; flex-direction:column; gap:0.02rem; }
    .card-comp-empty { color:var(--text-3); }
    .card-tech { font-size:0.76rem; color:var(--text-3); margin-top:0.15rem; }
    .tags { display:flex; flex-wrap:wrap; gap:0.28rem; margin-bottom:0.9rem; }
    .tags:empty { display:none; }
    .tag { font-size:0.64rem; padding:0.16rem 0.45rem; border-radius:7px; background:none; color:var(--text-3); border:1px solid var(--border); }
    /* Card action row (Â§ SIERRA_DESIGN_SYSTEM.md, Card action row) â€” the
       primary action (canonical .btn.btn-primary, --control-h) and the
       overflow trigger (canonical .icon-btn, same height) share one
       interaction-scale baseline. Nothing in this row writes its own
       button CSS â€” both inherit the standard control tier (Â§24). */
    .card-actions { display:flex; align-items:center; justify-content:space-between; gap:var(--control-gap); }
    .card-actions .btn-primary { flex:1; min-width:0; }
    .card-more-btn { display:inline-flex; align-items:center; justify-content:center; width:var(--control-h-sm); height:var(--control-h-sm); border-radius:var(--control-radius); border:1px solid var(--border-strong); background:var(--surface); color:var(--text-secondary); cursor:pointer; flex-shrink:0; transition:background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out); position:relative; }
    .card-more-btn:hover { background:var(--surface-hover); color:var(--text-primary); border-color:var(--text-muted); }
    /* Overflow (â€¢â€¢â€¢) menu â€” positioning variant of the shared flyout
       popover (.ws-pop, see "POPOVER / DROPDOWN MENU PRIMITIVE"): opens
       upward since its trigger usually sits near a card's bottom edge.
       Shell/item visuals come from .ws-pop/.pop-menu-item â€” this block
       only overrides position + ancestor-driven open (vs .ws-pop's
       self-toggled .open). Built via overflowMenuHtml(), the one
       canonical way to construct a â€¢â€¢â€¢  menu â€” see Â§12e. */
    .card-more-menu { position:absolute; bottom:calc(100% + 6px); right:0; top:auto; min-width:170px; }
    .card-more-btn.open .card-more-menu.ws-pop { display:block; }
    .card-more-item svg, .pop-menu-item svg { width:var(--icon-size-control); height:var(--icon-size-control); color:var(--text-muted); flex-shrink:0; }
    /* A â€¢â€¢â€¢ trigger sitting in an action group is an IconButton and must
       match its neighbours' height â€” pass btnClass:'icon-btn'. */
    .card-more-btn.icon-btn { width:var(--control-h); height:var(--control-h); border-color:var(--border-strong); background:var(--surface); color:var(--text-secondary); }
    .card-more-btn.icon-btn:hover { background:var(--surface-hover); color:var(--text-primary); border-color:var(--text-muted); }
    .card-more-btn.icon-btn svg { width:var(--icon-size-control); height:var(--icon-size-control); }
    /* Header overflow opens downward (its trigger is at the top of the page) */
    .card-more-btn.menu-below .card-more-menu { bottom:auto; top:calc(100% + 6px); }

    /* â”€â”€ MODAL â”€â”€
       The whole dialog is a flex column capped at max-height; only
       .modal-body scrolls, so the header and the Save/Cancel footer stay
       docked in view regardless of how long the form is. */
    .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.3); z-index:200; align-items:center; justify-content:center; backdrop-filter:blur(6px); }
    .overlay.open { display:flex; }
    .modal {
      background:var(--surface); border:1px solid var(--border); border-radius:18px;
      width:560px; max-width:95vw; max-height:90vh;
      display:flex; flex-direction:column; overflow:hidden;
      box-shadow:0 24px 80px rgba(0,0,0,0.2);
    }
    .modal-hdr {
      padding:1rem 1.25rem; display:flex; align-items:flex-start; justify-content:space-between;
      flex-shrink:0; border-bottom:1px solid var(--border);
    }
    .modal-eyebrow { font-size:0.62rem; font-weight:700; text-transform:uppercase; letter-spacing:0.12em; margin-bottom:0.3rem; }
    .modal-title { font-size:1.05rem; font-weight:600; letter-spacing:-0.01em; }
    .modal-body { padding:0.95rem 1.25rem; overflow-y:auto; flex:1; min-height:0; }
    .modal-ftr {
      padding:0.85rem 1.25rem; display:flex; gap:0.55rem; justify-content:flex-end;
      flex-shrink:0; border-top:1px solid var(--border);
    }

    /* â”€â”€ DRAWER (canonical right-side panel) â”€â”€
       Secondary context that should stay anchored to the object you're
       looking at â€” Activity, Comments, Permissions, audit history â€” uses
       this instead of a permanent inline block or a full navigation away
       from the page (Â§23 of the ERP evolution brief). One implementation
       for the whole app: sd-overlay/sd-panel here, generic open/close/tab
       JS API below (openSideDrawer/closeSideDrawer/switchDrawerTab). Do
       not build a second drawer per feature â€” add a caller instead. Visual
       language matches .modal (surface/border/radius scale, same shadow
       direction) so it reads as "the same system," just anchored right
       instead of centered. */
    .sd-overlay {
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.28); z-index:220;
    }
    .sd-overlay.open { display:block; }
    .sd-panel {
      position:fixed; top:0; right:0; bottom:0; width:420px; max-width:92vw;
      background:var(--surface); border-left:1px solid var(--border);
      box-shadow:-24px 0 80px rgba(0,0,0,0.18);
      display:flex; flex-direction:column;
      transform:translateX(100%); transition:transform var(--dur-base) var(--ease-out);
    }
    .sd-overlay.open .sd-panel { transform:translateX(0); }
    .sd-hdr {
      padding:0.9rem 1.15rem; display:flex; align-items:flex-start; justify-content:space-between;
      flex-shrink:0; border-bottom:1px solid var(--border);
    }
    .sd-eyebrow { font-size:0.62rem; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-3); margin-bottom:0.25rem; }
    .sd-title { font-size:1rem; font-weight:600; letter-spacing:-0.01em; }
    .sd-tabs { display:flex; gap:1.1rem; padding:0 1.15rem; border-bottom:1px solid var(--border); flex-shrink:0; }
    .sd-tab {
      padding:0.5rem 0.05rem; font-size:0.78rem; font-weight:600; color:var(--text-3);
      background:none; border:none; border-bottom:2px solid transparent; cursor:pointer; font-family:inherit;
      transition:color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
    }
    .sd-tab:hover { color:var(--text); }
    .sd-tab.active { color:var(--text); border-bottom-color:var(--accent); }
    .sd-body { padding:0.95rem 1.15rem; overflow-y:auto; flex:1; min-height:0; }
    @media (max-width:640px) {
      .sd-panel { width:100%; max-width:100%; }
    }

    /* â”€â”€ FICHA LAYOUT â”€â”€ */
    .ficha-img { width:100%; height:200px; object-fit:cover; border-radius:10px; margin-bottom:1rem; background:var(--surface2); display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .ficha-img img { width:100%; height:100%; object-fit:cover; }
    .ficha-img-empty { flex-direction:column; }
    .ficha-sec { margin-bottom:1.1rem; }
    .ficha-lbl { font-size:0.62rem; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-3); margin-bottom:0.55rem; }
    .spec-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.45rem; }
    .spec-item { background:none; border:1px solid var(--border); border-radius:9px; padding:0.6rem 0.8rem; }
    .spec-k { font-size:0.65rem; color:var(--text-3); margin-bottom:0.18rem; text-transform:uppercase; letter-spacing:0.04em; }
    .spec-v { font-size:0.86rem; font-weight:500; }

    /* â”€â”€ YARNS â”€â”€ */
    .yarn-row { display:flex; gap:0.75rem; align-items:baseline; padding:0.5rem 0; border-bottom:1px solid var(--border); }
    .yarn-row:last-child { border-bottom:none; }
    .yarn-lbl { font-size:0.65rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-3); min-width:60px; }
    .yarn-val { font-size:0.86rem; color:var(--text); }

    /* â”€â”€ TABLE â”€â”€ */
    .data-table { width:100%; border-collapse:collapse; font-size:0.8rem; }
    .data-table th { text-align:left; padding:0.45rem 0.9rem; font-size:0.62rem; font-weight:600; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-3); border-bottom:1px solid var(--border); }
    .data-table td { padding:0.8rem 0.9rem; border-bottom:1px solid var(--border); vertical-align:middle; }
    .data-table tr:last-child td { border-bottom:none; }

    /* Team â€” Settings-style account list (replaces the old data-table) */
    .team-list { border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--surface); }
    .team-row {
      display:flex; align-items:flex-start; gap:1.25rem; padding:1rem 1.15rem;
      border-bottom:1px solid var(--border);
    }
    .team-row:last-child { border-bottom:none; }
    .team-row-id { display:flex; align-items:center; gap:0.65rem; flex:0 0 220px; min-width:0; }
    .team-avatar {
      width:34px; height:34px; border-radius:50%; background:var(--accent); color:#fff;
      font-size:0.7rem; font-weight:700; display:flex; align-items:center; justify-content:center;
      flex-shrink:0; letter-spacing:0.02em;
    }
    .team-row-who { min-width:0; }
    /* No truncation â€” person name, governed by SIERRA_DESIGN_SYSTEM.md Â§7b. */
    .team-row-name { font-size:0.85rem; font-weight:600; color:var(--text); white-space:normal; overflow-wrap:break-word; }
    .team-row-you { font-size:0.68rem; font-weight:400; color:var(--text-3); }
    .team-row-email { font-size:0.72rem; color:var(--text-3); margin-top:0.1rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .team-row-access { flex:1; min-width:0; }
    .team-chips { display:flex; flex-wrap:wrap; gap:0.4rem; align-items:center; min-height:1.6rem; }
    .team-chip {
      display:inline-flex; align-items:center; gap:0.35rem; font-size:0.68rem; font-weight:600;
      padding:0.24rem 0.35rem 0.24rem 0.65rem; border-radius:20px; background:var(--surface2);
      border:1px solid var(--border); color:var(--text-2); white-space:nowrap;
    }
    .team-chip-revoke {
      display:flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:50%;
      border:none; background:none; color:var(--text-3); cursor:pointer; font-size:0.72rem; line-height:1; padding:0;
      transition:background 0.12s, color 0.12s;
    }
    .team-chip-revoke:hover { background:rgba(192,57,43,0.12); color:var(--danger); }
    .team-add-access { display:flex; gap:0.4rem; align-items:center; margin-top:0.55rem; flex-wrap:wrap; }
    .team-row-role { flex:0 0 150px; text-align:right; }
    .team-row-role-static { font-size:0.78rem; font-weight:600; color:var(--text-2); }
    .team-row-role-note { font-size:0.62rem; color:var(--text-3); margin-top:0.15rem; }
    .team-migration-note { font-size:0.72rem; color:var(--text-3); }
    @media (max-width:760px) {
      .team-row { flex-direction:column; gap:0.75rem; }
      .team-row-id, .team-row-role { flex:1 1 auto; width:100%; }
      .team-row-role { text-align:left; }
    }

    /* .badge is the legacy alias for .status-badge (STATUS family) â€” same
       anatomy, kept so existing badge-<status> modifier classes below
       don't need renaming at every call site. */
    .badge { display:inline-flex; align-items:center; gap:var(--status-gap); height:var(--status-h); padding:0 var(--status-px); font-size:var(--status-font-size); font-weight:600; line-height:1; border-radius:var(--status-radius); white-space:nowrap; border:1px solid transparent; }
    .badge .si-icon { flex-shrink:0; width:var(--status-icon-size); height:var(--status-icon-size); }
    .badge-pending  { background:var(--warning-bg); color:var(--warning-text); }
    .badge-approved { background:var(--success-bg); color:var(--success); }
    .badge-shipped  { background:var(--info-bg);    color:var(--info); }
    .badge-rejected { background:var(--danger-bg);  color:var(--danger); }


    /* â”€â”€ ADD FORM â”€â”€ */
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:0.85rem; }
    .two-col .full { grid-column:1/-1; }
    hr.div { border:none; border-top:1px solid var(--border); margin:1rem 0; }

    /* Grouped sections within the division-specific fields, so a long
       form (22 fields for Fabric) reads as scannable groups instead of
       one flat wall of inputs. */
    .form-sec { padding-top:1.25rem; margin-top:1.25rem; border-top:1px solid var(--border); }
    .form-sec:first-child { padding-top:0; margin-top:0; border-top:none; }
    .form-sec-label { font-size:0.62rem; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-3); margin-bottom:0.85rem; }

    /* â”€â”€ IMG UPLOAD â”€â”€ */
    /* â”€â”€ IMAGE GALLERY (ficha) â”€â”€ */
    .ficha-gallery { display:flex; flex-direction:column; gap:0.5rem; margin-bottom:1rem; }
    .ficha-gallery-hero { width:100%; aspect-ratio:1; border-radius:13px; overflow:hidden; background:var(--surface2); cursor:zoom-in; position:relative; border:1px solid color-mix(in srgb, var(--border) 76%, transparent); box-shadow:0 12px 34px rgba(0,0,0,0.08); }
    [data-theme="dark"] .ficha-gallery-hero { box-shadow:0 16px 42px rgba(0,0,0,0.32); }
    .ficha-gallery-hero::after { content:""; position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 1px 0 rgba(255,255,255,0.18), inset 0 -34px 48px rgba(0,0,0,0.12); }
    .ficha-gallery-hero img { width:100%; height:100%; object-fit:cover; transition:transform 0.42s cubic-bezier(0.22,1,0.36,1); }
    .ficha-gallery-hero:hover img { transform:scale(1.035); }
    .ficha-gallery-hero .img-dl-btn { position:absolute; bottom:0.65rem; right:0.65rem; background:rgba(0,0,0,0.48); color:#fff; border:1px solid rgba(255,255,255,0.16); border-radius:8px; padding:0.38rem 0.72rem; font-size:0.72rem; font-family:inherit; cursor:pointer; display:flex; align-items:center; gap:0.3rem; backdrop-filter:blur(10px); opacity:0; transition:opacity 0.15s, background 0.12s, transform 0.12s; z-index:1; }
    .ficha-gallery-hero .img-dl-btn:hover { background:rgba(0,0,0,0.62); }
    .ficha-gallery-hero:hover .img-dl-btn { opacity:1; transform:translateY(-1px); }
    .ficha-thumbs { display:flex; gap:0.45rem; overflow-x:auto; padding:0.55rem 0.1rem 0.05rem; }
    .ficha-thumbs::-webkit-scrollbar { height:3px; }
    .ficha-thumbs::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
    .ficha-thumb { width:54px; height:54px; border-radius:9px; overflow:hidden; cursor:pointer; flex-shrink:0; border:1px solid var(--border); opacity:0.72; transition:border-color 0.12s, opacity 0.12s, box-shadow 0.12s; }
    .ficha-thumb:hover { opacity:1; }
    .ficha-thumb.active { border-color:var(--accent); opacity:1; box-shadow:0 0 0 2px rgba(var(--accent-rgb,15,157,144),0.16); }
    .ficha-thumb img { width:100%; height:100%; object-fit:cover; }

    /* â”€â”€ IMAGE GRID (edit form) â”€â”€ */
    .img-edit-grid { display:flex; flex-wrap:wrap; gap:0.5rem; margin-bottom:0.65rem; }
    .img-edit-thumb { position:relative; width:72px; height:72px; border-radius:8px; overflow:hidden; flex-shrink:0; }
    .img-edit-thumb img { width:100%; height:100%; object-fit:cover; }
    .img-edit-rm { position:absolute; top:3px; right:3px; width:18px; height:18px; background:rgba(0,0,0,0.55); color:#fff; border:none; border-radius:50%; font-size:0.6rem; cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1; }

    .img-upload-area {
      border:2px dashed var(--border); border-radius:10px; padding:1.5rem; text-align:center;
      cursor:pointer; transition:border-color 0.15s; position:relative; overflow:hidden;
    }
    .img-upload-area:hover, .img-upload-area.drag-over { border-color:var(--accent); background:var(--accent-light); }
    .img-upload-area input[type=file] { position:absolute; inset:0; opacity:0; cursor:pointer; }
    .img-upload-area .up-icon { font-size:1.4rem; margin-bottom:0.4rem; color:var(--text-3); }
    .img-upload-area p { font-size:0.78rem; color:var(--text-2); }
    .img-preview { width:100%; height:120px; object-fit:cover; border-radius:8px; margin-top:0.75rem; display:none; }

    /* â”€â”€ EMPTY â”€â”€ */
    .empty { text-align:center; padding:4rem 1rem; color:var(--text-3); }
    .empty-icon { font-size:1.8rem; margin-bottom:0.6rem; opacity:0.4; }
    .empty p { font-size:0.82rem; }

    /* â”€â”€ SKELETON (loading placeholder) â”€â”€ */
    .skeleton { position:relative; overflow:hidden; background:var(--surface2); border-radius:8px; }
    .skeleton::after {
      content:""; position:absolute; inset:0;
      background:linear-gradient(90deg, transparent, rgba(0,0,0,0.04), transparent);
      animation:shimmer 1.4s infinite;
    }
    [data-theme="dark"] .skeleton::after { background:linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent); }
    @keyframes shimmer { from { transform:translateX(-100%); } to { transform:translateX(100%); } }

    /* â”€â”€ TOAST â”€â”€ */
    #toast { position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%) translateY(80px); background:var(--text); color:var(--bg); border-radius:24px; padding:0.6rem 1.2rem; font-size:0.8rem; font-weight:500; z-index:999; opacity:0; transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1); white-space:nowrap; }
    #toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
    .spinner { width:13px; height:13px; border:2px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.6s linear infinite; display:inline-block; }

    /* â”€â”€ DASHBOARD â”€â”€ */
    #view-dashboard { display:none; }
    #view-products { display:block; }
    #view-styleguide { display:none; }

    /* â”€â”€ HOME v2 â”€â”€ */
    /* â”€â”€ DASHBOARD LAYOUT â”€â”€ */
    .dash-wrap {
      max-width:1040px; margin:0 auto; padding-bottom:3rem;
      display:grid; grid-template-columns:minmax(0,1fr) 220px;
      gap:0 2.5rem; align-items:start;
    }
    .dash-hero-zone {
      grid-column:1/-1;
      margin-bottom:2rem;
    }
    .dash-greeting {
      font-family:"Replica", -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
      font-size:1.42rem; font-weight:700; letter-spacing:0;
      color:var(--text); line-height:1.2; margin-bottom:0.25rem;
    }
    .dash-date {
      font-size:0.72rem; color:var(--text-3); margin-bottom:1.35rem;
    }
    .dash-col { display:flex; flex-direction:column; min-width:0; }
    .dash-side { position:sticky; top:1.5rem; display:flex; flex-direction:column; gap:0; }

    /* Search */
    .dash-search-trigger {
      display:flex; align-items:center; gap:0.75rem;
      border:1px solid var(--border); border-radius:10px;
      padding:0.82rem 1rem; cursor:pointer;
      background:var(--surface2); transition:border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }
    .dash-search-trigger:hover { border-color:var(--text-3); background:var(--surface); box-shadow:var(--shadow); }
    .dst-icon { color:var(--text-3); flex-shrink:0; }
    .dst-text { flex:1; font-size:0.85rem; color:var(--text-3); }
    .dst-kbd {
      font-size:0.62rem; color:var(--text-3);
      border:1px solid var(--border); border-radius:5px;
      padding:0.15rem 0.4rem; flex-shrink:0;
    }

    /* Section scaffold */
    .dash-section { margin-bottom:1.85rem; }
    .dash-section-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:0.65rem; }
    .dash-section-label { font-size:0.58rem; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-3); }
    .dash-section-meta { font-size:0.65rem; color:var(--text-3); }

    /* Recent: single compact row of 4 */
    .recent-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:0.55rem; }
    .recent-grid .recent-card { width:auto; min-width:0; }

    /* Sidebar action list */
    .dash-act-row { display:flex; flex-direction:column; gap:0.35rem; }
    .dash-act {
      display:flex; align-items:center; gap:0.55rem;
      border:1px solid var(--border); border-radius:8px;
      padding:0.6rem 0.75rem; background:var(--surface); cursor:pointer;
      font-family:inherit; font-size:0.78rem; font-weight:500; color:var(--text);
      transition:border-color 0.12s, background 0.12s, box-shadow 0.12s; white-space:nowrap; width:100%;
    }
    .dash-act:hover { border-color:var(--text-3); background:var(--surface2); box-shadow:var(--shadow); }
    .dash-act svg { color:var(--text-3); flex-shrink:0; }

    /* Sidebar market: compact rows */
    .dash-side .market-cards { flex-direction:column; gap:0; }
    .dash-side .market-card {
      border:none; border-radius:0; padding:0.6rem 0; border-bottom:1px solid var(--border);
      background:none !important;
    }
    .dash-side .market-card.mc-open {
      background:var(--surface2) !important;
      border-radius:8px;
      padding-left:0.65rem;
      padding-right:0.65rem;
      border-bottom-color:transparent;
    }
    .dash-side .market-card:last-child { border-bottom:none; }
    .dash-side .mc-spark { display:none; }
    .dash-side .mc-label { margin-bottom:0.15rem; }
    .dash-side .mc-price { font-size:0.9rem; font-weight:600; letter-spacing:0; }
    .dash-side .mc-unit { font-size:0.58rem; }
    .dash-side .market-expand-drawer {
      border:none;
      border-top:1px solid var(--border);
      border-radius:0;
      padding:0.85rem 0 0;
      margin-top:0.75rem;
    }
    .dash-side .market-expand-drawer.open { display:block; }
    .dash-side .med-top { flex-direction:column; gap:0.55rem; }
    .dash-side .med-price { font-size:1.35rem; text-align:left; }
    .dash-side .med-chg { font-size:0.72rem; text-align:left; }
    .dash-side .med-chart { height:96px; margin-top:0.85rem; }

    /* World time */
    .dash-clocks { display:grid; grid-template-columns:repeat(4,1fr); gap:0; border:1px solid var(--border); border-radius:10px; overflow:hidden; background:var(--surface); }
    .clock-card {
      min-width:0; padding:0.82rem 0.9rem 0.78rem;
      display:flex; flex-direction:column; gap:0; cursor:default;
      overflow:hidden; position:relative; border-right:1px solid var(--border);
      background:var(--surface);
    }
    .clock-card:last-child { border-right:none; }
    .clock-top { display:flex; align-items:center; gap:0.38rem; margin-bottom:0.42rem; min-width:0; }
    .clock-status { width:6px; height:6px; border-radius:50%; flex-shrink:0; background:var(--text-3); opacity:0.65; }
    .clock-status.day { background:var(--success); }
    .clock-status.eve { background:var(--sem-orange); }
    .clock-status.night { background:var(--sem-blue-dark); }
    .clock-city { font-size:0.58rem; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .clock-time { font-size:1.12rem; font-weight:500; font-variant-numeric:tabular-nums; letter-spacing:0; color:var(--text); line-height:1; }
    .clock-ampm { font-size:0.56rem; font-weight:600; margin-left:0.12rem; color:var(--text-3); letter-spacing:0.04em; }
    .clock-meta { min-height:0.9rem; font-size:0.58rem; font-weight:600; letter-spacing:0.04em; color:var(--text-3); margin-top:0.35rem; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    /* Notifications widget */
    .dash-notif-list { display:flex; flex-direction:column; gap:0; border:1px solid var(--border); border-radius:10px; overflow:hidden; background:var(--surface); }
    .dash-notif-item { display:flex; align-items:flex-start; gap:0.7rem; padding:0.7rem 0.9rem; background:var(--surface); cursor:pointer; transition:background 0.1s; border-bottom:1px solid var(--border); }
    .dash-notif-item:last-child { border-bottom:none; }
    .dash-notif-item:hover { background:var(--surface2); }
    .dash-notif-item.unread { background:var(--accent-light); }
    .dash-notif-icon { width:30px; height:30px; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
    .dash-notif-body { flex:1; min-width:0; }
    .dash-notif-title { font-size:0.78rem; font-weight:600; color:var(--text); line-height:1.35; }
    .dash-notif-sub { font-size:0.68rem; color:var(--text-3); margin-top:0.12rem; }
    .dash-notif-dot { width:6px; height:6px; border-radius:50%; background:var(--accent); flex-shrink:0; margin-top:5px; }
    .dash-notif-empty { padding:1.25rem; text-align:center; color:var(--text-3); font-size:0.78rem; border:1px solid var(--border); border-radius:10px; }

    /* Tip of the day */
    .dash-tip {
      display:flex; align-items:flex-start; gap:0.75rem;
      border:1px solid var(--border); border-radius:10px;
      padding:0.9rem 1rem; background:var(--surface);
      position:relative;
    }
    .dash-tip-icon {
      width:28px; height:28px; border-radius:8px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      color:var(--accent); background:var(--accent-light); margin-top:0.05rem;
    }
    .dash-tip-icon svg { width:15px; height:15px; }
    .dash-tip-body { flex:1; min-width:0; }
    .dash-tip-label { font-size:0.58rem; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; color:var(--accent); margin-bottom:0.25rem; }
    .dash-tip-text { font-size:0.78rem; color:var(--text-2); line-height:1.5; margin-bottom:0.5rem; }
    .dash-tip-action { font-size:0.73rem; font-weight:600; color:var(--accent); background:none; border:none; cursor:pointer; font-family:inherit; padding:0; }
    .dash-tip-action:hover { text-decoration:underline; }
    .dash-tip-close { position:absolute; top:0.65rem; right:0.7rem; background:none; border:none; cursor:pointer; color:var(--text-3); font-size:1rem; line-height:1; padding:0.1rem; }
    .dash-tip-close:hover { color:var(--text); }

    /* Sidebar divider */
    .dash-side-sep { height:1px; background:var(--border); margin:0.85rem 0; }

    /* Style guide */
    /* The guide fills the workspace between sidebar and viewport edge â€”
       it is the platform's working reference, not a centered document.
       Prose still gets a readable measure via max-width on the text
       elements themselves (.sg-sub/.sg-title/.sg-lede), never on the
       page shell. */
    .sg-wrap { width:100%; max-width:none; padding-bottom:3rem; }
    .sg-hero { margin-bottom:2.2rem; }
    .sg-eyebrow { font-size:0.58rem; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; color:var(--accent); margin-bottom:0.55rem; }
    .sg-title { font-size:2.05rem; font-weight:700; letter-spacing:0; line-height:1.04; color:var(--text); max-width:640px; }
    .sg-sub { font-size:0.86rem; color:var(--text-2); line-height:1.55; max-width:640px; margin-top:0.85rem; }
    .sg-layout { display:grid; grid-template-columns:minmax(0,1fr) minmax(240px,300px); gap:clamp(24px,3vw,40px); align-items:start; }
    .sg-main { display:flex; flex-direction:column; gap:2rem; min-width:0; }
    .sg-side { position:sticky; top:1.5rem; display:flex; flex-direction:column; gap:0.9rem; max-width:300px; }
    .sg-section { border-top:1px solid var(--border); padding-top:1.25rem; }
    .sg-section:first-child { border-top:none; padding-top:0; }
