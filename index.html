    .lbl-issue-title { font-size: 13px; font-weight: 650; color: var(--text-primary); }
    .lbl-issue-desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; line-height: 1.45; }
    .lbl-issue-fixes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

    /* â”€â”€ Preview canvas â”€â”€ */
    .lbl-dr-preview {
      flex: 1; min-width: 0; display: flex; flex-direction: column;
      background: var(--bg-alt); overflow: hidden;
    }
    .lbl-pv-bar {
      display: flex; align-items: center; gap: var(--control-gap); flex-wrap: wrap;
      padding: 10px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
      background: var(--surface);
    }
    .lbl-pv-dims { font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
    .lbl-pv-stage {
      flex: 1; min-height: 0; overflow: auto; display: flex;
      align-items: flex-start; justify-content: center; padding: 32px 24px 48px;
    }
    .lbl-dr-paper {
      display: inline-block; background: #fff;
      filter: drop-shadow(0 6px 24px rgba(0,0,0,0.16)) drop-shadow(0 1px 3px rgba(0,0,0,0.10));
    }
    #label-preview, #yc-label-preview { transform-origin: top left; }
    /* The preview paper is print stock â€” it stays white in dark mode. */
    [data-theme="dark"] .lbl-dr-paper { filter: drop-shadow(0 6px 24px rgba(0,0,0,0.5)); }

    @media (max-width: 1100px) {
      .lbl-dr { inset: 0; border-radius: 0; max-width: none; }
      .lbl-dr-body { flex-direction: column; }
      .lbl-dr-editor { width: auto; border-right: none; border-bottom: 1px solid var(--border); max-height: 52%; }
      .lbl-dr-hdr { flex-wrap: wrap; padding: 10px 12px; }
      .lbl-dr-actions { width: 100%; justify-content: flex-end; }
    }

    /* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
       PRINT STYLES â€” QL-800 62mm
    â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
    @media print {
      * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      body > * { display:none !important; }
      #print-root { display:block !important; }
      @page { size:62mm auto; margin:0; }
      /* Reset preview transform */
      #print-root #label-preview { zoom:unset !important; transform:none !important; transform-origin:unset !important; }
      /* Hide any canvas/video elements outside print-root (preview QR, scan camera, etc.) */
      canvas, video { display:none !important; }
      #print-root canvas { display:block !important; }

      /* A printed label has no affordances: the preview's click-to-select
         regions must leave no trace on paper. */
      #print-root .lbl-region { cursor:auto !important; }
      #print-root .lbl-region::after { display:none !important; }

      /* Thermal printing is 1-bit: every ink step collapses to solid
         black so no key or metadata value prints as a faint gray. */
      #print-root .lbl {
        --ink:#000 !important; --ink-2:#000 !important; --ink-3:#000 !important;
        --rule:#000 !important;
      }
      #print-root .lbl-qr-hint,
      #print-root .lbl-origin,
      #print-root .lbl-kv-k,
      #print-root .lbl-spec-k,
      #print-root .lbl-yarn-k,
      #print-root .lbl-meta-k,
      #print-root .lbl-bc-id { opacity:1 !important; }
      /* Hairlines stay hairlines but must actually mark the paper */
      #print-root .lbl-block { border-top-color:#000 !important; }
      #print-root .lbl-spec { border-left-color:#000 !important; }
      /* Logo and the single teal accent print mono */
      #print-root .lbl .lc1, #print-root .lbl .lc2 { fill:#000 !important; }
      #print-root .lbl-bc-site { color:#000 !important; }
      #print-root .lbl-ykey { opacity:1 !important; }
    }

    #print-root { display:none; }

    /* â”€â”€ LOADING SCREEN â”€â”€ */
    #loading-screen {
      position:fixed; inset:0; background:var(--bg); z-index:9999;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.75rem;
      transition:opacity 0.3s;
    }
    #loading-screen.fade-out { opacity:0; pointer-events:none; }
    .loading-logo { opacity:0.9; }
    .loading-logo svg { height:32px; width:auto; display:block; }
    [data-theme="dark"] #loading-screen .cls-2 { fill:var(--text); }
    .loading-spinner { width:20px; height:20px; border:2px solid var(--border); border-top-color:var(--text-3); border-radius:50%; animation:spin 0.7s linear infinite; }

    /* â”€â”€ PRODUCT SHEET PDF PRINT â”€â”€ */
    @media print {
      body.printing-product > * { display:none !important; }
      body.printing-product #product-print-root { display:block !important; }
    }
    #product-print-root { display:none; }

    /* â”€â”€ SHIPPING GUIDE PRINT â”€â”€ */
    @media print {
      body.printing-guide > * { display:none !important; }
      body.printing-guide #guide-print-root { display:block !important; }
    }
    #guide-print-root { display:none; }

    /* â”€â”€ ORGANIGRAMA PDF EXPORT â”€â”€ same "hidden root shown only under
       @media print" pattern as the label/product/guide printers above â€”
       a chart built specifically for export (Â§13), never a screenshot of
       the live canvas: no sidebar, no filters, no scroll/zoom controls. */
    @media print {
      body.printing-org > * { display:none !important; }
      body.printing-org #org-print-root { display:block !important; }
    }
    #org-print-root { display:none; }
    /* Corporate export composition (Â§19-21) â€” a real document header/
       footer, generous whitespace around a centered hierarchy, never a
       screenshot of the interactive canvas. */
    .orgp-page { display:flex; flex-direction:column; align-items:center; }
    .orgp-header { font-family:inherit; color:#000; margin-bottom:9mm; width:100%; display:flex; align-items:flex-start; justify-content:space-between; gap:6mm; border-bottom:1.5px solid #111; padding-bottom:4mm; }
    .orgp-header-brand { font-size:0.72rem; font-weight:800; letter-spacing:0.14em; text-transform:uppercase; color:#000; }
    .orgp-title { font-size:1.3rem; font-weight:700; margin-top:2mm; }
    .orgp-sub { font-size:0.82rem; color:#333; margin-top:2px; font-weight:600; }
    .orgp-meta-line { font-size:0.7rem; color:#666; margin-top:3mm; }
    .orgp-meta-line b { color:#333; }
    .orgp-footer { width:100%; margin-top:8mm; padding-top:3mm; border-top:1px solid #ccc; display:flex; justify-content:space-between; font-size:0.64rem; color:#888; }
    .orgp-chart-wrap { position:relative; }
    .orgp-card {
      position:absolute; display:flex; flex-direction:column; background:#fff; border:1px solid #ccc; border-radius:12px;
      box-sizing:border-box; overflow:hidden;
    }
    .orgp-card-top { display:flex; align-items:flex-start; gap:8px; padding:0.6rem 0.7rem; flex:1; }
    /* Rounded-square portrait to visually match the interactive card
       (Â§6/Â§18) â€” object-fit:cover crops instead of stretching, so a
       non-square source photo is never distorted in export either. */
    .orgp-avatar { width:44px; height:44px; min-width:44px; border-radius:10px; overflow:hidden; background:#eee; display:flex; align-items:center; justify-content:center; font-size:0.8rem; font-weight:700; color:#555; }
    .orgp-avatar img { width:100%; height:100%; object-fit:cover; }
    /* Exported cards never truncate names/positions either (Â§2) â€” they
       reuse the same dynamically-sized layout as the live canvas. */
    .orgp-name { font-size:0.88rem; font-weight:700; color:#000; white-space:normal; overflow-wrap:break-word; }
    .orgp-title2 { font-size:0.76rem; color:#333; white-space:normal; overflow-wrap:break-word; margin-top:1px; }
    .orgp-meta { font-size:0.68rem; color:#666; white-space:normal; overflow-wrap:break-word; margin-top:3px; }
    .orgp-reports { font-size:0.66rem; font-weight:600; color:#555; width:100%; border-top:1px solid #ddd; background:#f7f7f7; padding:0.28rem 0.5rem; text-align:center; }
    .orgp-conn { fill:none; stroke:#999; stroke-width:1.2; }
    .sg-wrap { font-family:inherit; color:#000; max-width:180mm; margin:0 auto; }
    .sg-top { display:flex; align-items:flex-start; justify-content:space-between; border-bottom:2.5px solid #000; padding-bottom:5mm; margin-bottom:5mm; }
    .sg-brand { font-size:15pt; font-weight:800; letter-spacing:-0.02em; }
    .sg-doctype { font-size:7pt; font-weight:700; text-transform:uppercase; letter-spacing:0.18em; margin-top:1mm; color:#444; }
    .sg-ref { text-align:right; }
    .sg-ref-id { font-size:14pt; font-weight:700; font-variant-numeric:tabular-nums; }
    .sg-ref-date { font-size:7.5pt; color:#444; margin-top:1mm; }
    .sg-badges { display:flex; gap:2mm; margin-bottom:5mm; }
    .sg-badge { font-size:8pt; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; border:1.5px solid #000; padding:1.5mm 4mm; border-radius:2mm; }
    .sg-badge.urgent { background:#000; color:#fff; }
    .sg-parties { display:grid; grid-template-columns:1fr 1fr; gap:6mm; margin-bottom:6mm; }
    .sg-party { border:1px solid #000; border-radius:2mm; padding:4mm; }
    .sg-party-lbl { font-size:6.5pt; font-weight:700; text-transform:uppercase; letter-spacing:0.14em; color:#555; margin-bottom:2mm; }
    .sg-party-name { font-size:11pt; font-weight:700; margin-bottom:1mm; }
    .sg-party-line { font-size:8.5pt; line-height:1.5; }
    .sg-table { width:100%; border-collapse:collapse; margin-bottom:6mm; }
    .sg-table th { font-size:6.5pt; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; text-align:left; border-bottom:1.5px solid #000; padding:2mm 2mm; color:#444; }
    .sg-table td { font-size:9pt; padding:2.5mm 2mm; border-bottom:0.5px solid #999; }
    .sg-table .sg-qty { text-align:center; font-weight:700; }
    .sg-note { font-size:8pt; color:#333; border:1px solid #999; border-radius:2mm; padding:3mm 4mm; margin-bottom:6mm; line-height:1.5; }
    .sg-barcode-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:8mm; }
    .sg-together { font-size:7.5pt; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; }
    .sg-sigs { display:grid; grid-template-columns:1fr 1fr; gap:10mm; margin-top:10mm; }
    .sg-sig { border-top:1px solid #000; padding-top:2mm; font-size:7.5pt; color:#444; }

    /* â”€â”€ SAMPLE CENTER â”€â”€ */
    #view-samples, #view-sample-detail { display:none; }

    /* Sample status badges â€” StatusBadge family (Â§41), alias of .status-badge */
    .smp-badge { display:inline-flex; align-items:center; gap:var(--status-gap); height:var(--status-h); padding:0 var(--status-px); font-size:var(--status-font-size); font-weight:600; line-height:1; border-radius:var(--status-radius); white-space:nowrap; border:1px solid transparent; }
    .smp-badge .si-icon { flex-shrink:0; width:var(--status-icon-size); height:var(--status-icon-size); }
    /* Each status maps to one secondary family, consistently: neutral for
       not-yet-active/archived, warm-yellow for in-progress, green for a
       positive step, blue for in-transit/ready, purple for the one-off
       hand-off step, orange for needs-attention, red for a problem. Never
       brand teal â€” status is information, not an interactive affordance. */
    .smp-draft      { background:var(--surface2);              color:var(--text-3);              border:1px dashed var(--border-strong); }
    .smp-requested  { background:var(--surface2);              color:var(--text-3); }
    .smp-approved   { background:rgba(62,214,0,0.12);          color:var(--sem-green-dark-text); }
    .smp-preparing  { background:var(--warning-bg);            color:var(--warning-text); }
    .smp-ready      { background:rgba(0,159,255,0.10);         color:var(--sem-blue-dark-text); }
    .smp-picked_up  { background:rgba(158,0,203,0.10);         color:var(--sem-purple-dark-text); }
    .smp-shipped    { background:rgba(0,159,255,0.13);         color:var(--sem-blue-dark-text); }
    .smp-delivered  { background:rgba(62,214,0,0.15);          color:var(--sem-green-dark-text); }
    .smp-returned   { background:var(--sem-orange-light);      color:var(--sem-orange-dark-text); }
    .smp-damaged    { background:var(--danger-bg);             color:var(--danger); }
    .smp-archived   { background:var(--surface2);              color:var(--text-3); }
    [data-theme="dark"] .smp-returned { background:rgba(255,120,36,0.14); }

    /* â”€â”€ PageMetrics â”€â”€ compact inline counters that double as quick
       filters. Never oversized "dashboard cards". .page-metrics/.page-metric
       are canonical; .dq-counters/.dq-counter kept as aliases. */
    .page-metrics, .dq-counters { display:flex; gap:var(--sp-2); margin-bottom:var(--panel-gap); flex-wrap:wrap; }
    .page-metric, .dq-counter {
      display:flex; align-items:baseline; gap:0.4rem; padding:0.4rem 0.75rem;
      border:1px solid var(--border); border-radius:var(--r-sm); background:var(--surface2);
      font-size:0.72rem; color:var(--text-2); cursor:pointer; user-select:none;
      transition:border-color var(--dur-fast) var(--ease-out);
    }
    .page-metric:hover, .dq-counter:hover { border-color:var(--text-3); }
    .page-metric.active, .dq-counter.active { border-color:var(--accent); color:var(--text); }
    .page-metric b, .dq-counter b { font-size:1rem; color:var(--text); font-weight:700; font-variant-numeric:tabular-nums; }
    .page-metric.overdue b, .dq-counter.overdue b { color:var(--danger); }

    /* â”€â”€ PageToolbar â”€â”€ compact filter row shared by every list/queue
       screen. .page-toolbar is canonical; .dq-toolbar kept as an alias. */
    .page-toolbar, .dq-toolbar { display:flex; flex-wrap:wrap; gap:var(--sp-2); margin-bottom:var(--panel-gap); align-items:center; }
    .page-toolbar input[type=text], .page-toolbar select,
    .dq-toolbar input[type=text], .dq-toolbar select {
      border:1px solid var(--border); border-radius:var(--control-radius); background:var(--surface2); color:var(--text);
      font-family:inherit; font-size:13px; padding:0 10px; height:var(--control-h); box-sizing:border-box; color:var(--text-primary);
    }
    .page-toolbar input[type=text], .dq-toolbar input[type=text] { min-width:170px; flex:1; max-width:260px; }
    .page-toolbar-sep, .dq-toolbar-sep { width:1px; height:1.3rem; background:var(--border); }

    /* â”€â”€ ERP table â”€â”€ the ONE dense operational table used by every
       queue/picking screen (Dispatch Queue, Picking). Sticky header,
       compact row height, right-aligned numerics via [data-num]. */
    .erp-table-wrap, .dq-table-wrap { border:1px solid var(--border); border-radius:var(--panel-radius); overflow:auto; }
    .erp-table, .dq-table, .pick-table { width:100%; border-collapse:collapse; font-size:0.79rem; }
    .erp-table th, .dq-table th, .pick-table th {
      text-align:left; font-size:0.62rem; text-transform:uppercase; letter-spacing:0.06em;
      color:var(--text-3); font-weight:600; padding:0.45rem 0.7rem; border-bottom:1px solid var(--border);
      background:var(--surface2); white-space:nowrap; position:sticky; top:0; z-index:2;
    }
    /* Table values never wrap onto multiple lines by default â€” a long name
       truncates (via .emp-td-trunc/.cat-row-name-style max-width+ellipsis
       classes) or the column stays on one line and the table scrolls
       horizontally (.erp-table-wrap already does overflow:auto). Opt a
       genuinely long-form column (notes, addresses) back into wrapping
       with .td-wrap â€” never let a name/code/position column wrap by
       accident because nobody set a width on it. */
    .erp-table td, .dq-table td, .pick-table td { padding:0.42rem 0.7rem; border-bottom:1px solid var(--border); vertical-align:middle; white-space:nowrap; }
    .erp-table td.td-wrap, .dq-table td.td-wrap, .pick-table td.td-wrap { white-space:normal; }
    .erp-table td.emp-td-trunc, .erp-table td.td-trunc { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px; height:46px; }
    .erp-table td.emp-td-trunc-wide { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:320px; height:46px; }
    .erp-table tbody tr:last-child td, .dq-table tbody tr:last-child td, .pick-table tbody tr:last-child td { border-bottom:none; }
    .erp-table tbody tr.is-clickable, .dq-table tbody tr { cursor:pointer; transition:background var(--dur-fast) var(--ease-out); }
    .erp-table tbody tr.is-clickable:hover, .dq-table tbody tr:hover { background:var(--surface2); }
    .erp-table [data-num], .dq-table [data-num] { text-align:right; font-variant-numeric:tabular-nums; }
    .dq-row-id { font-weight:700; font-variant-numeric:tabular-nums; font-size:0.76rem; white-space:nowrap; }
    .dq-row-kind { font-size:0.6rem; color:var(--text-3); text-transform:uppercase; letter-spacing:0.05em; margin-top:0.1rem; }
    /* No truncation â€” this cell holds the collection/request name, governed
       by SIERRA_DESIGN_SYSTEM.md Â§7b. Wraps instead of clipping. */
    .dq-row-name { font-weight:500; white-space:normal; overflow-wrap:break-word; }
    .dq-next { color:var(--accent); font-weight:600; white-space:nowrap; }
    .dq-overdue-dot { width:6px; height:6px; border-radius:50%; background:var(--danger); display:inline-block; margin-right:0.4rem; flex-shrink:0; }
    .page-empty, .dq-empty { padding:2.5rem 1rem; text-align:center; color:var(--text-3); font-size:0.85rem; }

    /* â”€â”€ ViewTabs, inline variant â”€â”€ the segmented-control .pd-tabs/.pd-tab
       pair (used by the Collection workspace Board/Cards/Table/Stats tabs)
       stretches every tab to equal width via flex:1, which is right for a
       small fixed set filling a bounded box but wrong for a tab strip that
       should hug its content (Catalog's Table|Cards switch, saved views).
       .pd-tabs-inline keeps the same visual language â€” pill track, active
       tab lifted on --surface with a soft shadow â€” without the stretch, and
       without background/border on the track so it can sit directly under
       a PageHeader. Never invent a second tab component for this job. */
    .pd-tabs-inline { display:flex; gap:0.2rem; background:none; border:none; padding:0; margin:0 0 var(--panel-gap); overflow-x:auto; scrollbar-width:none; }
    .pd-tabs-inline::-webkit-scrollbar { display:none; }
    .pd-tabs-inline .pd-tab { flex:none; background:var(--surface2); border:1px solid transparent; white-space:nowrap; }
    /* Neutral, not teal â€” this component now serves view switchers (Table|
       Cards) and filter chips (saved views). Selection here means "this is
       the active view/filter," not "this is where you are" (that's
       .section-tabs below); a large cyan pill for either would out-rank
       the actual data on screen. */
    .pd-tabs-inline .pd-tab.active { background:var(--surface); border-color:var(--border-strong); box-shadow:0 1px 2px rgba(0,0,0,0.05); color:var(--text-primary); }
    .pd-tabs-inline .pd-tab-count { margin-left:0.35rem; opacity:0.65; font-weight:500; }

    /* â”€â”€ SectionTabs â”€â”€ primary in-page navigation between the top-level
       views of a module (Talento Humano: Colaboradores/Cola de gafetes/
       Historial/Empresas/ConfiguraciÃ³n). Navigation reads as navigation â€”
       thin teal underline on the active item, not a filled pill â€” never
       reuse .pd-tabs-inline for this job (that's a view switcher/filter,
       a different hierarchy level). */
    .section-tabs { display:flex; gap:var(--sp-5); border-bottom:1px solid var(--border); margin-bottom:var(--section-gap); overflow-x:auto; scrollbar-width:none; }
    .section-tabs::-webkit-scrollbar { display:none; }
    .section-tab {
      position:relative; flex:none; background:none; border:none; cursor:pointer;
      font-family:inherit; font-size:0.84rem; font-weight:500; color:var(--text-3);
      padding:0.7rem 0.1rem; white-space:nowrap; transition:color var(--dur-fast) var(--ease-out);
    }
    .section-tab:hover { color:var(--text-primary); }
    .section-tab.active { color:var(--accent-dark,var(--text-primary)); font-weight:650; }
    .section-tab.active::after { content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--accent); border-radius:2px 2px 0 0; }

    /* RecordTabs is now a first-class component (.record-tabs / .sub-tabs,
       defined with the tab system above) â€” the old .pd-tabs-nav variant that
       re-skinned the segmented control has been removed. */

    /* â”€â”€ Catalog DataToolbar â”€â”€ one shared toolbar row for the Catalog list
       screen (Â§ SIERRA_DESIGN_SYSTEM.md "Catalog"): + New product / Search /
       Filter / Sort / Group by / Hide columns / â€¢â€¢â€¢. Composed entirely from
       .page-toolbar + .btn + the shared .ws-pop popover primitive â€” no
       page-specific toolbar shell. */
    /* .cat-toolbar-search retired â€” search box is now .sf-search (SearchField
       primitive, defined near .control-input/.control-search). */
    .cat-toolbar-spacer { flex:1; }
    .cat-tb-btn { position:relative; display:inline-flex; align-items:center; gap:0.35rem; }
    .cat-tb-btn.has-value { border-color:var(--accent); color:var(--accent-dark,var(--text)); }
    .cat-tb-btn-dot { width:6px; height:6px; border-radius:50%; background:var(--accent); }
    .cat-pop { min-width:230px; max-height:340px; overflow-y:auto; }
    .cat-pop-title { font-size:0.62rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-3); padding:0.3rem 0.5rem 0.4rem; }
    .cat-pop-row { display:flex; align-items:center; gap:0.5rem; width:100%; text-align:left; font-family:inherit; font-size:0.8rem; color:var(--text); background:none; border:none; border-radius:8px; padding:0.4rem 0.5rem; cursor:pointer; }
    .cat-pop-row:hover { background:var(--surface2); }
    .cat-pop-row.active { font-weight:650; color:var(--teal); }
    .cat-pop-row input[type=checkbox] { accent-color:var(--accent); }
    .cat-pop-row .cat-pop-count { margin-left:auto; color:var(--text-3); font-size:0.72rem; }
    .cat-pop-ftr { display:flex; justify-content:flex-end; padding:0.4rem 0.3rem 0.1rem; border-top:1px solid var(--border); margin-top:0.3rem; }

    /* Grouped rows (Colaboradores â†’ Agrupar) â€” collapsible section header,
       reuses the Talento Humano accent tint rather than a saturated block. */
    .erp-table tr.emp-group-row { cursor:pointer; background:var(--surface2); }
    .erp-table tr.emp-group-row:hover { background:var(--surface-hover,var(--surface2)); }
    .erp-table tr.emp-group-row td { padding:0.5rem 0.9rem; border-bottom:1px solid var(--border); white-space:nowrap; }
    .emp-group-caret { display:inline-flex; color:var(--text-3); margin-right:6px; transition:transform var(--dur-fast) var(--ease-out); vertical-align:-1px; }
    .emp-group-caret.collapsed { transform:rotate(-90deg); }
    .emp-group-label { font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-primary); }
    .emp-group-count { margin-left:8px; font-size:0.72rem; font-weight:600; color:var(--text-3); }

    /* â”€â”€ Catalog ERP table specifics â”€â”€ layered on .erp-table (above):
       checkbox column, sortable header buttons, collapsible group rows. */
    .erp-table th.cat-th-select, .erp-table td.cat-td-select { width:2.2rem; padding-left:0.9rem; padding-right:0.2rem; }
    .erp-table td.cat-td-select input, .erp-table th.cat-th-select input { accent-color:var(--accent); cursor:pointer; }
    .cat-th-sort { display:inline-flex; align-items:center; gap:0.25rem; background:none; border:none; font:inherit; color:inherit; text-transform:inherit; letter-spacing:inherit; padding:0; cursor:pointer; }
    .cat-th-sort svg { width:9px; height:9px; opacity:0.35; }
    .cat-th-sort.active svg { opacity:1; color:var(--accent); }
    .cat-group-row td { background:var(--surface2); font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-2); padding:0.42rem 0.7rem; cursor:pointer; border-bottom:1px solid var(--border); }
    .cat-group-row .cat-group-count { font-weight:500; text-transform:none; letter-spacing:0; color:var(--text-3); margin-left:0.4rem; }
    .cat-group-row .cat-group-chevron { display:inline-block; width:9px; height:9px; margin-right:0.5rem; transition:transform var(--dur-fast) var(--ease-out); }
    .cat-group-row.collapsed .cat-group-chevron { transform:rotate(-90deg); }
    .erp-table tbody tr.cat-row-selected { background:var(--accent-light,var(--surface2)); }
    /* Talento Humano: Colaboradores selected rows use a neutral gray, not
       a full teal fill â€” teal is reserved for the thin left-edge indicator
       and the (already-teal) checkbox. Distinct from the plain :hover
       background (--surface2) above so the two states never read the same. */
    .erp-table tbody tr.emp-row-selected { background:var(--surface-selected,var(--surface2)); box-shadow:inset 3px 0 0 var(--accent); }
    .erp-table tbody tr.emp-row-selected:hover { background:var(--surface-hover,var(--surface-selected)); }
    .cat-row-code { font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
    /* No truncation â€” product name, governed by SIERRA_DESIGN_SYSTEM.md Â§7b. */
    .cat-row-name { font-weight:500; white-space:normal; overflow-wrap:break-word; }
    .cat-row-name-sub { font-size:0.68rem; color:var(--text-3); font-weight:400; }
    /* Request sample / More share one interaction-scale row â€” see
       .card-actions above. Table-row actions use the canonical
       .btn.btn-primary.btn-sm + overflowMenuHtml(), not a bespoke class. */
    .cat-row-actions { display:flex; align-items:center; justify-content:flex-end; gap:var(--control-gap); white-space:nowrap; }

    /* â”€â”€ Catalog Cards view â”€â”€ same dataset/filters as the table, using
       the ONE shared .pg-grid/.card system (Â§9/Â§31) â€” no denser one-off
       variant. Optimizes for product comprehension: readable name,
       untruncated composition, breathing room, not maximum card count. */

    /* â”€â”€ Bulk action bar (row selection) â”€â”€ same #select-bar element,
       extended with a second contextual action; still the one canonical
       BulkActionBar for products, no page-specific variant. */
    #select-bar { gap:0.5rem; }

    /* â”€â”€ Order workspace (picking/packing) â”€â”€ composed from ContentGrid
       (main + ContextPane) and the shared ERP table above â€” no bespoke
       layout of its own. */
    .ord-hdr-row { display:flex; flex-wrap:wrap; gap:0.35rem 1.5rem; font-size:0.78rem; color:var(--text-2); margin-bottom:var(--panel-gap); }
    .ord-hdr-row b { color:var(--text); font-weight:600; }
    /* â”€â”€ WorkflowStepper â”€â”€ */
    .ord-steps { display:flex; align-items:center; flex-wrap:wrap; gap:0.25rem; margin-bottom:var(--section-gap); }
    .ord-step { font-size:0.66rem; font-weight:600; color:var(--text-3); padding:0.32rem 0.65rem; border-radius:var(--r-pill); background:var(--surface2); white-space:nowrap; }
    .ord-step.current { color:var(--interactive-primary-text); background:var(--interactive-primary-bg); }
    .ord-step.done { color:var(--text-2); }
    .ord-arrow { color:var(--text-3); font-size:0.65rem; }
    .pick-scan-dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
    .pick-scan-dot.pending { background:var(--text-3); opacity:0.4; }
    .pick-scan-dot.confirmed { background:var(--success); }
    .pick-scan-dot.unavailable { background:var(--danger); }
    /* â”€â”€ ContextPane content template â€” label/value rows + dividers,
       shared by every right-side panel (reconciliation, delivery, notes). â”€â”€ */
    .ctx-stat { display:flex; justify-content:space-between; align-items:baseline; font-size:0.79rem; padding:0.28rem 0; }
    .ctx-stat b { font-variant-numeric:tabular-nums; }
    .ctx-stat.warn b { color:var(--danger); }
    .ctx-sep { height:1px; background:var(--border); margin:var(--panel-gap) 0; }
    .ctx-lbl { font-size:0.62rem; font-weight:600; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-3); margin-bottom:0.4rem; }
    .ctx-line { font-size:0.8rem; color:var(--text); margin-bottom:0.15rem; }
    .ctx-line.muted { color:var(--text-3); font-size:0.74rem; }

    /* Sample list */
    .smp-list { display:flex; flex-direction:column; gap:0; }
    .smp-row {
      display:flex; align-items:center; gap:1rem; padding:1rem 0;
      border-bottom:1px solid var(--border); cursor:pointer;
      transition:opacity 0.12s;
    }
    .smp-row:hover { opacity:0.7; }
    .smp-row:last-child { border-bottom:none; }
    .smp-row-id {
      font-size:0.68rem; font-weight:700; letter-spacing:0.06em; color:var(--text-3);
      min-width:130px; flex-shrink:0; font-variant-numeric:tabular-nums;
    }
    .smp-row-product { flex:1; min-width:0; }
    .smp-row-name { font-size:0.88rem; font-weight:500; color:var(--text); white-space:normal; overflow-wrap:break-word; }
    .smp-row-meta { font-size:0.68rem; color:var(--text-3); margin-top:0.1rem; }
    .smp-row-type { font-size:0.72rem; color:var(--text-2); min-width:70px; flex-shrink:0; }
    .smp-row-right { display:flex; align-items:center; gap:0.65rem; flex-shrink:0; }
    .smp-row-date { font-size:0.68rem; color:var(--text-3); }
    .smp-id-inline { display:none; font-weight:700; color:var(--text-3); letter-spacing:0.04em; }

    /* â”€â”€ ContentGrid â”€â”€ MainPane + ContextPane, the ONE split layout for
       every operational/record screen (sample record, collection
       workspace, order workspace). .content-grid is the canonical name;
       .srd-layout is kept as an alias so existing call sites keep working. */
    .content-grid, .srd-layout { display:grid; grid-template-columns:minmax(0,1fr) var(--context-pane-width); gap:var(--content-gap); align-items:start; }
    @media (max-width:900px) { .content-grid, .srd-layout { grid-template-columns:1fr; gap:var(--section-gap); } }
    /* â”€â”€ PageHeader â”€â”€ title/eyebrow + status + actions in one composition.
       .page-header is canonical; .srd-id-block kept as an alias. */
    .page-header, .srd-id-block { display:flex; align-items:center; gap:1.1rem; margin-bottom:var(--section-gap); padding-bottom:var(--section-gap); border-bottom:1px solid var(--border); }
    .page-header-title, .srd-id-text { font-family:"Replica", -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif; font-size:1.6rem; font-weight:700; letter-spacing:-0.02em; color:var(--text); line-height:1; }
    .page-header-meta, .srd-id-sub { font-size:0.7rem; color:var(--text-3); margin-top:0.25rem; text-transform:uppercase; letter-spacing:0.08em; font-weight:600; }
    /* Section label â€” 13px/uppercase, the one heading style below page-title level */
    .page-section-label, .srd-section-label { font-size:0.62rem; font-weight:600; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-3); margin-top:var(--section-gap); margin-bottom:var(--panel-gap); }
    /* â”€â”€ Panel â”€â”€ the one card/panel primitive. .panel is canonical; .srd-card kept as an alias. */
    .panel, .srd-card { border:var(--panel-border); border-radius:var(--panel-radius); padding:var(--panel-padding); }
    .srd-grid { display:grid; grid-template-columns:1fr 1fr; gap:1.25rem; }
    @media (max-width:480px) { .srd-grid { grid-template-columns:1fr; } }
    .srd-field { display:flex; flex-direction:column; gap:0.2rem; }
    .srd-field-lbl { font-size:0.58rem; font-weight:600; text-transform:uppercase; letter-spacing:0.09em; color:var(--text-3); }
    .srd-field-val { font-size:0.93rem; font-weight:500; color:var(--text); line-height:1.35; }

    /* Timeline */
    .srd-timeline { display:flex; flex-direction:column; gap:0; }
    .tl-entry { display:flex; gap:0.85rem; padding-bottom:1.2rem; position:relative; }
    .tl-entry::before { content:''; position:absolute; left:6px; top:14px; bottom:0; width:1px; background:var(--border); }
    .tl-entry:last-child::before { display:none; }
    .tl-dot { width:13px; height:13px; border-radius:50%; background:var(--border); border:2px solid var(--bg); flex-shrink:0; margin-top:1px; z-index:1; }
    .tl-dot.tl-latest { background:var(--accent); }
    .tl-body { flex:1; min-width:0; }
    .tl-label { font-size:0.83rem; font-weight:500; color:var(--text); line-height:1.4; }
    .tl-time { font-size:0.65rem; color:var(--text-3); margin-top:0.15rem; }

    /* QR + barcode panel */
    .srd-codes-panel { display:flex; flex-direction:column; gap:1rem; position:sticky; top:1.5rem; }
    .srd-qr-card { border:1px solid var(--border); border-radius:10px; padding:1.25rem; display:flex; flex-direction:column; align-items:center; gap:0.65rem; }
    .srd-qr-label { font-size:0.6rem; font-weight:600; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-3); }
    .srd-qr-canvas { border-radius:6px; }
    .srd-barcode-svg { max-width:100%; }
    .srd-sample-id-code { font-size:0.75rem; font-weight:700; letter-spacing:0.08em; color:var(--text-3); text-align:center; }

    /* Notification center */
    .notif-btn { position:relative; }
    .notif-badge {
      position:absolute; top:-1px; right:-1px; width:8px; height:8px;
      border-radius:50%; background:var(--accent); border:2px solid var(--bg);
      display:none;
    }
    .notif-badge.show { display:block; }
    .notif-panel {
      position:fixed; top:0; right:0; bottom:0; width:320px; max-width:95vw;
      background:var(--surface); border-left:1px solid var(--border);
      z-index:600; transform:translateX(calc(100% + 48px));
      transition:transform 0.25s cubic-bezier(0.4,0,0.2,1);
      display:flex; flex-direction:column;
      box-shadow:-8px 0 32px rgba(0,0,0,0.08);
    }
    .notif-panel.open { transform:translateX(0); }
    .notif-panel-hdr { padding:1.1rem 1.25rem 0.9rem; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
    .notif-panel-title { font-size:0.88rem; font-weight:700; }
    .notif-panel-mark { font-size:0.72rem; color:var(--accent); background:none; border:none; cursor:pointer; font-family:inherit; }
    .notif-panel-mark:hover { text-decoration:underline; }
    .notif-list { flex:1; overflow-y:auto; padding:0.35rem 0; }
    .notif-item {
      padding:0.85rem 1.25rem; border-bottom:1px solid var(--border);
      cursor:pointer; transition:background 0.1s;
      display:flex; gap:0.75rem; align-items:flex-start;
    }
    .notif-item:hover { background:var(--surface2); }
    .notif-item.unread { background:var(--accent-light); }
    .notif-item.unread:hover { background:var(--accent-light); filter:brightness(0.97); }
    .notif-icon { width:28px; height:28px; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
    .notif-body { flex:1; min-width:0; }
    .notif-title { font-size:0.8rem; font-weight:600; color:var(--text); line-height:1.35; }
    .notif-sub { font-size:0.7rem; color:var(--text-3); margin-top:0.15rem; }
    .notif-unread-dot { width:6px; height:6px; border-radius:50%; background:var(--accent); flex-shrink:0; margin-top:5px; }
    .notif-empty { padding:3rem 1.25rem; text-align:center; color:var(--text-3); font-size:0.82rem; }
    .notif-backdrop { position:fixed; inset:0; z-index:599; display:none; }
    .notif-backdrop.open { display:block; }

    /* Scan mode */
    /* â”€â”€ SCAN MODE â”€â”€ */
    .scan-overlay {
      position:fixed; inset:0; z-index:700;
      display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
      opacity:0; pointer-events:none; transition:opacity 0.22s;
      background:rgba(0,0,0,0.72); backdrop-filter:blur(4px);
    }
    .scan-overlay.open { opacity:1; pointer-events:auto; }
    .scan-sheet {
      width:100%; max-width:440px;
      background:#111; border-radius:20px 20px 0 0;
      padding:0 0 calc(env(safe-area-inset-bottom) + 1.5rem);
      transform:translateY(24px); transition:transform 0.25s cubic-bezier(0.22,1,0.36,1);
    }
    .scan-overlay.open .scan-sheet { transform:translateY(0); }
    @media (min-width:640px) {
      .scan-overlay { justify-content:center; }
      .scan-sheet { border-radius:16px; max-height:90vh; overflow-y:auto; }
    }

    /* Handle / header */
    .scan-handle { width:36px; height:4px; border-radius:2px; background:rgba(255,255,255,0.18); margin:10px auto 0; }
    .scan-hdr {
      display:flex; align-items:center; justify-content:space-between;
      padding:1rem 1.25rem 0.5rem;
    }
    .scan-hdr-title { font-size:0.9rem; font-weight:600; color:#fff; letter-spacing:-0.01em; }
    .scan-hdr-close {
      width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,0.1);
      border:none; cursor:pointer; color:rgba(255,255,255,0.7); font-size:0.9rem;
      display:flex; align-items:center; justify-content:center; transition:background 0.12s;
    }
    .scan-hdr-close:hover { background:rgba(255,255,255,0.18); }

    /* Viewfinder */
    .scan-viewfinder {
      position:relative; margin:0.75rem 1.25rem;
      border-radius:12px; overflow:hidden;
      background:#000; aspect-ratio:4/3;
    }
    #scan-video { width:100%; height:100%; object-fit:cover; display:none; }
    .scan-viewfinder.active #scan-video { display:block; }
    /* Corner brackets */
    .scan-frame {
      position:absolute; inset:0; pointer-events:none;
    }
    .scan-frame::before, .scan-frame::after,
    .scan-corner-br, .scan-corner-bl {
      content:''; position:absolute; width:22px; height:22px;
      border-color:#fff; border-style:solid; opacity:0.85;
    }
    .scan-frame::before { top:12px; left:12px; border-width:2.5px 0 0 2.5px; border-radius:3px 0 0 0; }
    .scan-frame::after  { top:12px; right:12px; border-width:2.5px 2.5px 0 0; border-radius:0 3px 0 0; }
    .scan-corner-br { bottom:12px; right:12px; border-width:0 2.5px 2.5px 0; border-radius:0 0 3px 0; }
    .scan-corner-bl { bottom:12px; left:12px; border-width:0 0 2.5px 2.5px; border-radius:0 0 0 3px; }
    /* Scan line */
    .scan-line {
      position:absolute; left:12px; right:12px; height:2px;
      background:linear-gradient(90deg, transparent, rgba(0,153,255,0.85), transparent);
      border-radius:1px;
      animation:scanline 1.8s ease-in-out infinite;
      display:none;
    }
    .scan-viewfinder.active .scan-line { display:block; }
    @keyframes scanline {
      0%   { top:14px; opacity:0; }
      10%  { opacity:1; }
      90%  { opacity:1; }
      100% { top:calc(100% - 14px); opacity:0; }
    }
    /* Status overlay */
    .scan-status {
      position:absolute; bottom:0; left:0; right:0;
      padding:0.65rem 1rem; background:linear-gradient(0deg,rgba(0,0,0,0.75),transparent);
      font-size:0.72rem; color:rgba(255,255,255,0.7); text-align:center;
    }
    .scan-status.found { color:#4ade80; font-weight:600; }
    /* Placeholder when camera is off */
    .scan-no-camera {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:0.55rem; color:rgba(255,255,255,0.35); font-size:0.78rem; height:100%;
      padding:2rem;
    }
    .scan-cam-btn {
      display:flex; align-items:center; gap:0.55rem;
      margin:0.75rem 1.25rem 0;
      border:1px solid rgba(255,255,255,0.15); border-radius:10px;
      padding:0.7rem 1rem; background:rgba(255,255,255,0.06); cursor:pointer;
      font-family:inherit; font-size:0.82rem; color:rgba(255,255,255,0.75);
      transition:background 0.12s; width:calc(100% - 2.5rem);
    }
    .scan-cam-btn:hover { background:rgba(255,255,255,0.1); }
    .scan-cam-btn.active { border-color:rgba(0,153,255,0.6); color:#fff; }

    /* Manual input */
    .scan-input-section { padding:0.85rem 1.25rem 0; }
    .scan-input-label { font-size:0.6rem; font-weight:600; text-transform:uppercase; letter-spacing:0.1em; color:rgba(255,255,255,0.35); margin-bottom:0.45rem; }
    .scan-input-wrap {
      background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12);
      border-radius:10px; padding:0.75rem 1rem; display:flex; align-items:center; gap:0.65rem;
      transition:border-color 0.15s;
    }
    .scan-input-wrap:focus-within { border-color:rgba(255,255,255,0.3); }
    .scan-input-wrap input {
      flex:1; background:none; border:none; outline:none; font-family:inherit;
      font-size:0.95rem; color:#fff; caret-color:#09f;
    }
    .scan-input-wrap input::placeholder { color:rgba(255,255,255,0.3); }
    .scan-go-btn {
      background:rgba(255,255,255,0.12); border:none; border-radius:6px; cursor:pointer;
      color:rgba(255,255,255,0.7); font-family:inherit; font-size:0.72rem; font-weight:600;
      padding:0.3rem 0.65rem; transition:background 0.12s; white-space:nowrap;
    }
    .scan-go-btn:hover { background:rgba(255,255,255,0.2); }

    /* Recents */
    .scan-recents { padding:0.85rem 1.25rem 0; }
    .scan-recents-label { font-size:0.6rem; font-weight:600; text-transform:uppercase; letter-spacing:0.1em; color:rgba(255,255,255,0.35); margin-bottom:0.5rem; }
    .scan-recent-item {
      display:flex; align-items:center; gap:0.75rem;
      padding:0.55rem 0; border-bottom:1px solid rgba(255,255,255,0.07);
      cursor:pointer; transition:opacity 0.12s;
    }
    .scan-recent-item:last-child { border-bottom:none; }
    .scan-recent-item:hover { opacity:0.75; }
    .scan-recent-icon { color:rgba(255,255,255,0.3); flex-shrink:0; }
    .scan-recent-id { font-size:0.78rem; font-weight:600; color:rgba(255,255,255,0.8); font-variant-numeric:tabular-nums; letter-spacing:0.04em; }
    .scan-recent-name { font-size:0.68rem; color:rgba(255,255,255,0.4); margin-top:0.05rem; }
    #scan-camera-view { display:none; }

    /* Product page â€” sample history */
    /* Stacked layout (not a side-by-side id column) so this reads cleanly
       even in the narrow media-column width, not just on mobile. */

    /* â”€â”€ Colecciones hub â€” card grid â”€â”€ */
    .colh-tabs { display:flex; gap:0.4rem; margin-bottom:1.5rem; }
    .colh-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:0.9rem; }
    .colh-card {
      border:1px solid var(--border); border-radius:16px; padding:1.1rem 1.15rem;
      background:var(--surface); cursor:pointer; text-align:left; font-family:inherit;
      display:flex; flex-direction:column; gap:0.7rem;
      transition:border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
    }
    .colh-card:hover { border-color:var(--text-3); box-shadow:var(--shadow); transform:translateY(-1px); }
    .colh-card-hdr { display:flex; align-items:flex-start; justify-content:space-between; gap:0.5rem; }
    .colh-card-name { font-size:0.95rem; font-weight:700; letter-spacing:-0.01em; color:var(--text); line-height:1.25; }
    .colh-card-sub { font-size:0.7rem; color:var(--text-3); margin-top:0.2rem; }
    .colh-card-dots { display:flex; gap:0.3rem; flex-wrap:wrap; }
    .colh-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
    .colh-card-ftr { display:flex; align-items:center; justify-content:space-between; margin-top:auto; }
    .colh-avatars { display:flex; }
    .colh-avatar {
      width:22px; height:22px; border-radius:50%; background:var(--surface2); border:2px solid var(--surface);
      display:flex; align-items:center; justify-content:center; font-size:0.58rem; font-weight:700; color:var(--text-2);
      margin-left:-7px; flex-shrink:0; overflow:hidden;
    }
    .colh-avatar:first-child { margin-left:0; }
    .colh-avatar img { width:100%; height:100%; object-fit:cover; }
    .colh-card-meta { display:flex; align-items:center; gap:0.5rem; font-size:0.68rem; color:var(--text-3); }
    .colh-comment-chip { display:inline-flex; align-items:center; gap:0.25rem; color:var(--text-3); }
    .colh-deadline {
      display:inline-flex; align-items:center; gap:0.3rem; align-self:flex-start; font-size:0.68rem; font-weight:600;
      background:var(--surface2); color:var(--text-2); border-radius:999px; padding:0.2rem 0.55rem;
    }
    .colh-deadline.overdue { background:rgba(192,57,43,0.12); color:var(--danger); }
    .colh-new-card {
      border:1.5px dashed var(--border); border-radius:16px; padding:1.1rem 1.15rem; min-height:118px;
      background:none; cursor:pointer; font-family:inherit; color:var(--text-3);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.4rem;
      transition:border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
    }
    .colh-new-card:hover { border-color:var(--accent); color:var(--accent); }
    .colh-empty { padding:3rem 1rem; text-align:center; color:var(--text-3); font-size:0.85rem; }

    /* â”€â”€ Collection workspace â€” editable name, categories, comments â”€â”€ */
    .ws-name-input {
      font-size:1.6rem; font-weight:700; letter-spacing:-0.02em; color:var(--text); line-height:1.2;
      background:none; border:1px solid transparent; border-radius:8px; padding:0.15rem 0.4rem; margin:-0.15rem -0.4rem;
      font-family:inherit; width:100%; transition:background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
    }
    .ws-name-input::placeholder { color:var(--text-3); font-weight:600; }
    .ws-name-input:hover { background:var(--surface2); }
    .ws-name-input:focus { outline:none; background:var(--surface2); border-color:var(--border); }
    .ws-board-hero {
      border:1px solid var(--border); border-radius:14px; background:linear-gradient(180deg,var(--surface) 0%,var(--surface-subtle) 100%);
      padding:1rem; margin:0.8rem 0 1rem; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:1rem; align-items:start;
    }
    .ws-board-hero-title { display:flex; align-items:center; gap:0.45rem; font-size:0.78rem; font-weight:700; color:var(--text); }
    .ws-board-hero-sub { margin-top:0.25rem; font-size:0.72rem; color:var(--text-3); line-height:1.45; max-width:680px; }
    .ws-board-kpis { display:grid; grid-template-columns:repeat(4,minmax(96px,1fr)); gap:0.45rem; margin-top:0.85rem; }
    .ws-board-kpi { border:1px solid var(--border); border-radius:9px; background:var(--surface); padding:0.55rem 0.65rem; min-width:0; }
    .ws-board-kpi strong { display:block; font-size:1.05rem; line-height:1.1; color:var(--text); }
    .ws-board-kpi span { display:block; margin-top:0.15rem; font-size:0.64rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-3); font-weight:700; }
    .ws-hero-actions { display:flex; align-items:center; justify-content:flex-end; gap:0.45rem; flex-wrap:wrap; }
    .ws-readiness { display:flex; align-items:center; gap:0.35rem; color:var(--text-2); font-size:0.74rem; font-weight:700; white-space:nowrap; }
    .ws-readiness-ring {
      --pct:0%; width:34px; height:34px; border-radius:50%; display:grid; place-items:center;
      background:conic-gradient(var(--accent) var(--pct), var(--surface2) 0); color:var(--text);
    }
    .ws-readiness-ring::after { content:''; width:24px; height:24px; border-radius:50%; background:var(--surface); box-shadow:inset 0 0 0 1px var(--border); }
    .ws-flow-steps { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0.45rem; margin:0.5rem 0 1rem; }
    .ws-flow-step {
      display:flex; align-items:center; gap:0.45rem; min-width:0; border:1px solid var(--border); border-radius:10px;
      padding:0.55rem 0.65rem; background:var(--surface); color:var(--text-3); font-size:0.72rem; font-weight:700;
    }
    .ws-flow-step svg { flex-shrink:0; }
    .ws-flow-step.done { color:var(--accent); border-color:color-mix(in srgb,var(--accent) 28%,var(--border)); background:var(--accent-light); }
    .ws-flow-step.now { color:var(--text); border-color:var(--text-3); }
    .ws-board-panel { border:1px solid var(--border); border-radius:14px; background:var(--surface); overflow:hidden; }
    .ws-board-toolbar {
      display:grid; grid-template-columns:minmax(260px,1fr) auto; gap:0.75rem; align-items:center;
      padding:0.75rem; border-bottom:1px solid var(--border); background:var(--surface-subtle);
    }
    .ws-board-tools { display:flex; align-items:center; justify-content:flex-end; gap:0.45rem; flex-wrap:wrap; }
    .ws-category-create {
      display:flex; align-items:center; gap:0.35rem; min-width:260px; border:1px solid var(--border);
      border-radius:9px; background:var(--surface); padding:0.25rem 0.3rem 0.25rem 0.55rem;
    }
    .ws-category-create svg { color:var(--text-3); flex-shrink:0; }
    .ws-category-create input { min-width:0; flex:1; border:0; background:transparent; color:var(--text); font:inherit; font-size:0.78rem; outline:none; }
    .ws-category-create .btn { flex-shrink:0; }
    .ws-board-body { padding:0.75rem; }
    .ws-cat-group { margin-bottom:0.75rem; border:1px solid var(--border); border-radius:12px; background:var(--surface); overflow:hidden; }
    .ws-cat-group:last-child { margin-bottom:0; }
    .ws-cat-hdr { display:flex; align-items:center; gap:0.5rem; padding:0.65rem 0.75rem; background:var(--surface-subtle); border-bottom:1px solid var(--border); margin-bottom:0; }
    .ws-cat-name { font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-2); }
    .ws-cat-count { font-size:0.68rem; color:var(--text-3); background:var(--surface2); border-radius:999px; padding:0.05rem 0.5rem; }
    .ws-cat-action { background:none; border:none; color:var(--text-3); cursor:pointer; font-size:0.72rem; padding:0.1rem 0.3rem; margin-left:-0.2rem; }
    .ws-cat-action:hover { color:var(--text); }
    .ws-add-cat-btn {
      background:none; border:1px dashed var(--border); border-radius:999px; color:var(--text-3);
      font-family:inherit; font-size:0.68rem; font-weight:600; padding:0.15rem 0.65rem; cursor:pointer; margin-left:auto;
      transition:border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
    }
    .ws-add-cat-btn:hover { border-color:var(--accent); color:var(--accent); }
    .ws-cat-hdr { cursor:pointer; user-select:none; }
    .ws-cat-chevron { color:var(--text-3); flex-shrink:0; transition:transform var(--dur-fast) var(--ease-out); }
    .ws-cat-chevron.collapsed { transform:rotate(-90deg); }
    .ws-cat-body { padding:0.25rem 0.5rem; }
    .ws-cat-body.collapsed { display:none; }

    /* Board rows â€” one line per sample, all the fields you touch often
       (type, qty, category, price) inline, like a Monday board row. */
    .ws-row { display:grid; grid-template-columns:auto auto minmax(190px,1fr) 128px auto 140px minmax(92px,auto) auto; align-items:center; gap:0.55rem; padding:0.6rem 0.4rem; border-bottom:1px solid var(--border); font-size:0.83rem; }
    .ws-row:last-child { border-bottom:none; }
    .ws-row:hover { background:var(--surface-subtle); border-radius:8px; }
    .ws-row-index { width:24px; height:24px; border-radius:7px; display:grid; place-items:center; font-size:0.68rem; font-weight:800; color:var(--text-2); background:var(--surface2); }
    /* No truncation â€” product name, governed by SIERRA_DESIGN_SYSTEM.md Â§7b. */
    .ws-row-name { min-width:0; font-weight:650; color:var(--text); white-space:normal; overflow-wrap:break-word; }
    .ws-row-code { display:block; font-size:0.68rem; font-weight:500; color:var(--text-3); }
    .ws-row-type { width:118px; flex-shrink:0; }
    .ws-row-qty { flex-shrink:0; }
    .ws-row-cat { width:126px; flex-shrink:0; }
    .ws-item-checkbox, .ws-select-all { width:15px; height:15px; flex-shrink:0; accent-color:var(--accent); cursor:pointer; }
    .ws-row.selected { background:var(--accent-light); border-radius:8px; }
    @media (max-width:980px) {
      .ws-board-hero, .ws-board-toolbar { grid-template-columns:1fr; }
      .ws-hero-actions, .ws-board-tools { justify-content:flex-start; }
      .ws-board-kpis, .ws-flow-steps { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .ws-row { grid-template-columns:auto auto minmax(180px,1fr) auto; }
      .ws-row-type, .ws-row-cat, .ws-price-wrap, .cart-item-remove { grid-column:auto; }
    }
    @media (max-width:640px) {
      .ws-board-kpis, .ws-flow-steps { grid-template-columns:1fr; }
      .ws-category-create { min-width:0; width:100%; }
      .ws-row { grid-template-columns:auto minmax(0,1fr); align-items:start; }
      .ws-row .ws-item-checkbox { margin-top:0.25rem; }
      .ws-row-index, .ws-row-type, .ws-row-qty, .ws-row-cat, .ws-price-wrap, .cart-item-remove { grid-column:2; justify-self:start; }
      .ws-row-name { grid-column:2; }
    }
    .ws-bulk-bar {
      display:flex; align-items:center; gap:0.55rem; flex-wrap:wrap; background:var(--accent-light); border:1px solid var(--border);
      border-radius:10px; padding:0.55rem 0.75rem; margin-bottom:0.7rem; font-size:0.78rem; font-weight:600; color:var(--text);
    }
    .ws-costing-bar {
      display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:0.75rem;
      border:1px solid var(--border); border-radius:10px; padding:0.75rem 0.85rem; margin-bottom:0.85rem;
      background:var(--surface-subtle);
    }
    .ws-costing-icon {
      width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center;
      background:var(--module-samples-tile-bg); color:var(--module-samples-tile-fg); flex-shrink:0;
    }
    .ws-costing-title { font-size:0.82rem; font-weight:700; color:var(--text); }
    .ws-costing-sub { margin-top:0.12rem; font-size:0.7rem; color:var(--text-3); line-height:1.35; }
    .ws-costing-actions { display:flex; align-items:center; gap:0.45rem; flex-wrap:wrap; justify-content:flex-end; }
    @media (max-width:720px) { .ws-costing-bar { grid-template-columns:auto minmax(0,1fr); } .ws-costing-actions { grid-column:1/-1; justify-content:flex-start; } }
    .ws-add-inline { display:flex; align-items:center; gap:0.5rem; border:1px solid var(--border); border-radius:10px; padding:0.55rem 0.65rem; background:var(--surface); }
    .ws-add-inline input { flex:1; border:none; background:none; font-family:inherit; font-size:0.85rem; color:var(--text); outline:none; }
    .ws-add-row { display:flex; align-items:center; gap:0.5rem; padding:0.45rem 0.3rem; border-radius:8px; cursor:pointer; font-size:0.8rem; }
    .ws-add-row:hover { background:var(--surface2); }

    /* Collection workspace â€” EstadÃ­sticas tab */
    .ws-view-tabs { max-width:360px; }
    .ws-stat-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:0.75rem; margin-bottom:1.35rem; }
    .ws-stat-tile { border:1px solid var(--border); border-radius:10px; padding:0.85rem 1rem; }
    .ws-stat-tile-val { font-size:1.5rem; font-weight:700; letter-spacing:-0.02em; color:var(--text); }
    .ws-stat-tile-lbl { font-size:0.65rem; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-3); margin-top:0.2rem; }
    .ws-stat-panels { display:grid; grid-template-columns:1fr 1fr; gap:1.25rem; }
    @media (max-width:720px) { .ws-stat-panels { grid-template-columns:1fr; } }
    .ws-stat-panel { border:1px solid var(--border); border-radius:10px; padding:1.1rem 1.2rem; }
    .ws-stat-panel-title { font-size:0.78rem; font-weight:700; color:var(--text); margin-bottom:0.9rem; }
    .ws-stat-chart-wrap { height:190px; position:relative; margin-bottom:0.9rem; }
    .ws-stat-legend { display:flex; flex-direction:column; gap:0.45rem; }
    .ws-stat-legend-row { display:flex; align-items:center; gap:0.5rem; font-size:0.78rem; color:var(--text-2); }
    .ws-stat-legend-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
    .ws-stat-legend-name { flex:1; }
    .ws-stat-legend-count { font-weight:700; color:var(--text); }
    .ws-stat-empty { font-size:0.8rem; color:var(--text-3); padding:1.5rem 0.5rem; text-align:center; }

    /* Price â€” one column, USD only (Sierra doesn't price in other
       currencies), click to edit MOQ/valid-until in a small popover. */
    .ws-price-wrap { position:relative; flex-shrink:0; }
    .ws-price-btn {
      background:none; border:1px solid transparent; border-radius:7px; padding:0.2rem 0.5rem; font-family:inherit;
      font-size:0.8rem; font-weight:700; color:var(--text); cursor:pointer;
      transition:border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
    }
    .ws-price-btn:hover { background:var(--surface2); border-color:var(--border); }
    .ws-price-empty { font-size:0.8rem; color:var(--text-3); padding:0.2rem 0.5rem; }
    .ws-price-pop { width:200px; padding:0.75rem; right:0; }
    .ws-price-pop label { display:block; font-size:0.66rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-3); margin:0.5rem 0 0.25rem; }
    .ws-price-pop label:first-child { margin-top:0; }
    .ws-price-pop input { width:100%; }

    /* Compact board header â€” name, badge, avatars, invite, copy link,
       overflow menu â€” one row instead of a card stack. */
    .ws-hdr { display:flex; align-items:flex-start; justify-content:space-between; gap:1rem; margin-bottom:1.1rem; flex-wrap:wrap; }
    .ws-hdr-name { flex:1; min-width:200px; }
    .ws-hdr-meta { display:flex; align-items:center; gap:0.6rem; font-size:0.7rem; color:var(--text-3); margin-top:0.15rem; text-transform:uppercase; letter-spacing:0.06em; font-weight:600; flex-wrap:wrap; }
    .ws-save-state { color:var(--text-3); text-transform:none; letter-spacing:0; font-weight:600; }
    .ws-save-state.saved { color:var(--success); }
    .ws-save-state.error { color:var(--danger); }
    .ws-deadline-wrap { display:inline-flex; align-items:center; gap:0.3rem; cursor:pointer; }
    .ws-deadline-wrap.set { color:var(--accent); }
    .ws-deadline-input {
      background:none; border:none; font-family:inherit; font-size:0.68rem; font-weight:600; letter-spacing:0.06em;
      text-transform:uppercase; color:inherit; padding:0; cursor:pointer; width:88px;
    }
    .ws-deadline-input:focus { outline:none; }
    /* Header action cluster â€” badge, people, ghost icon buttons, spaced
       into three legible groups instead of one dense row. Icon buttons
       carry no resting border/fill (a bordered circle per control reads
       as loose disconnected chrome); only the avatar ring keeps a
       visible edge, so each group reads as intentional rather than a
       checklist of separate buttons. See styleguide #sg-clusters. */
    .ws-hdr-actions { display:flex; align-items:center; gap:0.55rem; flex-shrink:0; padding-top:0.15rem; }
    .ws-people-cluster { display:flex; align-items:center; gap:0.4rem; }
    .ws-avatar-stack { display:flex; align-items:center; position:relative; }
    .ws-avatar {
      width:30px; height:30px; border-radius:var(--r-pill); background:var(--surface2); border:2px solid var(--surface);
      display:flex; align-items:center; justify-content:center; font-size:0.7rem; font-weight:700; color:var(--text-2);
      margin-left:-9px; flex-shrink:0; overflow:hidden;
    }
    .ws-avatar:first-child { margin-left:0; }
    .ws-avatar img { width:100%; height:100%; object-fit:cover; }
    .ws-invite-btn svg { flex-shrink:0; }
    .ws-icon-btn {
      width:34px; height:34px; border-radius:var(--r-pill); border:1px solid transparent; background:none; color:var(--text-3);
      display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
      transition:background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
    }
    .ws-icon-btn:hover { background:var(--surface2); color:var(--text); }
    .ws-icon-btn:active { background:var(--accent-light); color:var(--accent); }
    .ws-icon-badge {
      position:absolute; top:1px; right:1px; min-width:15px; height:15px;
      background:var(--accent); color:#fff; border:2px solid var(--surface); border-radius:8px;
      font-size:0.58rem; font-weight:700; display:flex; align-items:center; justify-content:center;
      padding:0 3px; font-variant-numeric:tabular-nums; line-height:1;
    }
    .ws-more-wrap { position:relative; }

    /* Manage-people modal (#m-ws-invite) â€” search results and the roster
       of people already in the collection share one row shape; the
       roster rows swap the hover/click affordance for a remove button. */
    .ws-invite-results { display:flex; flex-direction:column; gap:0.1rem; max-height:200px; overflow-y:auto; }
    .ws-invite-results:not(:empty) { margin-top:0.4rem; }
    .ws-invite-row {
      display:flex; align-items:center; gap:0.65rem; width:100%; text-align:left; background:none; border:none;
      font-family:inherit; padding:0.5rem 0.5rem; border-radius:9px;
    }
    button.ws-invite-row { cursor:pointer; }
    button.ws-invite-row:hover { background:var(--surface2); }
    .ws-invite-row .ws-avatar { width:32px; height:32px; margin-left:0; border-width:0; font-size:0.74rem; }
    .ws-invite-row-info { display:flex; flex-direction:column; min-width:0; gap:0.05rem; flex:1; }
    .ws-invite-row-name { font-size:0.83rem; font-weight:600; color:var(--text); white-space:normal; overflow-wrap:break-word; }
    .ws-invite-row-sub { font-size:0.7rem; color:var(--text-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .ws-invite-people-lbl { font-size:0.62rem; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-3); margin:1.1rem 0 0.5rem; }
    .ws-invite-people-list { display:flex; flex-direction:column; gap:0.1rem; }
    .ws-invite-remove {
      background:none; border:none; color:var(--text-3); cursor:pointer; font-size:0.8rem; line-height:1;
      width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;
      transition:background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
    }
    .ws-invite-remove:hover { background:rgba(192,57,43,0.1); color:var(--danger); }
    .ws-invite-row-form { flex-wrap:wrap; }
    .ws-invite-role-sel { flex-shrink:0; width:auto; }
    .ws-cap-checklist { padding:0.2rem 0.5rem 0.65rem 3.15rem; }
    .ws-cap-row { display:flex; align-items:center; gap:0.5rem; font-size:0.78rem; color:var(--text-2); padding:0.2rem 0; }
    .ws-cap-row input { accent-color:var(--accent); }

    /* Self-toggled flyout variant of the shared popover primitive (see
       "POPOVER / DROPDOWN MENU PRIMITIVE" above) â€” invite, "more" menu and
       price-editor popovers all use this. Item rows compose .pop-menu-item;
       .ws-menu-item is kept only as an alias for existing call sites. */
    .ws-pop {
      display:none; position:absolute; top:calc(100% + 8px); right:0; z-index:40; min-width:220px;
      background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow-hover);
      padding:0.3rem; animation:wsPopIn var(--dur-fast) var(--ease-out);
    }
    .ws-pop.open { display:block; }
    @keyframes wsPopIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }
    .ws-pop-hint { font-size:0.74rem; color:var(--text-3); margin:0.1rem 0.3rem 0.5rem; }

    .pick-col-row {
      display:flex; align-items:center; gap:0.6rem; width:100%; text-align:left; font-family:inherit;
      border:1px solid var(--border); border-radius:10px; padding:0.65rem 0.8rem; margin-bottom:0.5rem;
      background:var(--surface); cursor:pointer; color:var(--text);
      transition:border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
    }

    .emp-md-layout {

    /* â”€â”€ Organigrama canvas â”€â”€ a real whiteboard/infinite-canvas workspace
       (Â§1-Â§3), not a card inside the page: workspace height is derived
       from the viewport minus the (now compact) chrome above it, so the
       chart is the visual protagonist. overflow:auto gives native
       wheel/trackpad/scrollbar panning for free; orgCanvasPointerDown()
       layers click-drag-anywhere panning on top of that. display:grid +
       place-items:center is the standard trick for keeping an overflow:
       auto child centered when it's smaller than the container while
       still allowing free scroll once it's bigger â€” combined with the
       generous fixed padding baked into orgComputeChartLayout(), the
       hierarchy can never end up stuck against an edge. */
    .orgc-viewport {
      position:relative; overflow:auto; display:grid; place-items:safe center;
      border:1px solid var(--border); border-radius:var(--panel-radius);
      background-color:var(--surface2);
      background-image:radial-gradient(circle, var(--orgc-dot, color-mix(in srgb, var(--text-3) 30%, transparent)) 1px, transparent 1px);
      background-size:24px 24px;
      height:calc(100vh - var(--org-chrome-h, 178px)); min-height:420px; cursor:grab;
    }
    .orgc-viewport.orgc-panning { cursor:grabbing; user-select:none; }
    /* The sizer carries the *scaled* (zoom-multiplied) pixel dimensions so
       the viewport's native scrollable area actually grows with zoom â€”
       transform:scale() alone never changes a scrolling ancestor's
       scrollWidth/Height, since transforms are paint-only, not layout. */
    .orgc-canvas-sizer { position:relative; }
    .orgc-canvas { position:absolute; top:0; left:0; transform-origin:0 0; }
    .orgc-connectors { position:absolute; top:0; left:0; overflow:visible; pointer-events:none; }
    .orgc-conn { fill:none; stroke:var(--border-strong,var(--border)); stroke-width:1.5; }
    /* Floating controls are truly attached to the viewport, not the
       transformed/scrolled canvas content (Â§4) â€” position:sticky inside
       the scroll container pins them to a viewport corner regardless of
       zoom, pan position or hierarchy size, without needing JS to track
       scroll offsets. Kept deliberately small/light, not an oversized
       pill (Â§4). */
    .orgc-floating-controls {
      position:sticky; bottom:0.6rem; left:100%; transform:translateX(-100%);
      display:flex; align-items:center; gap:0.15rem; width:fit-content; margin-right:0.6rem;

    .orgc-card {
      position:absolute; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--border); border-radius:14px;

    .orgc-card.is-focused { background:color-mix(in srgb, var(--teal) 8%, var(--surface)); }
    .orgc-card.has-issue { border-color:var(--warning-border); }

    /* A manager's card gets the barest signal (a slightly heavier left
       edge) â€” hierarchy is read from layout + connectors, never a loud
       colored border on every card (Â§7, Â§27). The root/head-of-branch
       card gets very slightly more visual weight (elevation + a hair
       thicker border) so the top of the chart reads at a glance without
       any color. */
    .orgc-card.is-manager { border-left:3px solid var(--teal); }
    .orgc-card.is-root { box-shadow:0 3px 10px rgba(0,0,0,0.08); border-color:var(--border-strong,var(--border)); }

    .orgc-card.is-muted:hover { border-color:var(--border); box-shadow:none; transform:none; }
    /* "Ver cadena de mando" (Â§14) â€” a thin teal ring on the branch that
       matters, not a filled block; everything else recedes. */
    .orgc-card.orgc-chain-dim { opacity:0.25; }
    .orgc-card.orgc-chain-member { box-shadow:0 0 0 1.5px var(--teal); }
    @keyframes orgcHighlightPulse { 0%,100% { box-shadow:0 0 0 2px color-mix(in srgb, var(--teal) 45%, transparent); } 50% { box-shadow:0 0 0 6px color-mix(in srgb, var(--teal) 22%, transparent); } }
    .orgc-card.orgc-highlight { animation:orgcHighlightPulse 0.9s ease-in-out 2; }
    /* Drag-to-reassign (Gestionar estructura only) â€” grabbing a card and
       dropping it on another opens the same confirm drawer as the manual
       flow (orgOpenAssignManager), just pre-filled with the drop target.
       Dragging never writes to the DB by itself; it's a faster on-ramp
       into the existing, validated confirm step (cycle checks, cross-
       site/company confirmation) â€” identical safety either way. */
    .orgc-card[draggable="true"] { cursor:grab; }
    .orgc-card.org-dragging { opacity:0.35; cursor:grabbing; }
    .orgc-card.org-drop-valid { outline:2px dashed var(--teal); outline-offset:3px; background:color-mix(in srgb, var(--teal) 10%, var(--surface)); transform:scale(1.03); z-index:2; }
    .orgc-card.org-drop-invalid { outline:2px dashed var(--danger); outline-offset:3px; cursor:not-allowed; }
    .orgc-grip { position:absolute; top:6px; left:6px; display:flex; align-items:center; justify-content:center; color:var(--text-3); opacity:0; transition:opacity .12s; cursor:grab; touch-action:none; z-index:2; }
    .orgc-card:hover .orgc-grip, .orgc-card:focus-visible .orgc-grip { opacity:0.55; }
    .orgc-grip:hover { opacity:1 !important; color:var(--text-secondary); }
    /* Rounded-square (not circular) 1:1 portrait â€” SIERRA rarely uses
       circular imagery (Â§6). object-fit:cover crops instead of stretching
       so a non-square source photo is never distorted. */
    .orgc-avatar { width:56px; height:56px; min-width:56px; border-radius:12px; overflow:hidden; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:1.05rem; font-weight:700; color:var(--text-secondary); }
    .orgc-avatar img { width:100%; height:100%; object-fit:cover; }
    .orgc-main { min-width:0; flex:1; padding-top:1px; }
    /* Names and positions must NEVER truncate with an ellipsis (Â§2/Â§15,
       critical acceptance criteria) â€” cards wrap instead, and the layout
       engine (orgCardHeightFor) grows each card's height to match. */
    .orgc-name { font-size:0.95rem; line-height:1.25; font-weight:700; color:var(--text-primary); white-space:normal; overflow-wrap:break-word; }
    .orgc-title { font-size:0.82rem; line-height:1.3; color:var(--text-secondary); white-space:normal; overflow-wrap:break-word; margin-top:2px; }
    /* Company is mandatory on every node (Â§23) â€” its own line, bolder than
       department, and never replaced by a cross-company assignment: it
       always reflects the employee's one official employing company. */
    .orgc-company { font-size:0.73rem; line-height:1.3; color:var(--text-secondary); font-weight:600; white-space:normal; overflow-wrap:break-word; margin-top:5px; display:flex; align-items:flex-start; gap:4px; }
    .orgc-company svg { flex-shrink:0; margin-top:2px; opacity:0.7; }
    .orgc-company.is-missing { color:var(--warning-text); font-style:italic; }
    .orgc-dept { font-size:0.72rem; line-height:1.3; color:var(--text-3); white-space:normal; overflow-wrap:break-word; margin-top:2px; }
    .orgc-warn { position:absolute; top:8px; right:8px; color:var(--warning-text); display:flex; z-index:2; }
    .orgc-card.has-blocking-issue .orgc-warn { color:var(--danger); }
    /* The whole card already opens the profile on click (Â§8) â€” this is a
       secondary, more explicit affordance that fades in on hover so
       nobody has to hunt for a tiny icon. It sits over the card top so it
       never fights the in-flow "N reportes directos" control below. */
    .orgc-open-hint {
      position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:flex-end; padding:0.4rem 0.6rem;
      background:linear-gradient(180deg, transparent 55%, color-mix(in srgb, var(--surface) 92%, transparent) 100%);

    /* Direct-report control (Â§9) â€” an intentional, readable, in-flow row

    .orgc-reports-row {

      background:var(--surface2); color:var(--text-secondary); font-size:0.74rem; font-weight:600; cursor:pointer; padding:0.4rem 0.5rem; min-height:32px;
    }

    .org-selected-panel { display:flex; align-items:center; justify-content:space-between; gap:0.8rem; flex-wrap:wrap; margin-top:0.8rem; padding:0.6rem 0.8rem; border:1px solid var(--border); border-radius:10px; background:var(--surface2); font-size:0.82rem; }
    .org-selected-actions { display:flex; gap:0.4rem; flex-wrap:wrap; }

    .org-candidate-list { max-height:220px; overflow:auto; border:1px solid var(--border); border-radius:8px; margin-bottom:1.1rem; }
    .org-candidate-row { display:flex; align-items:center; justify-content:space-between; gap:0.5rem; width:100%; text-align:left; padding:0.5rem 0.7rem; background:none; border:none; border-bottom:1px solid var(--border); cursor:pointer; min-height:44px; }
    .org-candidate-row:last-child { border-bottom:none; }

    .org-candidate-picked { display:flex; align-items:center; gap:0.6rem; padding:0.5rem 0.6rem; border:1px solid var(--teal); background:color-mix(in srgb, var(--teal) 6%, var(--surface)); border-radius:8px; margin-bottom:1.1rem; }
    .org-impact-preview { margin-top:0.3rem; margin-bottom:1.1rem; padding:0.7rem 0.8rem; border:1px solid var(--border); border-radius:10px; background:var(--surface2); }
    .org-impact-row { display:flex; justify-content:space-between; gap:0.6rem; font-size:0.8rem; padding:0.2rem 0; }
    .org-confirm-cross { display:flex; align-items:flex-start; gap:6px; font-size:0.78rem; margin-top:0.6rem; color:var(--warning-text); cursor:pointer; }
    /* Current-manager row and the search-empty hint reuse the same
       avatar-row shape as the picked-candidate block so "who's the boss
       now" and "who's the boss next" read as the same kind of fact,
       instead of one being a plain text line and the other a card. */
    .org-current-mgr-row { display:flex; align-items:center; gap:0.6rem; padding:0.5rem 0.6rem; border:1px solid var(--border); border-radius:8px; margin-bottom:1.3rem; background:var(--surface2); }
    .org-current-mgr-empty { display:flex; align-items:center; gap:0.5rem; padding:0.55rem 0.6rem; border:1px dashed var(--border); border-radius:8px; margin-bottom:1.3rem; color:var(--text-3); font-size:0.82rem; }
    .org-search-wrap { position:relative; margin-bottom:0.4rem; }
    .org-search-wrap .org-search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text-3); display:flex; pointer-events:none; }
    .org-search-hint { font-size:0.78rem; color:var(--text-3); margin:0.4rem 2px 1.1rem; }
    /* Actions pinned to the drawer's real bottom edge (not right after the

    .drawer-footer { flex-shrink:0; display:flex; gap:0.6rem; padding:0.85rem 1.2rem; border-top:1px solid var(--border); background:var(--surface); }

    /* Badges in table â€” StatusBadge family (Â§41). Employee status (Active/
       Inactive/â€¦) and badge lifecycle status (Draft/Printed/â€¦) each get
       their own semantic tint, but share the single .badge/.status-badge
       anatomy defined near the top of the stylesheet. No text-transform:
       "Active" reads better than "ACTIVE" at this size (Â§41 typography). */
    .badge-active { background: var(--success-bg); color: var(--success); }
    .badge-inactive { background: var(--surface2); color: var(--text-3); }
    .badge-terminated { background: var(--danger-bg); color: var(--danger); }
    .badge-on_leave { background: var(--warning-bg); color: var(--warning-text); }

       Status: a clickable control (opens the missing-fields popover), so it
       carries a trailing chevron and hover/focus states, not a static tint. */
    .badge-ready-yes { background: var(--success-bg); color: var(--success); }

    /* Employee Detail Drawer â€” photo carries identity here (Â§ "mÃ¡s
       protagonismo"): a large square portrait, not a small chip, echoing
       the emphasis a business card or a Contacts app gives a person's

       (520â€“680px) to keep the employee list behind it legible, never the
       old fixed 680px that ate most of a laptop viewport. */
    .emp-detail-drawer.drawer { width: clamp(520px, 38vw, 680px); max-width: 92vw; z-index: 399; }
    @media (max-width: 900px) { .emp-detail-drawer.drawer { width: 82vw; } }
    @media (max-width: 640px) { .emp-detail-drawer.drawer { width: 100vw; max-width: 100vw; } }
    /* The base .drawer class (z-index:200, above) renders BELOW
       .drawer-backdrop (z-index:398) â€” every dynamically-created drawer
       that doesn't set its own override (like .emp-detail-drawer/
       .org-export-drawer/.org-assign-drawer already do above) ends up
       visible-but-unclickable behind its own backdrop: you can see the
       form through the blur, but every click lands on the backdrop
       instead, and closes it. #hire-wizard/#term-modal (Altas/Bajas) and
       #org-info-modal (the "Ver equipo"/"Dar de baja aâ€¦" picker, and the

       bug. 401 matches .org-assign-drawer so these also stack correctly
       above an already-open employee detail drawer (399) when opened
       from its overflow menu. */
    #hire-wizard.drawer, #term-modal.drawer, #org-info-modal.drawer,
    #vac-request-modal.drawer, #vac-balance-modal.drawer { z-index: 401; }

       triggered from the profile's "Estructura organizacional" section, so
       it needs to outrank it â€” otherwise it renders hidden behind it. */
    .org-assign-drawer.drawer { z-index: 401; }
    /* The drawer is intentionally narrow (520â€“680px), so the header actions

    .emp-detail-hdr { flex-wrap: wrap; }
    .emp-detail-hdr-actions { flex-basis: 100%; justify-content: flex-end; order: 3; margin-top: 10px; }
    .emp-detail-hdr { display: flex; align-items: flex-start; gap: 16px; padding: 1.1rem 1.25rem; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .emp-detail-hdr-photo { position: relative; flex-shrink: 0; cursor: pointer; display: block; }
    .emp-detail-hdr-photo img, .emp-detail-hdr-photo .emp-avatar-init { width: 68px; height: 68px; border-radius: 16px; object-fit: cover; box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 4px 14px rgba(0,0,0,0.08); }
    .emp-detail-hdr-photo .emp-avatar-init { display: flex; align-items: center; justify-content: center; background: var(--surface2); font-size: 1.3rem; font-weight: 700; color: var(--text-secondary); }

    /* Hierarchy below the name: codeÂ·status on one line, then site/dept,
       then position â€” never more than one colored chip per line, joined

    .emp-detail-hdr-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 0.78rem; color: var(--text-3); margin-bottom: 3px; }

    .emp-detail-edit-footer {

    /* â”€â”€ Employee Full Profile (Â§1) â€” a large centered workspace modal,
       not a drawer. Backdrop reuses .drawer-backdrop's fade mechanic;
       .emp-profile-overlay adds centering on top of it. */
    .emp-profile-overlay.drawer-backdrop { display: flex; align-items: center; justify-content: center; padding: 28px; }
