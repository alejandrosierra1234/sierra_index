<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sierra Index</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ── TOKENS ── */
    :root {
      --accent: #16cdbe;
      --accent-dark: #0fa89c;
      --accent-light: rgba(22,205,190,0.10);
      --bg: #f5f5f7;
      --bg-alt: #ffffff;
      --surface: #ffffff;
      --surface2: #f5f5f7;
      --border: #e0e0e5;
      --text: #1d1d1f;
      --text-2: #6e6e73;
      --text-3: #aeaeb2;
      --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 4px 16px rgba(0,0,0,0.04);
      --shadow-hover: 0 2px 8px rgba(0,0,0,0.09), 0 8px 32px rgba(0,0,0,0.07);
    }
    [data-theme="dark"] {
      --bg: #0b0b0b; --bg-alt: #111111; --surface: #1a1a1a; --surface2: #222222;
      --border: #2b2b2b; --text: #f5f5f7; --text-2: #a1a1a6; --text-3: #636366;
      --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 4px 16px rgba(0,0,0,0.3);
      --shadow-hover: 0 2px 8px rgba(0,0,0,0.5), 0 8px 32px rgba(0,0,0,0.4);
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; overflow: hidden;
      -webkit-font-smoothing: antialiased;
      transition: background 0.25s, color 0.25s;
    }

    /* ── AUTH ── */
    #auth-screen {
      display:flex; align-items:center; justify-content:center;
      height:100vh; background:var(--bg);
    }
    .auth-box { width:360px; }
    .auth-wordmark { text-align:center; margin-bottom:2rem; }
    .auth-wordmark .wm { font-size:1rem; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; }
    .auth-wordmark .sub { font-size:0.78rem; color:var(--text-2); margin-top:0.3rem; }
    .auth-card { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:2rem; box-shadow:var(--shadow); }
    .auth-card h2 { font-size:1.05rem; font-weight:600; margin-bottom:1.25rem; }
    .auth-err { background:rgba(220,53,69,0.08); border:1px solid rgba(220,53,69,0.2); border-radius:8px; padding:0.55rem 0.9rem; font-size:0.8rem; color:#c0392b; margin-bottom:1rem; display:none; }
    [data-theme="dark"] .auth-err { color:#fca5a5; background:rgba(239,68,68,0.1); border-color:rgba(239,68,68,0.2); }

    /* ── FORMS ── */
    .fg { margin-bottom:0.9rem; }
    .fg label { display:block; font-size:0.68rem; font-weight:600; text-transform:uppercase; letter-spacing:0.07em; color:var(--text-3); margin-bottom:0.4rem; }
    .fg input, .fg select, .fg textarea {
      width:100%; background:var(--surface2); border:1px solid var(--border);
      border-radius:9px; padding:0.65rem 0.85rem; color:var(--text);
      font-size:0.88rem; font-family:inherit; outline:none;
      transition:border-color 0.15s, box-shadow 0.15s;
    }
    .fg input:focus, .fg select:focus, .fg textarea:focus {
      border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-light);
    }
    .fg textarea { resize:vertical; min-height:72px; }
    .fg select { appearance:none; cursor:pointer; }

    /* ── BUTTONS ── */
    .btn {
      display:inline-flex; align-items:center; justify-content:center; gap:0.35rem;
      padding:0.68rem 1.2rem; border-radius:9px; border:none;
      font-size:0.85rem; font-weight:500; font-family:inherit;
      cursor:pointer; transition:all 0.15s; white-space:nowrap;
      -webkit-font-smoothing:antialiased;
    }
    .btn-full { width:100%; }
    .btn-primary { background:var(--accent); color:#fff; }
    .btn-primary:hover { background:var(--accent-dark); }
    .btn-primary:active { transform:scale(0.98); }
    .btn-ghost { background:transparent; color:var(--text-2); border:1px solid var(--border); }
    .btn-ghost:hover { background:var(--surface2); color:var(--text); }
    .btn-sm { padding:0.42rem 0.85rem; font-size:0.78rem; border-radius:7px; }
    .btn-icon { background:none; border:none; cursor:pointer; color:var(--text-2); padding:0.35rem; border-radius:7px; display:flex; align-items:center; transition:all 0.15s; }
    .btn-icon:hover { background:var(--surface2); color:var(--text); }

    /* ── TOPBAR ── */
    #app { display:none; height:100vh; flex-direction:column; }
    .topbar {
      height:52px; background:var(--bg-alt); border-bottom:1px solid var(--border);
      padding:0 1.25rem; display:flex; align-items:center; justify-content:space-between;
      flex-shrink:0;
    }
    .topbar-l { display:flex; align-items:center; gap:0.85rem; }
    .wm-top { font-size:0.88rem; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; }
    .sep { width:1px; height:15px; background:var(--border); }
    .section-label { font-size:0.8rem; color:var(--text-2); }
    .topbar-r { display:flex; align-items:center; gap:0.5rem; }
    .theme-btn { width:30px; height:30px; border-radius:7px; background:none; border:1px solid var(--border); cursor:pointer; color:var(--text-2); display:flex; align-items:center; justify-content:center; font-size:0.85rem; transition:all 0.15s; }
    .theme-btn:hover { background:var(--surface2); color:var(--text); }
    .user-pill { display:flex; align-items:center; gap:0.45rem; background:var(--surface2); border:1px solid var(--border); border-radius:20px; padding:0.22rem 0.7rem 0.22rem 0.3rem; }
    .u-avatar { width:20px; height:20px; border-radius:50%; background:var(--accent); color:#fff; font-size:0.62rem; font-weight:700; display:flex; align-items:center; justify-content:center; }
    .u-name { font-size:0.78rem; font-weight:500; }
    .u-role { font-size:0.68rem; color:var(--text-3); }
    .u-dot { width:5px; height:5px; border-radius:50%; background:var(--accent); }
    .logout-btn { font-size:0.75rem; color:var(--text-3); background:none; border:none; cursor:pointer; padding:0.3rem 0.45rem; border-radius:6px; font-family:inherit; transition:color 0.15s; }
    .logout-btn:hover { color:var(--text); }

    /* ── LAYOUT ── */
    .main { display:flex; flex:1; overflow:hidden; }
    .sidebar { width:184px; background:var(--bg-alt); border-right:1px solid var(--border); padding:0.85rem 0.65rem; display:flex; flex-direction:column; gap:1px; flex-shrink:0; overflow-y:auto; }
    .s-label { font-size:0.62rem; font-weight:600; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-3); padding:0.7rem 0.55rem 0.3rem; }
    .nav-item { display:flex; align-items:center; gap:0.55rem; padding:0.48rem 0.55rem; border-radius:7px; cursor:pointer; font-size:0.82rem; color:var(--text-2); transition:all 0.12s; border:none; background:none; width:100%; text-align:left; font-family:inherit; }
    .nav-item:hover { background:var(--surface2); color:var(--text); }
    .nav-item.active { background:var(--accent-light); color:var(--accent); font-weight:600; }
    .n-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }

    /* ── CONTENT ── */
    .content { flex:1; overflow-y:auto; padding:1.75rem 1.75rem; background:var(--bg); }
    .content-hdr { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:1.5rem; }
    .content-hdr h2 { font-size:1.35rem; font-weight:600; letter-spacing:-0.02em; }
    .content-hdr p { font-size:0.8rem; color:var(--text-2); margin-top:0.2rem; }

    /* ── PRODUCT GRID ── */
    .pg { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:1rem; }

    .card { background:var(--surface); border:1px solid var(--border); border-radius:13px; overflow:hidden; cursor:pointer; transition:box-shadow 0.2s, transform 0.2s, border-color 0.2s; }
    .card:hover { box-shadow:var(--shadow-hover); transform:translateY(-2px); border-color:transparent; }

    .card-img { width:100%; height:140px; object-fit:cover; background:var(--surface2); display:flex; align-items:center; justify-content:center; }
    .card-img img { width:100%; height:100%; object-fit:cover; }
    .card-img-placeholder { width:100%; height:140px; display:flex; align-items:center; justify-content:center; }
    .card-body { padding:1rem 1rem 0.85rem; }
    .card-div { font-size:0.62rem; font-weight:700; text-transform:uppercase; letter-spacing:0.12em; margin-bottom:0.45rem; }
    .card-name { font-size:0.92rem; font-weight:600; color:var(--text); margin-bottom:0.3rem; letter-spacing:-0.01em; }
    .card-lot { font-size:0.75rem; color:var(--text-3); margin-bottom:0.6rem; }
    .card-desc { font-size:0.76rem; color:var(--text-2); line-height:1.5; margin-bottom:0.75rem; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .tags { display:flex; flex-wrap:wrap; gap:0.28rem; margin-bottom:0.85rem; }
    .tag { font-size:0.66rem; padding:0.16rem 0.5rem; border-radius:20px; background:var(--surface2); color:var(--text-2); border:1px solid var(--border); }
    .card-actions { display:flex; gap:0.45rem; }

    /* ── MODAL ── */
    .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.3); z-index:200; align-items:center; justify-content:center; backdrop-filter:blur(6px); }
    .overlay.open { display:flex; }
    .modal { background:var(--surface); border:1px solid var(--border); border-radius:18px; width:560px; max-width:95vw; max-height:90vh; overflow-y:auto; box-shadow:0 24px 80px rgba(0,0,0,0.2); }
    .modal-hdr { padding:1.4rem 1.4rem 0; display:flex; align-items:flex-start; justify-content:space-between; }
    .modal-eyebrow { font-size:0.62rem; font-weight:700; text-transform:uppercase; letter-spacing:0.12em; margin-bottom:0.3rem; }
    .modal-title { font-size:1.05rem; font-weight:600; letter-spacing:-0.01em; }
    .modal-body { padding:1.1rem 1.4rem; }
    .modal-ftr { padding:0 1.4rem 1.4rem; display:flex; gap:0.55rem; justify-content:flex-end; }

    /* ── FICHA LAYOUT ── */
    .ficha-img { width:100%; height:200px; object-fit:cover; border-radius:10px; margin-bottom:1rem; background:var(--surface2); display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .ficha-img img { width:100%; height:100%; object-fit:cover; }
    .ficha-sec { margin-bottom:1.1rem; }
    .ficha-lbl { font-size:0.62rem; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-3); margin-bottom:0.55rem; }
    .spec-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.45rem; }
    .spec-item { background:var(--surface2); border-radius:9px; padding:0.6rem 0.8rem; }
    .spec-k { font-size:0.65rem; color:var(--text-3); margin-bottom:0.18rem; text-transform:uppercase; letter-spacing:0.04em; }
    .spec-v { font-size:0.86rem; font-weight:500; }

    /* ── YARNS ── */
    .yarn-row { display:flex; gap:0.75rem; align-items:baseline; padding:0.5rem 0; border-bottom:1px solid var(--border); }
    .yarn-row:last-child { border-bottom:none; }
    .yarn-lbl { font-size:0.65rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-3); min-width:60px; }
    .yarn-val { font-size:0.86rem; color:var(--text); }

    /* ── TABLE ── */
    .data-table { width:100%; border-collapse:collapse; font-size:0.8rem; }
    .data-table th { text-align:left; padding:0.45rem 0.9rem; font-size:0.62rem; font-weight:600; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-3); border-bottom:1px solid var(--border); }
    .data-table td { padding:0.8rem 0.9rem; border-bottom:1px solid var(--border); vertical-align:middle; }
    .data-table tr:last-child td { border-bottom:none; }
    .badge { display:inline-block; font-size:0.66rem; font-weight:600; padding:0.16rem 0.55rem; border-radius:20px; }
    .badge-pending { background:rgba(255,197,41,0.15); color:#997a00; }
    .badge-approved { background:rgba(22,205,190,0.12); color:var(--accent-dark); }
    .badge-shipped { background:rgba(0,159,255,0.12); color:#0070c9; }
    .badge-rejected { background:rgba(232,0,0,0.1); color:#c0392b; }
    [data-theme="dark"] .badge-pending { color:#ffc529; }
    [data-theme="dark"] .badge-approved { color:var(--accent); }
    [data-theme="dark"] .badge-shipped { color:#60a5fa; }
    [data-theme="dark"] .badge-rejected { color:#f87171; }

    /* ── ADD FORM ── */
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:0.85rem; }
    .two-col .full { grid-column:1/-1; }
    hr.div { border:none; border-top:1px solid var(--border); margin:1rem 0; }

    /* ── IMG UPLOAD ── */
    .img-upload-area {
      border:2px dashed var(--border); border-radius:10px; padding:1.5rem; text-align:center;
      cursor:pointer; transition:border-color 0.15s; position:relative; overflow:hidden;
    }
    .img-upload-area:hover { border-color:var(--accent); }
    .img-upload-area input[type=file] { position:absolute; inset:0; opacity:0; cursor:pointer; }
    .img-upload-area .up-icon { font-size:1.4rem; margin-bottom:0.4rem; color:var(--text-3); }
    .img-upload-area p { font-size:0.78rem; color:var(--text-2); }
    .img-preview { width:100%; height:120px; object-fit:cover; border-radius:8px; margin-top:0.75rem; display:none; }

    /* ── EMPTY ── */
    .empty { text-align:center; padding:4rem 1rem; color:var(--text-3); }
    .empty-icon { font-size:1.8rem; margin-bottom:0.6rem; opacity:0.4; }
    .empty p { font-size:0.82rem; }

    /* ── TOAST ── */
    #toast { position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%) translateY(80px); background:var(--text); color:var(--bg); border-radius:24px; padding:0.6rem 1.2rem; font-size:0.8rem; font-weight:500; z-index:999; opacity:0; transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1); white-space:nowrap; }
    #toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
    .spinner { width:13px; height:13px; border:2px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.6s linear infinite; display:inline-block; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ══════════════════════════════════════
       LABEL — print target
    ══════════════════════════════════════ */
    #label-preview {
      font-family: Arial, Helvetica, sans-serif;
      color: #000;
      background: #fff;
      padding: 6mm;
      width: 62mm;
      box-sizing: border-box;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
    }

    .lbl-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:3mm; }
    .lbl-brand { font-size:16pt; font-weight:900; letter-spacing:-0.02em; line-height:1; }
    .lbl-brand span { font-size:7pt; vertical-align:super; font-weight:400; }
    .lbl-mfg { font-size:5.5pt; font-weight:700; text-align:right; line-height:1.4; text-transform:uppercase; }

    .lbl-meta { display:flex; gap:6mm; margin-bottom:2mm; }
    .lbl-meta-block { }
    .lbl-meta-block .mk { font-size:5.5pt; font-weight:700; text-transform:uppercase; color:#000; }
    .lbl-meta-block .mv { font-size:8pt; font-weight:700; }

    .lbl-rule { border:none; border-top:2.5px solid #000; margin:2.5mm 0; }
    .lbl-rule-thin { border:none; border-top:0.75px solid #ccc; margin:2mm 0; }

    .lbl-name { font-size:13pt; font-weight:900; text-transform:uppercase; letter-spacing:-0.01em; line-height:1.1; margin:1.5mm 0; }

    .lbl-field { margin-bottom:1.5mm; }
    .lbl-field .fk { font-size:5.5pt; font-weight:700; text-transform:uppercase; color:#000; }
    .lbl-field .fv { font-size:8pt; font-weight:700; line-height:1.3; }

    .lbl-grid { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:2mm; margin:2mm 0; }
    .lbl-grid-item .gk { font-size:5.5pt; font-weight:700; text-transform:uppercase; }
    .lbl-grid-item .gv { font-size:9pt; font-weight:900; }

    .lbl-yarn-row { display:flex; gap:3mm; padding:1.5mm 0; border-bottom:0.5px solid #ccc; }
    .lbl-yarn-row:last-child { border-bottom:none; }
    .lbl-yarn-lbl { font-size:5.5pt; font-weight:700; text-transform:uppercase; min-width:14mm; }
    .lbl-yarn-val { font-size:7pt; font-weight:700; line-height:1.3; }

    .lbl-comments .ck { font-size:5.5pt; font-weight:700; text-transform:uppercase; margin-bottom:0.5mm; }
    .lbl-comments .cv { font-size:7pt; font-weight:700; }

    /* ── LABEL MODAL WRAPPER ── */
    .label-modal-body { display:flex; flex-direction:column; align-items:center; gap:1rem; }
    .label-modal-actions { display:flex; gap:0.6rem; }

    /* ════════════════════════════
       PRINT STYLES — QL-800 62mm
    ════════════════════════════ */
    @media print {
      * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      body > * { display:none !important; }
      #print-root { display:block !important; }
      @page { size:62mm auto; margin:0; }
      #print-root { padding:4mm; font-family:Arial,Helvetica,sans-serif; }
    }

    #print-root { display:none; }
  </style>
</head>
<body>

<!-- ══ AUTH ══ -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-wordmark">
      <div class="wm">Sierra</div>
      <div class="sub">Product Index</div>
    </div>
    <div class="auth-card">
      <h2>Sign in</h2>
      <div class="auth-err" id="auth-err"></div>
      <div class="fg"><label>Email</label><input type="email" id="l-email" placeholder="user@sierratextiles.com" autocomplete="email" /></div>
      <div class="fg"><label>Password</label><input type="password" id="l-pass" placeholder="••••••••" autocomplete="current-password" /></div>
      <button class="btn btn-primary btn-full" id="l-btn" onclick="login()">Sign in</button>
    </div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app">
  <div class="topbar">
    <div class="topbar-l">
      <span class="wm-top">Sierra</span>
      <div class="sep"></div>
      <span class="section-label" id="tb-section">Product Index</span>
    </div>
    <div class="topbar-r">
      <button class="theme-btn" onclick="toggleTheme()" id="theme-btn">☾</button>
      <div class="user-pill">
        <div class="u-avatar" id="u-av">–</div>
        <span class="u-name" id="u-nm">–</span>
        <div class="u-dot" id="u-dot"></div>
        <span class="u-role" id="u-role">–</span>
      </div>
      <button class="logout-btn" onclick="logout()">Sign out</button>
    </div>
  </div>

  <div class="main">
    <div class="sidebar">
      <span class="s-label">Divisions</span>
      <button class="nav-item active" onclick="setDiv('all',this)"><span class="n-dot" style="background:var(--text-3)"></span>All products</button>
      <button class="nav-item" onclick="setDiv('fiber',this)"><span class="n-dot" style="background:#9e00cb"></span>Fiber</button>
      <button class="nav-item" onclick="setDiv('yarn',this)"><span class="n-dot" style="background:#3ed600"></span>Yarn</button>
      <button class="nav-item" onclick="setDiv('fabric',this)"><span class="n-dot" style="background:#009fff"></span>Fabric</button>
      <button class="nav-item" onclick="setDiv('chemicals',this)"><span class="n-dot" style="background:#ff7824"></span>Chemicals</button>
      <button class="nav-item" onclick="setDiv('garment',this)"><span class="n-dot" style="background:#16cdbe"></span>Garment</button>
      <span class="s-label" style="margin-top:0.5rem">My activity</span>
      <button class="nav-item" id="nav-req" onclick="showRequests()"><span class="n-dot" style="background:#ffc529"></span>My requests</button>
    </div>

    <div class="content" id="content">
      <div class="content-hdr">
        <div>
          <h2 id="sec-title">All products</h2>
          <p id="sec-sub">Browse technical sheets and request samples</p>
        </div>
        <button class="btn btn-primary btn-sm" id="add-btn" onclick="openAdd()" style="display:none">+ New product</button>
      </div>
      <div class="pg" id="pg"></div>
    </div>
  </div>
</div>

<!-- ══ MODAL: FICHA ══ -->
<div class="overlay" id="m-ficha">
  <div class="modal">
    <div class="modal-hdr">
      <div>
        <div class="modal-eyebrow" id="f-eyebrow"></div>
        <div class="modal-title" id="f-name"></div>
      </div>
      <button class="btn-icon" onclick="close('m-ficha')">✕</button>
    </div>
    <div class="modal-body" id="ficha-body"></div>
    <div class="modal-ftr">
      <button class="btn btn-ghost btn-sm" onclick="close('m-ficha')">Close</button>
      <button class="btn btn-ghost btn-sm" onclick="openLabel()">View label</button>
      <button class="btn btn-primary btn-sm" onclick="openReq()">Request sample</button>
    </div>
  </div>
</div>

<!-- ══ MODAL: LABEL ══ -->
<div class="overlay" id="m-label">
  <div class="modal" style="width:auto;min-width:320px;max-width:95vw">
    <div class="modal-hdr">
      <div>

<div id="print-root"></div>

<!-- TOAST -->
<div id="toast"></div>

<script>
const SB_URL = 'https://vhyddogeemohtqijohry.supabase.co'
const SB_KEY = 'sb_publishable_9g8UJRbV3NxOlmQgPxjDqg_Xw6hFB0f'
const sb = supabase.createClient(SB_URL, SB_KEY)

const DIV_CLR = { fiber:'#9e00cb', yarn:'#3ed600', fabric:'#009fff', chemicals:'#ff7824', garment:'#16cdbe' }
const DIV_LBL = { fiber:'Fiber', yarn:'Yarn', fabric:'Fabric', chemicals:'Chemicals', garment:'Garment' }

let me = null, profile = null, division = 'all', selected = null

/* ── THEME ── */
const initTheme = localStorage.getItem('sierra-theme') || 'light'
document.documentElement.setAttribute('data-theme', initTheme)
setThemeIcon(initTheme)

function toggleTheme() {
  const t = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light'
  document.documentElement.setAttribute('data-theme', t)
  localStorage.setItem('sierra-theme', t)
  setThemeIcon(t)
}
function setThemeIcon(t) {
  const b = document.getElementById('theme-btn')
  if (b) b.textContent = t === 'light' ? '☾' : '☀'
}

/* ── INIT ── */
window.addEventListener('DOMContentLoaded', async () => {
  const { data: { session } } = await sb.auth.getSession()
  if (session) await enterApp(session.user)
})

/* ── AUTH ── */
async function login() {
  const email = document.getElementById('l-email').value.trim()
  const pass = document.getElementById('l-pass').value
  const errEl = document.getElementById('auth-err')
  const btn = document.getElementById('l-btn')
  errEl.style.display = 'none'
  if (!email || !pass) { showErr('Fill in all fields.'); return }
  btn.innerHTML = '<span class="spinner"></span>'
  btn.disabled = true
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass })
  if (error) { showErr('Incorrect email or password.'); btn.innerHTML = 'Sign in'; btn.disabled = false; return }
  await enterApp(data.user)
}

async function enterApp(user) {
  me = user
  const { data: p } = await sb.from('profiles').select('*').eq('id', user.id).single()
  profile = p
  const name = p?.full_name || user.email.split('@')[0]
  const initials = name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase()
  document.getElementById('u-av').textContent = initials
  document.getElementById('u-nm').textContent = name
  document.getElementById('u-role').textContent = p?.role === 'editor' ? 'Editor' : 'Vendor'
  if (p?.role === 'editor') document.getElementById('add-btn').style.display = 'flex'
  document.getElementById('auth-screen').style.display = 'none'
  document.getElementById('app').style.display = 'flex'
  loadProducts()
}

async function logout() {
  await sb.auth.signOut()
  me = null; profile = null
  document.getElementById('auth-screen').style.display = 'flex'
  document.getElementById('app').style.display = 'none'
  document.getElementById('l-pass').value = ''
}

function showErr(m) {
  const e = document.getElementById('auth-err')
  e.textContent = m; e.style.display = 'block'
}

document.getElementById('l-pass')?.addEventListener('keydown', e => { if (e.key === 'Enter') login() })

/* ── PRODUCTS ── */
async function loadProducts() {
  const pg = document.getElementById('pg')
  pg.style.display = 'grid'; pg.innerHTML = ''
  let q = sb.from('products').select('*').order('created_at', { ascending: false })
  if (division !== 'all') q = q.eq('division', division)
  const { data, error } = await q
  if (error) { toast('Error loading products'); return }
  if (!data?.length) {
    pg.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="empty-icon">◻</div><p>No products in this division yet.</p></div>`
    return
  }
  pg.innerHTML = data.map(p => cardHTML(p)).join('')
}

function cardHTML(p) {
  const c = DIV_CLR[p.division] || '#aaa'
  const ep = enc(p)
  const code = p.code || p.id.slice(0,6).toUpperCase()
  const lot = p.lot ? `LOT ${p.lot}` : ''
  const specs = p.specs || {}
  const desc = specs.Composition || specs.composition || p.description || ''
  const tags = (p.tags || []).slice(0,3).map(t => `<span class="tag">${t}</span>`).join('')

  const imgEl = p.image_url
    ? `<div class="card-img"><img src="${p.image_url}" alt="${p.name}" loading="lazy" /></div>`
    : `<div class="card-img-placeholder" style="background:${c}18"><svg width="32" height="32" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="3" stroke="${c}" stroke-width="1.5"/><circle cx="8.5" cy="8.5" r="1.5" stroke="${c}" stroke-width="1.2"/><path d="M3 16l5-5 4 4 3-3 6 6" stroke="${c}" stroke-width="1.2" stroke-linecap="round"/></svg></div>`

  return `<div class="card" onclick="openFicha(dec('${ep}'))">
    ${imgEl}
    <div class="card-body">
      <div class="card-div" style="color:${c}">${DIV_LBL[p.division]} · ${code}</div>
      <div class="card-name">${p.name}</div>
      ${lot ? `<div class="card-lot">${lot}</div>` : ''}
      <div class="card-desc">${desc}</div>
      <div class="tags">${tags}</div>
      <div class="card-actions" onclick="event.stopPropagation()">
        <button class="btn btn-ghost btn-sm" onclick="openFicha(dec('${ep}'))">View sheet</button>
        <button class="btn btn-primary btn-sm" onclick="quickReq(dec('${ep}'))">Request</button>
      </div>
    </div>
  </div>`
}

function enc(p) { return encodeURIComponent(JSON.stringify(p)) }
function dec(s) { return JSON.parse(decodeURIComponent(s)) }

function setDiv(d, el) {
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'))
  el.classList.add('active')
  division = d
  const t = d === 'all' ? 'All products' : `${DIV_LBL[d]} Division`
  document.getElementById('sec-title').textContent = t
  document.getElementById('sec-sub').textContent = 'Browse technical sheets and request samples'
  document.getElementById('tb-section').textContent = t
  if (profile?.role === 'editor') document.getElementById('add-btn').style.display = 'flex'
  loadProducts()
}

/* ── FICHA ── */
function openFicha(p) {
  selected = p
  const c = DIV_CLR[p.division] || '#aaa'
  const code = p.code || p.id.slice(0,6).toUpperCase()
  const eyebrow = document.getElementById('f-eyebrow')
  eyebrow.style.color = c
  eyebrow.textContent = `${DIV_LBL[p.division]} · ${code}${p.lot ? ' · LOT ' + p.lot : ''}`
  document.getElementById('f-name').textContent = p.name
  document.getElementById('ficha-body').innerHTML = fichaBody(p)
  document.getElementById('m-ficha').classList.add('open')
}

function fichaBody(p) {
  const specs = p.specs || {}
  const div = p.division

  let html = ''

  // Image
  if (p.image_url) {
    html += `<div class="ficha-img"><img src="${p.image_url}" alt="${p.name}" /></div>`
  }

  // Description
  if (p.description) {
    html += `<div class="ficha-sec"><div class="ficha-lbl">Description</div><p style="font-size:0.84rem;color:var(--text-2);line-height:1.65">${p.description}</p></div>`
  }

  // Fabric-specific layout
  if (div === 'fabric') {
    const fields = [
      ['Composition', specs.Composition],
      ['Country', p.country || 'Honduras'],
    ].filter(([,v]) => v)

    if (fields.length) {
      html += `<div class="ficha-sec"><div class="ficha-lbl">General</div><div class="spec-grid">`
      fields.forEach(([k,v]) => { html += `<div class="spec-item"><div class="spec-k">${k}</div><div class="spec-v">${v}</div></div>` })
      html += `</div></div>`
    }

    const measures = [
      ['Color', specs.Color],
      ['Dyed Method', specs['Dyed Method']],
      ['Width', specs.Width],
      ['GSM', specs.GSM],
      ['DIA', specs.DIA],
      ['Gauge', specs.Gauge],
    ].filter(([,v]) => v)

    if (measures.length) {
      html += `<div class="ficha-sec"><div class="ficha-lbl">Specifications</div><div class="spec-grid">`
      measures.forEach(([k,v]) => { html += `<div class="spec-item"><div class="spec-k">${k}</div><div class="spec-v">${v}</div></div>` })
      html += `</div></div>`
    }

    const yarns = [specs['Yarn 01'], specs['Yarn 02'], specs['Yarn 03']].filter(Boolean)
    if (yarns.length) {
      html += `<div class="ficha-sec"><div class="ficha-lbl">Yarns</div>`
      yarns.forEach((y, i) => { html += `<div class="yarn-row"><span class="yarn-lbl">Yarn ${String(i+1).padStart(2,'0')}</span><span class="yarn-val">${y}</span></div>` })
      html += `</div>`
    }

    if (specs.Comments) {
      html += `<div class="ficha-sec"><div class="ficha-lbl">Comments</div><p style="font-size:0.84rem;color:var(--text-2)">${specs.Comments}</p></div>`
    }
  } else {
    // Generic specs
    const entries = Object.entries(specs).filter(([,v]) => v)
    if (entries.length) {
      html += `<div class="ficha-sec"><div class="ficha-lbl">Specifications</div><div class="spec-grid">`
      entries.forEach(([k,v]) => { html += `<div class="spec-item"><div class="spec-k">${k}</div><div class="spec-v">${v}</div></div>` })
      html += `</div></div>`
    }
  }

  // Tags
  if (p.tags?.length) {
    html += `<div class="ficha-sec"><div class="ficha-lbl">Tags</div><div class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div></div>`
  }

  return html
}

/* ── LABEL ── */
function openLabel() {
  if (!selected) return
  const p = selected
  document.getElementById('lbl-title').textContent = p.name
  document.getElementById('label-preview').innerHTML = renderLabel(p)
  document.getElementById('m-label').classList.add('open')
}

        </div>
        <div style="font-size:5.5pt;font-weight:700;text-align:right;text-transform:uppercase;line-height:1.5">MANUFACTURED<br>IN ${country.toUpperCase()}</div>
      </div>

      <div style="display:flex;gap:6mm;margin-bottom:2mm">

          <div style="font-size:5.5pt;font-weight:700;text-transform:uppercase">Mill Article</div>

        </div>
        ${p.lot ? `<div>
          <div style="font-size:5.5pt;font-weight:700;text-transform:uppercase">LOT</div>

        </div>` : ''}
      </div>

      <hr style="border:none;border-top:2.5px solid #000;margin:2mm 0" />

      ${specs.Composition ? `
      <div style="margin-bottom:2mm">
        <div style="font-size:5.5pt;font-weight:700;text-transform:uppercase">Composition</div>

        ${specs['Dyed Method'] ? `<div style="flex:1"><div style="font-size:5.5pt;font-weight:700;text-transform:uppercase">Dyed Method</div><div style="font-size:8pt;font-weight:700;line-height:1.3">${specs['Dyed Method']}</div></div>` : ''}
      </div>
      <hr style="border:none;border-top:0.75px solid #ccc;margin:1.5mm 0" />` : ''}

      ${(specs.Width || specs.GSM || specs.DIA || specs.Gauge) ? `
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:1.5mm;margin:1.5mm 0">
        ${specs.Width ? `<div><div style="font-size:5.5pt;font-weight:700;text-transform:uppercase">Width</div><div style="font-size:9pt;font-weight:900">${specs.Width}</div></div>` : '<div></div>'}
        ${specs.GSM ? `<div><div style="font-size:5.5pt;font-weight:700;text-transform:uppercase">GSM</div><div style="font-size:9pt;font-weight:900">${specs.GSM}</div></div>` : '<div></div>'}
        ${specs.DIA ? `<div><div style="font-size:5.5pt;font-weight:700;text-transform:uppercase">DIA</div><div style="font-size:9pt;font-weight:900">${specs.DIA}</div></div>` : '<div></div>'}
        ${specs.Gauge ? `<div><div style="font-size:5.5pt;font-weight:700;text-transform:uppercase">Gauge</div><div style="font-size:9pt;font-weight:900">${specs.Gauge}</div></div>` : '<div></div>'}
      </div>
      <hr style="border:none;border-top:0.75px solid #ccc;margin:1.5mm 0" />` : ''}

      ${yarns.map((y, i) => `
      <div style="display:flex;gap:3mm;padding:1.5mm 0;border-bottom:0.5px solid #ccc">
        <div style="font-size:5.5pt;font-weight:700;text-transform:uppercase;min-width:14mm">Yarn ${String(i+1).padStart(2,'0')}</div>
        <div style="font-size:7pt;font-weight:700;line-height:1.3">${y}</div>
      </div>`).join('')}

      ${specs.Comments ? `

function printLabel() {
  const p = selected
  document.getElementById('print-root').innerHTML = renderLabel(p)
  document.getElementById('print-root').style.display = 'block'
  window.print()
  setTimeout(() => { document.getElementById('print-root').style.display = 'none' }, 1000)
}

function downloadPDF() { printLabel() }

/* ── SAMPLE REQUEST ── */
function openReq() {

  document.getElementById('r-name').textContent = selected.name
  document.getElementById('r-qty').value = ''
  document.getElementById('r-notes').value = ''
  close('m-ficha')
  document.getElementById('m-req').classList.add('open')
}

function quickReq(p) { selected = p; openReq() }

async function submitReq() {
  const qty = document.getElementById('r-qty').value.trim()
  if (!qty) { toast('Please specify the quantity'); return }
  const { error } = await sb.from('sample_requests').insert({
    product_id: selected.id, requested_by: me.id,
    quantity: qty, notes: document.getElementById('r-notes').value.trim(), status: 'pending'
  })
  if (error) { toast('Error sending request'); return }
  close('m-req'); toast('Request sent')
}

/* ── MY REQUESTS ── */
async function showRequests() {
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'))
  document.getElementById('nav-req').classList.add('active')
  document.getElementById('sec-title').textContent = 'My requests'

  document.getElementById('tb-section').textContent = 'My requests'

    <div class="fg full"><label>Tags (comma separated)</label><input type="text" id="f-tags" placeholder="e.g. scuba, double knit, recycled" /></div>
  </div>`

const GENERIC_FIELDS = `
  <div class="two-col">
    <div class="fg full"><label>Description</label><input type="text" id="g-desc" placeholder="Brief product description" /></div>
    <div class="fg"><label>Spec 1 — Name</label><input type="text" id="g-s1k" placeholder="e.g. Micronage" /></div>
    <div class="fg"><label>Spec 1 — Value</label><input type="text" id="g-s1v" placeholder="e.g. 18.5 mic" /></div>
    <div class="fg"><label>Spec 2 — Name</label><input type="text" id="g-s2k" placeholder="e.g. Origin" /></div>
    <div class="fg"><label>Spec 2 — Value</label><input type="text" id="g-s2v" placeholder="e.g. Australia" /></div>
    <div class="fg"><label>Spec 3 — Name</label><input type="text" id="g-s3k" placeholder="e.g. Composition" /></div>
    <div class="fg"><label>Spec 3 — Value</label><input type="text" id="g-s3v" placeholder="e.g. 100% Wool" /></div>
    <div class="fg"><label>Spec 4 — Name</label><input type="text" id="g-s4k" placeholder="e.g. Presentation" /></div>
    <div class="fg"><label>Spec 4 — Value</label><input type="text" id="g-s4v" placeholder="e.g. 200kg bales" /></div>
    <div class="fg full"><label>Tags (comma separated)</label><input type="text" id="g-tags" placeholder="e.g. merino, fine, natural" /></div>
  </div>`

function renderFormFields() {
  const d = document.getElementById('np-div').value
  document.getElementById('div-fields').innerHTML = d === 'fabric' ? FABRIC_FIELDS : GENERIC_FIELDS
}

function openAdd() {
  ['np-name','np-code','np-lot','np-country'].forEach(id => { const el = document.getElementById(id); if (el) el.value = '' })
  document.getElementById('np-country').value = 'Honduras'
  document.getElementById('np-div').value = division !== 'all' ? division : 'fabric'
  renderFormFields()
  document.getElementById('img-prev').style.display = 'none'
  document.getElementById('np-img').value = ''
  document.getElementById('m-add').classList.add('open')
}

function previewImg(input) {
  const file = input.files[0]
  if (!file) return
  const reader = new FileReader()
  reader.onload = e => {
    const prev = document.getElementById('img-prev')
    prev.src = e.target.result
    prev.style.display = 'block'
  }
  reader.readAsDataURL(file)
}

async function saveProduct() {
  const name = document.getElementById('np-name').value.trim()
  if (!name) { toast('Product name is required'); return }

  const div = document.getElementById('np-div').value
  let specs = {}, tags = [], description = ''

  if (div === 'fabric') {
    const g = id => document.getElementById(id)?.value?.trim() || ''
    specs = {
      Composition: g('f-composition'), Color: g('f-color'), 'Dyed Method': g('f-dyed'),
      Width: g('f-width'), GSM: g('f-gsm'), DIA: g('f-dia'), Gauge: g('f-gauge'),
      'Yarn 01': g('f-yarn1'), 'Yarn 02': g('f-yarn2'), 'Yarn 03': g('f-yarn3'),
      Comments: g('f-comments')
    }
    Object.keys(specs).forEach(k => { if (!specs[k]) delete specs[k] })
    tags = (document.getElementById('f-tags')?.value || '').split(',').map(t => t.trim()).filter(Boolean)
  } else {
    description = document.getElementById('g-desc')?.value?.trim() || ''
    ;[1,2,3,4].forEach(i => {
      const k = document.getElementById(`g-s${i}k`)?.value?.trim()
      const v = document.getElementById(`g-s${i}v`)?.value?.trim()
      if (k && v) specs[k] = v
    })
    tags = (document.getElementById('g-tags')?.value || '').split(',').map(t => t.trim()).filter(Boolean)
  }

  // Upload image
  let image_url = null
  const imgFile = document.getElementById('np-img').files[0]
  if (imgFile) {
    const ext = imgFile.name.split('.').pop()
    const path = `${me.id}/${Date.now()}.${ext}`
    const { error: upErr } = await sb.storage.from('product-images').upload(path, imgFile)
    if (upErr) { toast('Error uploading image'); return }
    const { data: urlData } = sb.storage.from('product-images').getPublicUrl(path)
    image_url = urlData.publicUrl
  }

  const { error } = await sb.from('products').insert({
    name, division: div,
    code: document.getElementById('np-code').value.trim() || null,
    lot: document.getElementById('np-lot').value.trim() || null,
    country: document.getElementById('np-country').value.trim() || 'Honduras',
    description, specs, tags, image_url, created_by: me.id
  })

  if (error) { toast('Error saving product'); return }
  close('m-add'); toast('Product saved'); loadProducts()
}

/* ── UTILS ── */
function close(id) { document.getElementById(id).classList.remove('open') }
document.querySelectorAll('.overlay').forEach(el => { el.addEventListener('click', e => { if (e.target === el) el.classList.remove('open') }) })
function toast(msg) {
  const t = document.getElementById('toast')
  t.textContent = msg; t.classList.add('show')
  setTimeout(() => t.classList.remove('show'), 2800)
}
</script>
</body>
</html>
